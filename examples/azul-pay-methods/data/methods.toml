# methods.toml: the payment methods people pay with, country by country, and the providers that carry them.
#
# Read from the providers' documentation 2026-10-15 to 2026-10-17 (each entry lists its sources). Facts only, at
# provider and country level: nothing here is tied to one app's prices, tiers or policy, so any app can use the file. Fees are list prices for a merchant in Germany.
#
# Format 2 (azul-pay-methods parses it and refuses any other format; a country's list is everything its payers are
# offered). Four kinds of table: [[provider]], [[method]], [[route]], [[country]].
# EVERY entry has EVERY key of its kind, in this order. Unknown values are "" (strings), 0 or -1 (numbers, as noted),
# false (booleans) or [] (lists); they are never omitted. New keys may be added at the end of an entry later; existing
# keys never change their meaning (`format` is raised when one must).
#
# Amounts are strings "<ISO 4217 code> <decimal>" ("EUR 0.25"), parsed into minor units. Percentages are integer basis
# points (160 = 1.60 %), so every reader computes the same cents.
#
# [[provider]] - a payment provider
#   id                 string  stable id; adapters and test fakes name it ("fake-stripe" serves the routes of "stripe")
#   name               string  display name
#   kind               string  processor | aggregator | merchant_of_record
#   onboarding         string  self_serve | sales | invite | closed  (for a business in merchant_countries)
#   merchant_countries list    ISO 3166-1 alpha-2 codes where a business may sign up; ["*"] = anywhere
#   origins            list    hosts its pages may navigate to inside an app's webview; [] = none known, so its pages
#                              open in the system browser only
#   webhook            string  stripe_signature | gocardless_signature | mollie_fetch | paypal_verify | komoju_secret |
#                              unknown
#   payout             string  one line: the currencies and the way money reaches the merchant
#   docs               string  the provider's method overview
#   sources            list    URLs
#
# [[method]] - what a payer chooses (the pill)
#   id          string  stable id, the same across providers
#   name        string  descriptive text only; apps and test fakes never show a logo or wordmark from this file
#   family      string  card | wallet | bank_redirect | bank_debit | realtime | bnpl | voucher | bank_transfer
#   flow        string  what the payer does: fields | redirect | qr | code | push | voucher | debit | transfer
#   handoff     string  where the payer finishes: none | phone_qr | phone_push | bank_app | bank_login |
#                       provider_login | store_cash | bank_transfer
#   countries   list    payer countries; ["*"] = anywhere
#   currencies  list    ISO 4217 codes the method is paid in; ["*"] = most
#
# [[route]] - one way to accept a method: a (method, provider) pair
#   method              string  a method id
#   provider            string  a provider id
#   provider_type       string  the provider's own id for it (Stripe payment_method_types value, Mollie method,
#                               GoCardless scheme, dLocal payment_method_id)
#   status              string  ga | preview | invite | sales | verify
#   merchant_countries  list    [] = the provider's list; else only these merchant countries may use the route
#   currencies          list    presentment currencies of this route
#   adaptive            bool    payable on a session priced in another currency, converted by the provider (one-off)
#   adaptive_recurring  bool    the same for recurring charges
#   recurring           string  none | mandate | via_sepa_debit | send_invoice
#                               mandate: later charges without the payer; via_sepa_debit: the first payment creates a
#                               SEPA Direct Debit mandate; send_invoice: the payer pays each period again (prepaid)
#   recurring_cap       string  the largest recurring charge ("INR 15000"); "" = none known
#   min, max            string  amount limits; "" = the provider's default
#   expires_minutes     integer how long a code, QR or voucher lives; 0 = not applicable
#   settles             string  instant | minutes | days  (when the outcome is known)
#   surfaces            list    where an app may show it, best first: sheet | iban | fields | page | browser.
#                               A login (handoff bank_login or provider_login) or webview = forbidden / discouraged is
#                               ["browser"] (or ["sheet", "browser"]); a provider without origins is browser-only.
#   webview             string  allowed | discouraged | forbidden  (the provider's or the scheme's rule)
#   fee_known           bool    false: no public list price (contract)
#   fee_bps             integer percentage part in basis points
#   fee_fixed           string  fixed part per payment ("" = none)
#   fee_cap             string  the most one payment costs ("" = no cap)
#   fee_note            string  other fee facts, one line
#   refund_days         integer how long a payment can be refunded; 0 = no refunds; -1 = unknown
#   disputes            string  none | chargeback | claims | bank | unknown
#   payer_data          list    what the provider's own page asks the payer: name | email | phone | tax_id | national_id |
#                               address. The payer types it there; the merchant's server never sees it.
#   test_inputs         list    the provider's documented test data, as { field, value, outcome, note, after_minutes };
#                               outcome is succeeded | failed | requires_action | disputed; after_minutes is how long
#                               the provider takes to decide (0 = at once). Test fakes accept these inputs only, and
#                               fake exactly the routes that have a succeeded row.
#   sources             list    URLs
#   read_on             string  date the sources were read
#   note                string  anything else, one line
#   request_data        list    what the provider's API wants in the merchant's own request (the same names as
#                               payer_data): the app asks the payer for exactly these, the merchant's server passes
#                               them on in that one request and keeps none of them. Together with payer_data it is
#                               the personal data the route needs (an app says so before the payer picks it).
#
# [[country]] - what people pay with
#   code       string  ISO 3166-1 alpha-2; "*" = every country without its own entry
#   name       string  English name
#   currency   string  the local currency
#   mix        table   e-commerce value share in percent: wallets, a2a, bnpl, crypto, credit, debit, cash ({} = unknown;
#                      "<1 %" is 0). Card-funded wallets count as wallets, as in the source.
#   mix_year   integer the year the mix describes; 0 = no mix
#   prefer     list    the methods payers of the country are offered, most used first: an app shows these and only
#                      these, in this order (a method that serves the country but is not listed is not offered there).
#                      From the research's usage shares (PAYMENT-METHODS.md §3: who pays with what, then the routes
#                      the research names for recurring plans); every euro-area list ends with SEPA Direct Debit,
#                      which every euro account can be debited by (Regulation (EU) 260/2012).
#   sources    list    URLs

format = 2
read_on = "2026-10-17"

