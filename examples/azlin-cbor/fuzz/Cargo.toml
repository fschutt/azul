# The fuzz targets of azlin-cbor (planning/architecture.md section 1.4 rule 3: "every parser has a
# fuzz target"): bytes that other devices, other people and the network wrote. `panic = "abort"`
# is the shipped profile, so every panic these find is an abort of the app.
#
# cargo-fuzz project of its own (its own workspace and lock, like examples/azul-storage/fuzz):
# `cargo install cargo-fuzz`, then from this folder
#
#     cargo +nightly fuzz build                   # what CI does; it never runs them
#     cargo +nightly fuzz run decode              # an hour on a quiet machine
#
# The entry points are the same the unit tests run on a few thousand fixed inputs
# (`tests/fuzz_inputs.rs`): both targets include `tests/common/fuzz_entry.rs` by path, so a target
# here is a few lines: take the bytes, call the entry. `decode` holds the signature rule against
# every input (what `decode` accepts, `encode` writes again byte for byte); `int_map` reads what
# `decode` accepts with every accessor and round-trips structs written by `IntMapBuilder`.
# `corpus/` is not committed.
[package]
name = "azlin-cbor-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
azlin-cbor = { path = ".." }

# Not a member of azul's workspace: it needs nightly and libfuzzer, and keeps both out of the
# lockfile of the apps.
[workspace]

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "int_map"
path = "fuzz_targets/int_map.rs"
test = false
doc = false
bench = false
