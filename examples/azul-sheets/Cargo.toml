[package]
name = "AzSheets"
version = "0.1.0"
edition = "2021"
authors = ["Felix Schuett <felix.schuett@maps4print.com>"]
license = "MIT"
description = """
    AzSheets - an Excel-like spreadsheet on the public azul API: the
    DocumentShell with a ribbon, a formula bar, the CellGrid widget, sheet tabs
    and a status bar with the selection's Sum / Average / Count. The engine is
    IronCalc behind the `SheetEngine` trait, on its own thread with a 256 MB
    stack (IronCalc evaluates recursively); the UI talks to it by messages and
    never blocks. Workbooks are files: `sheets/<uuid>.xlsx` plus a small JSON
    sidecar, written through azul-storage's `Drive` (a LocalDrive today).
"""
publish = false

[dependencies]
azul = { path = "../../dll", package = "azul-dll", default-features = false, features = ["link-dynamic"] }
azul-storage = { path = "../azul-storage" }
# The spreadsheet engine, pinned: the version the engine study benchmarked
# (crates.io max_stable_version on 2026-10-01).
ironcalc = "=0.8.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# IronCalc's own CSV reader parses `paste_csv_string`; the same crate writes it.
csv = "1.4"
uuid = { version = "1", features = ["v4"] }

[lib]
name = "azsheets"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "AzSheets"
path = "src/main.rs"
