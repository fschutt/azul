[package]
name = "AzCalendar"
version = "0.1.0"
edition = "2021"
authors = ["Felix Schuett <felix.schuett@maps4print.com>"]
license = "MIT"
description = """
    AzCalendar - a small calendar on the public azul API that makes AzMeet
    links, online or not. A week view (the whole day, scrolling and zooming)
    lists the events of the shown week; a click or a drag, or "New event",
    saves one JSON file per event (<data dir>/events/<id>.json, the same
    layout as an object store's keys) and, with "Add AzMeet link", a link
    made in the app, registered with the meeting server (the `meet` Worker,
    Settings > Meeting server) as soon as it answers. "Join meeting" opens
    AzMeet with AZMEET_JOIN=<link>.
"""
publish = false

[dependencies]
azul = { path = "../../dll", package = "azul-dll", default-features = false, features = ["link-dynamic"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The same features azul-layout builds chrono with (dates, and the local date for "today").
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[lib]
name = "azcalendar"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "AzCalendar"
path = "src/main.rs"
