[package]
name = "AzWriter"
version = "0.1.0"
edition = "2021"
authors = ["Felix Schütt <felix.schuett@maps4print.com>"]
license = "MIT"
description = """
    AzWriter — a print-layout document editor demo in the classic
    office-suite look: title band (quick-access toolbar), ribbon,
    paginated white-sheet canvas with a 3-page VirtualView window,
    streaming background pagination, status bar with live page counts,
    markdown open/save, structural undo/redo through the engine's
    document-edit changesets, and PDF export via the paged pipeline.
"""
publish = false

[dependencies]
# Desktop/production links DYNAMICALLY: the same binary is copied into the
# container and the engine arrives as libazul*.so from the base image (see
# Dockerfile). `link-static` exists only for LOCAL lift debugging on a host
# without a prebuilt libazul - see the `web-lift-static` feature below.
azul = { path = "../../dll", package = "azul-dll", default-features = false }
pulldown-cmark = { version = "0.9", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The docx importer (MIT): AzWriter consumes its JSON wire through the serde
# subset mirror in src/ir.rs. Pinned by rev — the wire is Serialize-only
# upstream, so schema drift must be an explicit, reviewed bump.
docx-parser = { git = "https://github.com/yukiyokotani/office-open-xml-viewer", rev = "c1983b7174ccefabd2ed80527813ea8c80782af3" }

# Android: build as a NativeActivity cdylib — link android-activity into libazul
# and use `ctor` for the load-time constructor that stashes the window options.
# Mobile has no libazul.dylib to load, so the engine links STATICALLY here.
[target.'cfg(target_os = "android")'.dependencies]
azul = { path = "../../dll", package = "azul-dll", default-features = false, features = ["link-static", "android-activity", "pdf"] }
ctor = "0.2"

# iOS links the engine STATICALLY too. The default (desktop) dependency uses
# `link-dynamic`, which compiles only extern declarations and expects a
# libazul.dylib at runtime — there is none inside a .app (same reason Android
# uses link-static).
[target.'cfg(target_os = "ios")'.dependencies]
azul = { path = "../../dll", package = "azul-dll", default-features = false, features = ["link-static", "pdf"] }
# JSON reflection for the web backend: DocState derives Serialize/Deserialize
# and a tiny bridge maps serde_json text <-> azul's Json type (see main.rs).
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# rlib = what the desktop/iOS bin links; cdylib = the Android NativeActivity lib.
[lib]
name = "azwriter"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "AzWriter"
path = "src/main.rs"

[dev-dependencies]
# Test-only: inflate PDF content streams so the export test can assert on
# the text-matrix geometry inside them (streams are FlateDecode-compressed).
flate2 = "1"

[features]
default = ["link-dynamic"]
link-dynamic = ["azul/link-dynamic"]
# LOCAL DEBUG ONLY - compiles the engine into the binary so the x86 lifter has
# a self-contained image, for hosts with no libazul to link against. Production
# uses the default dynamic build + the Dockerfile prelift flow.
web-lift-static = ["azul/link-static", "azul/web", "azul/web-transpiler"]
# Engine telemetry (opt-in at runtime via AZ_TELEMETRY): frame durations +
# solver/raster spans from real runs, e.g. driving the app through e2e tests
# to find where it stutters.
telemetry = ["azul/telemetry"]
