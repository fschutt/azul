[package]
name = "AzReview"
version = "0.1.0"
edition = "2021"
authors = ["Felix Schütt <felix.schuett@maps4print.com>"]
license = "MIT"
description = "AzReview - ink-first code review"
publish = false

[dependencies]
azul = { path = "../../dll", package = "azul-dll", default-features = false, features = ["link-dynamic"] }
# The shared app skeleton: switches, data root, settings.json, About, file jobs on a Thread.
azul-appkit = { path = "../azul-appkit", features = ["azul"] }

[lib]
name = "azul_review"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "AzReview"
path = "src/main.rs"
