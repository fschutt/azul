[package]
name = "AzReview"
version = "0.1.0"
edition = "2021"
authors = ["Felix Schütt <felix.schuett@maps4print.com>"]
license = "MIT"
description = "AzReview - ink-first code review"
publish = false

[dependencies]
azul = { path = "../../dll", package = "azul-dll", default-features = false, features = ["link-dynamic"] }
# The shared app skeleton: switches, data root, settings.json, About, file jobs on a Thread.
azul-appkit = { path = "../azul-appkit", features = ["azul"] }
# serde (derive) and serde_json: both are in Cargo.lock already through azul-appkit, the same specs. The
# recorder's manifest, transcript and events are strict JSON schemas (recorder_manifest.rs,
# recorder_events.rs); the agents' JSON is a small facade over serde_json (agent_json.rs: the CLIs'
# envelopes, the APIs' bodies, the model's own reply).
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "azul_review"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "AzReview"
path = "src/main.rs"

# What macOS shows when AzReview first asks for a permission (azul-doc's `bundle macos` writes them
# into the Info.plist). Without the two keys the system's speech recognition refuses an app (an
# unbundled `target/release/AzReview` has neither: dictation answers "unavailable" and says why),
# and the voice clips' microphone is refused.
[package.metadata.bundle]
usage = [
    "NSMicrophoneUsageDescription=AzReview records your voice clips and listens while you dictate a note with the pen at rest.",
    "NSSpeechRecognitionUsageDescription=AzReview turns what you say, while the pen rests on the code, into a note.",
]
