[package]
name = "AzReview"
version = "0.1.0"
edition = "2021"
authors = ["Felix Schütt <felix.schuett@maps4print.com>"]
license = "MIT"
description = "AzReview - ink-first code review"
publish = false

[dependencies]
azul = { path = "../../dll", package = "azul-dll", default-features = false, features = ["link-dynamic"] }
# The shared app skeleton: switches, data root, settings.json, About, file jobs on a Thread.
azul-appkit = { path = "../azul-appkit", features = ["azul"] }
# serde (derive) and serde_json: both are in Cargo.lock already through azul-appkit, the same specs. The
# recorder's manifest, transcript and events are strict JSON schemas (recorder_manifest.rs,
# recorder_events.rs); the agents' JSON is a small facade over serde_json (agent_json.rs: the CLIs'
# envelopes, the APIs' bodies, the model's own reply).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SHA-256 of the lines a code reference of a whiteboard covers, so that a published board can be checked against the file at
# its revision (whiteboard_hash.rs): the same sha2 0.10 that Cargo.lock holds already (azul-dll's own dependencies).
sha2 = "0.10"
# What AzReview and the phone companion say to each other (the host a Mac runs, the pairing, the iroh link behind the feature
# `azul`): a workspace crate, so Cargo.lock gains the edge from AzReview to it and no external crate (its sha2 and hmac are in the lock
# already). Nothing listens until the user turns the companion on (companion_plug.rs).
azul-review-link = { path = "../azul-review-link", features = ["azul"] }

[lib]
name = "azul_review"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "AzReview"
path = "src/main.rs"

# What macOS shows when AzReview first asks for a permission (azul-doc's `bundle macos` writes them
# into the Info.plist). Without a key the system refuses the app that asks (and, for the camera, kills it at the
# first access): the microphone for the voice clips and the dictation, speech recognition for the dictation, the
# camera for the presenter. A bare `target/release/AzReview` has no Info.plist: started from the Terminal it is
# the Terminal's permissions that count (the Terminal holds speech and the microphone), so dictation listens;
# as an .app the keys below are what the system's prompts say.
[package.metadata.bundle]
usage = [
    "NSCameraUsageDescription=AzReview shows your camera in the recording window and records it with the session when you ask it to.",
    "NSMicrophoneUsageDescription=AzReview records your voice clips and listens while you dictate a note with the pen at rest.",
    "NSSpeechRecognitionUsageDescription=AzReview turns what you say, while the pen rests on the code, into a note.",
    "NSCameraUsageDescription=AzReview records your camera while you present a review, so you can explain the code in a video.",
]
