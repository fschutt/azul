# W1-SCAF skeleton (OWNERSHIP.md section 5, COMMON-W1R.md R2): the FINAL manifest. Lanes never edit it: a missing dependency is a drift row.

[package]
name = "azlin-teamlog"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
authors = ["Felix Schuett <felix.schuett@maps4print.com>"]
license = "MIT"
description = "Azlin team log: ops, roles, groups, the permission check (admit) and the deterministic apply"
publish = false

[dependencies]
azlin-seams = { path = "../azlin-seams" }
azlin-chain = { path = "../azlin-chain" }
azlin-policy = { path = "../azlin-policy" }
blake3 = "1.8"
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
zeroize = "1.8"
thiserror = "2"
