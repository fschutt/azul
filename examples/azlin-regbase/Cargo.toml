# W1-SCAF skeleton (OWNERSHIP.md section 5, COMMON-W1R.md R2): the FINAL manifest. Lanes never edit it: a missing dependency is a drift row.

[package]
name = "azlin-regbase"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
authors = ["Felix Schuett <felix.schuett@maps4print.com>"]
license = "MIT"
description = "Azlin registry vocabulary: ids, time, bytes, enums, anchors, signing and proofs shared by the registry and the client"
publish = false

[dependencies]
azlin-keys = { path = "../azlin-keys", default-features = false }
azlin-seams = { path = "../azlin-seams" }
ed25519-dalek = "2.2.0"
blake3 = "1.8"
subtle = "2"
thiserror = "2"
zeroize = "1.8"
