[package]
name = "AzCalculator"
version = "0.1.0"
edition = "2021"
authors = ["Felix Schuett <felix.schuett@maps4print.com>"]
license = "MIT"
description = """
    AzCalculator - the first Azlin app (build ledger step 1, F9), the vehicle
    for the shared skeleton (azul-appkit: switches, data layout, settings,
    shortcuts, About). One window that grows with its size: the small
    standard calculator, the programmer one when widened (HEX / DEC / OCT /
    BIN, bit toggles, word size, bitwise keys), the graphing one when large
    (scientific keys, the expression typeset, a plot of the typed functions
    of x with zoom and pan); Date calculation and a unit converter, a
    history (calculator/history.jsonl in the user's data folder, written on
    an azul Thread through azul-storage) and a memory; typed input as the
    keyboard layout types it (names like sqrt and sin letter by letter),
    copy and paste. Exact decimal arithmetic (bigdecimal, already in the
    tree): 0.1 + 0.2 is 0.3. Built on azul's S9 UtilityShell, NoTitle with
    the app-drawn Titlebar, flat and flora, light and dark.
"""
publish = false

[dependencies]
azul = { path = "../../dll", package = "azul-dll", default-features = false, features = ["link-dynamic"] }
azul-appkit = { path = "../azul-appkit", features = ["azul"] }
# Already in Cargo.lock (through turso_core) and in the local registry.
bigdecimal = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "azcalculator"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "AzCalculator"
path = "src/main.rs"
