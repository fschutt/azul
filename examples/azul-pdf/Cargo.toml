[package]
name = "AzPdf"
version = "0.1.0"
edition = "2021"
authors = ["Felix Schuett <felix.schuett@maps4print.com>"]
license = "MIT"
description = """
    AzPdf - a PDF viewer on the public azul API: open a PDF (file dialog, a
    file on the command line, a dropped file, the recent documents), page
    thumbnails and the outline in a side rail, the pages in a continuous view
    with zoom (fit width, fit page, percent) and page navigation, and search
    in the pages' text. azul parses the PDF once (ParsedPdf, printpdf) and
    hands each page over as SVG; azul's SVG renderer draws it into a picture
    on a Thread. The recent documents live in the data tree
    (`pdf/recent.json`).
"""
publish = false

[dependencies]
azul = { path = "../../dll", package = "azul-dll", default-features = false, features = ["link-dynamic"] }
# The Azlin app skeleton: the switches, the data root, settings, About, file jobs on a Thread,
# the one find matcher.
azul-appkit = { path = "../azul-appkit", features = ["azul"] }
# recent.json (already in the tree through azul-appkit and azul-storage).
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "azpdf"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "AzPdf"
path = "src/main.rs"
