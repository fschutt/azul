[package]
name = "AzMeet"
version = "0.1.0"
edition = "2021"
authors = ["Felix Schuett <felix.schuett@maps4print.com>"]
license = "MIT"
description = """
    azul-meet - a Google-Meet-style demo on the public azul API. A meeting UI
    whose toolbar toggles enable/disable microphone, camera and screen-share;
    each toggle triggers a relayout so the DOM gains/loses a CameraWidget /
    ScreenCaptureWidget / MicrophoneWidget (whose AfterMount starts the capture).
    Remote participants are grey placeholders; the local user is a live tile.
    Auto-joins a generated 'meeting link'. Sending media to remote peers over
    the wire is the WebTransport follow-up.
"""
publish = false

[dependencies]
azul = { path = "../../dll", package = "azul-dll", default-features = false, features = ["link-dynamic"] }

# rlib = what the desktop/iOS bin links; cdylib = the Android NativeActivity lib.
[lib]
name = "azmeet"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "AzMeet"
path = "src/main.rs"

[target.'cfg(target_os = "android")'.dependencies]
azul = { path = "../../dll", package = "azul-dll", default-features = false, features = ["link-static", "android-activity"] }
ctor = "0.2"

# iOS links the engine STATICALLY. The default (desktop) dependency uses
# `link-dynamic`, which compiles only extern declarations and expects a
# libazul.dylib at runtime — there is none inside a .app, so the device build
# failed at link time with "_AzWindowCreateOptions_create ... symbol(s) not
# found for architecture arm64". Same reason Android uses link-static.
[target.'cfg(target_os = "ios")'.dependencies]
azul = { path = "../../dll", package = "azul-dll", default-features = false, features = ["link-static"] }
