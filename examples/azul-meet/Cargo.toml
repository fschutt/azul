[package]
name = "AzMeet"
version = "0.1.0"
edition = "2021"
authors = ["Felix Schuett <felix.schuett@maps4print.com>"]
license = "MIT"
description = """
    azul-meet - a Google-Meet-style app on the public azul API. With a meeting
    server (the `meet` Worker, AZMEET_WORKER) it starts a meeting or joins one
    by its link, and connects to every participant over azul.iroh: every
    captured frame is H.264-encoded where an encoder works (VideoToolbox on
    macOS; keyframe requests on loss) and JPEG-encoded otherwise, and decoded
    into that participant's tile. Without a reachable meeting server it opens the
    in-process demo: Ada in a CPU-rendered window with her camera and Ben in a
    GPU-rendered window sharing his screen.
"""
publish = false

[dependencies]
azul = { path = "../../dll", package = "azul-dll", default-features = false, features = ["link-dynamic"] }

[lib]
name = "azmeet"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "AzMeet"
path = "src/main.rs"

[target.'cfg(target_os = "android")'.dependencies]
azul = { path = "../../dll", package = "azul-dll", default-features = false, features = ["link-static", "android-activity"] }
ctor = "0.2"

[target.'cfg(target_os = "ios")'.dependencies]
azul = { path = "../../dll", package = "azul-dll", default-features = false, features = ["link-static"] }
