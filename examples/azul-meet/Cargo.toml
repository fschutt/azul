[package]
name = "AzMeet"
version = "0.1.0"
edition = "2021"
authors = ["Felix Schuett <felix.schuett@maps4print.com>"]
license = "MIT"
description = """
    azul-meet - a Google-Meet-style app on the public azul API. With a meeting
    server (the `meet` Worker, AZMEET_WORKER) it starts a meeting or joins one
    by its link through a waiting room (the camera preview, the microphone and
    camera switches, the devices, the name), and connects to every participant
    over azul.iroh: every captured frame is H.264-encoded where an encoder
    works (VideoToolbox on macOS; keyframe requests on loss) and JPEG-encoded
    otherwise, and decoded into that participant's tile. The gear opens the
    settings page the Azlin apps share. Without a reachable meeting server it
    opens the in-process demo: Ada in a CPU-rendered window and Ben in a
    GPU-rendered one (her camera and his screen share off until switched on).
"""
publish = false

[dependencies]
azul = { path = "../../dll", package = "azul-dll", default-features = false, features = ["link-dynamic"] }
# Plain Rust (no azul): the avatars' initials (azul_pim::initials, DEDUP_EDITORS B24).
azul-pim = { path = "../azul-pim" }
# The Azlin skeleton with its UI (`azul`): the switches, the data root, the settings file and the
# settings page every Azlin app shares (the gear opens it), the file jobs. Its `azul` dependency
# is the link-dynamic one above, which every target has already (AzMaps and AzPaint build for
# android / ios the same way). And the drive they run on.
azul-appkit = { path = "../azul-appkit", features = ["azul"] }
azul-storage = { path = "../azul-storage" }
# chat.jsonl and meeting.json (already in the tree through azul-appkit).
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "azmeet"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "AzMeet"
path = "src/main.rs"

[target.'cfg(target_os = "android")'.dependencies]
azul = { path = "../../dll", package = "azul-dll", default-features = false, features = ["link-static", "android-activity"] }
ctor = "0.2"

[target.'cfg(target_os = "ios")'.dependencies]
azul = { path = "../../dll", package = "azul-dll", default-features = false, features = ["link-static"] }
