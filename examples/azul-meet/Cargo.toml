[package]
name = "AzMeet"
version = "0.1.0"
edition = "2021"
authors = ["Felix Schuett <felix.schuett@maps4print.com>"]
license = "MIT"
description = """
    azul-meet - a Google-Meet-style demo on the public azul API. Opens two
    participants in one process, Ada in a CPU-rendered window with her camera
    and Ben in a GPU-rendered window sharing his screen, linked by azul.iroh
    endpoints: every captured frame is JPEG-encoded, sent as one QUIC stream,
    and decoded into the other window's remote tile. Without a peer link it
    falls back to a single window with placeholder participants.
"""
publish = false

[dependencies]
azul = { path = "../../dll", package = "azul-dll", default-features = false, features = ["link-dynamic"] }

[lib]
name = "azmeet"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "AzMeet"
path = "src/main.rs"

[target.'cfg(target_os = "android")'.dependencies]
azul = { path = "../../dll", package = "azul-dll", default-features = false, features = ["link-static", "android-activity"] }
ctor = "0.2"

[target.'cfg(target_os = "ios")'.dependencies]
azul = { path = "../../dll", package = "azul-dll", default-features = false, features = ["link-static"] }
