[package]
name = "AzPaint"
version = "0.1.0"
edition = "2021"
authors = ["Felix Schütt <felix.schuett@maps4print.com>"]
license = "MIT"
description = """
    AzPaint - paint with the mouse, a finger or a stylus (multi-touch
    TouchPointVec, PenState pressure / tilt / twist): brush or metaball
    strokes over an imported picture, undo / redo, PNG and SVG exports into
    the data folder through the Drive. On azul-appkit (switches, data root,
    settings remembered, About).
"""
publish = false

[dependencies]
azul = { path = "../../dll", package = "azul-dll", default-features = false, features = ["link-dynamic"] }
# The app skeleton every Azlin app shares: switches, data root, settings
# remembered, shortcuts, About, the undo history, file jobs on a Thread.
azul-appkit = { path = "../azul-appkit", features = ["azul"] }

[target.'cfg(target_os = "android")'.dependencies]
azul = { path = "../../dll", package = "azul-dll", default-features = false, features = ["link-static", "android-activity"] }
ctor = "0.2"

[lib]
name = "azul_paint"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "AzPaint"
path = "src/main.rs"

[target.'cfg(target_os = "ios")'.dependencies]
azul = { path = "../../dll", package = "azul-dll", default-features = false, features = ["link-static"] }
