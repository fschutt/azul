# The Email Worker on YOUR Cloudflare account: Email Routing -> "Send to a Worker" -> this one.
# `npx wrangler deploy` from this folder; then set the secrets below with `npx wrangler secret put`.
name = "azlin-mail-worker"
main = "src/worker.js"
compatibility_date = "2026-01-01"

[vars]
# The drive's bucket (what the Azlin app shows under the drive's "Incoming mail" settings).
S3_ENDPOINT = "https://s3.example.invalid"
S3_BUCKET = "your-drive-bucket"
S3_REGION = "us-east-1"
# The drive's id: an encrypted drive's drops name it (any value for a plain drive).
AZLIN_DRIVE_ID = "your-drive-id"

# Secrets (never in this file):
#   S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY   the drive's write credentials for incoming mail
#   S3_SESSION_TOKEN                         only with temporary credentials
#   AZLIN_DROP_PUBLIC_KEY                    an encrypted drive's drop key (64 hex digits); the
#                                            app sets it with your own Cloudflare API token
