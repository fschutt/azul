[package]
name = "AzMaps"
version = "0.1.0"
edition = "2021"
authors = ["Felix Schütt <felix.schuett@maps4print.com>"]
license = "MIT"
description = """
    AzMaps — the P3 goal app from SUPER_PLAN_2. Demonstrates the
    `MapWidget` (layout/src/widgets/map.rs) end-to-end on desktop:
    Web Mercator tile grid, viewport state, GPU-translated tile
    divs, `MapTileCache` `RefAny` dataset that survives relayout via
    a `DatasetMergeCallback`. Tile fetch + MVT decode + MapCSS-to-SVG
    pipeline land in follow-up ticks; this demo shows the grid math
    + viewport bookkeeping working today.
"""
publish = false

[dependencies]
# `map-tiles` is what makes `map_widget_dom` wire the MVT fetch worker instead
# of returning the placeholder DOM — see the contract test in src/lib.rs. It has
# to be asked for HERE, not left to the dylib: `link-dynamic` only reaches the
# `build-dll` libazul (which does carry the feature) while nothing unifies
# `cabi_internal` into azul-dll. `examples/rust` takes azul-dll's DEFAULT
# features, and those include `link-static` -> `cabi_export` -> `cabi_internal`,
# so any build covering both packages flips this crate to compiling the engine
# in-crate out of the unified feature set — where `map-tiles` was absent, and
# AzMaps shipped a map that could never fetch a tile.
azul = { path = "../../dll", package = "azul-dll", default-features = false, features = ["link-dynamic", "map-tiles"] }

# On Android the crate builds as a NativeActivity cdylib: link the android-activity
# glue into libazul (so it provides android_main / ANativeActivity_onCreate) and
# pull in `ctor` for the load-time constructor that stashes the window options.
[target.'cfg(target_os = "android")'.dependencies]
azul = { path = "../../dll", package = "azul-dll", default-features = false, features = ["link-static", "android-activity", "map-tiles"] }
ctor = "0.2"

# rlib = what the desktop/iOS bin links; cdylib = the Android NativeActivity lib.
[lib]
name = "azul_maps"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "AzMaps"
path = "src/main.rs"

# iOS links the engine STATICALLY. The default (desktop) dependency uses
# `link-dynamic`, which compiles only extern declarations and expects a
# libazul.dylib at runtime — there is none inside a .app, so the device build
# failed at link time with "_AzWindowCreateOptions_create ... symbol(s) not
# found for architecture arm64". Same reason Android uses link-static.
[target.'cfg(target_os = "ios")'.dependencies]
azul = { path = "../../dll", package = "azul-dll", default-features = false, features = ["link-static", "map-tiles"] }
