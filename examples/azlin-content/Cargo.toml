# W1-SCAF skeleton (OWNERSHIP.md section 5, COMMON-W1R.md R2): the FINAL manifest. Lanes never edit it: a missing dependency is a drift row.

[package]
name = "azlin-content"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
authors = ["Felix Schuett <felix.schuett@maps4print.com>"]
license = "MIT"
description = "Azlin content: FastCDC chunker, AZL2 chunks, AZP2 packs, signed pointers, chunk index, dedup and client prune"
publish = false

[dependencies]
azlin-keys = { path = "../azlin-keys", default-features = false }
azlin-cbor = { path = "../azlin-cbor" }
blake3 = "1.8"
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
zeroize = { version = "1.8", features = ["alloc"] }

[dev-dependencies]
azlin-keys = { path = "../azlin-keys", default-features = false, features = ["test-support"] }
