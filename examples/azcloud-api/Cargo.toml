[package]
name = "azcloud-api"
version = "0.1.0"
edition = "2021"
authors = ["Felix Schuett <felix.schuett@maps4print.com>"]
license = "MIT"
description = """
    The `azcloud` command line over azcloud-kit - the Azlin cloud client the
    apps share: the account (signup, joining a drive from another device,
    credentials refreshed before they expire), the state folder, the
    settings, the bucket, the folder sync, public links, lockdown and
    restore - and the two transports it plugs into the kit: HTTPS over
    reqwest and, with the `iroh` feature, S3 over iroh through azlin-client,
    which the kit probes first and falls back from. Every endpoint comes from
    the shared Azlin config, the environment or a flag (`azcloud config` says
    which).
"""
publish = false

# Its own workspace and lockfile, like doc/aztest: azlin-client lives in the
# private azul-apps checkout next to this repository (the same layout
# `azctl test gui` expects from the other side), so azul's CI cannot build this
# crate, and the iso crates' exact pins (tokio, rustls, iroh 1.3) stay out of
# azul's Cargo.lock. The root Cargo.toml lists this folder in `exclude`.
[workspace]

[dependencies]
# Everything but the transports: the account, the state folder, the settings,
# the bucket, the sync, the links (blocking, over azul-storage's Transport).
azcloud-kit = { path = "../azcloud-kit" }
# S3 over iroh (its `iroh_transport`, feature `iroh`) and the rustls crypto
# provider reqwest is built without.
azlin-client = { path = "../../../azul-apps/iso/crates/azlin-client" }
# The request type azlin-client's iroh transport sends.
azlin-proto = { path = "../../../azul-apps/iso/crates/azlin-proto" }
# The shared Azlin config's endpoint flags; plain Rust without its `azul`
# feature (no libazul).
azul-appkit = { path = "../azul-appkit" }
# The Transport the kit sends through, the time format of a listing.
azul-storage = { path = "../azul-storage" }
anyhow = "1"
# The same OS folders azul's FilePath::get_data_dir / get_config_dir return
# (layout/ uses dirs 6), so the data root here is the apps' data root.
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots-no-provider"] }
serde_json = "1"
# The one runtime reqwest and iroh run on; the kit's blocking calls wait for
# them from the main thread.
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }
# The client endpoint of "S3 over iroh", built here so its relay comes from
# the config (azlin-client's own `iroh_transport::endpoint()` is fixed to n0's
# relays). The same version and features as azlin-client's.
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring"], optional = true }

[features]
default = ["iroh"]
# Without it the CLI speaks HTTPS only and `azcloud transport` says so.
iroh = ["dep:iroh", "azlin-client/iroh"]
# Encrypted drives: `encryption`, `encrypt`, `unlock`, `recover`; `invite` seals the drive key
# into the join code and `join` takes it; `up` and `sync` refuse a drive whose key this device
# keeps (they would store plaintext). The keys live in the state folder's secrets file. Off
# until the drive index (the encrypted metadata repository) is in.
encryption = ["azcloud-kit/encryption", "azul-storage/encryption"]

[lib]
name = "azcloud_api"
path = "src/lib.rs"

[[bin]]
name = "azcloud"
path = "src/bin/azcloud.rs"
