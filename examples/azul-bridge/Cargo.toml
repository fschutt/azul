[package]
name = "azul-bridge"
version = "0.1.0"
edition = "2021"
authors = ["Felix Schuett <felix.schuett@maps4print.com>"]
license = "MIT"
description = """
    The Azlin Bridge: a background process on the user's own device that lets
    other people's programs reach the Azlin drive - Apple Mail, Outlook and
    Thunderbird through IMAP4rev1 and SMTP submission, Finder, Windows
    Explorer and the Linux file managers through WebDAV - all on 127.0.0.1
    only. The servers of Azlin speak S3 and the token API; every other
    protocol is a translation here. Mail is the drive's mailbox as AzMail
    keeps it (AZLIN_MAIL.md, through azul-mail-core); files are the drive
    itself (an azul-storage Drive). Headless and blocking (one thread per
    connection); no libazul.
"""
publish = false

[dependencies]
# AzMail's mail logic without azul types: the drive's mailbox layout (names, state markers,
# the folders and their roles), modified UTF-7, and the sending path (outbox, DKIM, route).
azul-mail-core = { path = "../azul-mail-core" }
# The `Drive` trait WebDAV serves and the mailbox is kept in, the S3 drive, the key checks.
azul-storage = { path = "../azul-storage" }
# The bridge's own device account: its state folder, its token family (signup / join), the
# credentials refreshed before they run out, the secrets file.
azcloud-kit = { path = "../azcloud-kit" }
# The shared Azlin config's endpoint flags (`--token-url`, `--s3-url`); plain Rust.
azul-appkit = { path = "../azul-appkit" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# PROPFIND / PROPPATCH / LOCK bodies: the read-only XML parser azul-storage already reads S3's
# answers with (no DTD: a body with one is refused before parsing).
roxmltree = { version = "0.21.1", default-features = false }
# The HTTP client under the drive and the token server calls without libazul: exactly the
# features azul-layout's `http` builds it with (rustls, the pure-Rust RustCrypto provider, the
# Mozilla roots), so no crate enters Cargo.lock.
ureq = { version = "3.3", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots"] }
rustls-rustcrypto = "0.0.2-alpha"
# The per-install password (the OS's random source).
getrandom = "0.2"
# HTTP Digest for WebDAV (Windows' WebClient takes no Basic over http): RustCrypto's MD5, already in
# the tree (lopdf, OpenDAL) and in scripts/dependency-justifications.toml.
md-5 = "0.11"
# CalDAV: AzCalendar's events without azul types (the event and calendar files, iCalendar
# import and export), so the bridge reads and writes them with AzCalendar's own code.
azul-calendar-core = { path = "../azul-calendar-core" }
# The dates of the events, this computer's zone for an imported time: the features
# azul-calendar-core builds chrono with.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# AUTH PLAIN / LOGIN and HTTP Basic credentials.
base64 = "0.22"
# The OS folders azcloud-kit's settings start from (the same `dirs` the azcloud CLI uses).
dirs = "6"
# The tray item (feature `tray`: the azul-bridge-tray binary) - azul's TrayIconData, linked as
# the apps link libazul (AZ_LINK_PATH). Not in the default build.
azul = { path = "../../dll", package = "azul-dll", default-features = false, features = ["link-dynamic"], optional = true }

[features]
default = ["encryption"]
# An encrypted account's drive, as AzMail opens it (azul-mail-core's mail_drive: AutoEncrypted,
# the drive index, the AZD1 drops filed into the mail folders) and the join code's key seal
# (azcloud-kit). On by default: a bridge without it would show an encrypted drive's raw objects.
encryption = ["azul-mail-core/encryption", "azcloud-kit/encryption", "azul-storage/encryption"]
# The OS keyring (Keychain, Credential Manager, the Secret Service) through azul's blocking keyring
# calls: azul-storage's AzulKeyring, which links libazul (AZ_LINK_PATH) - the build the apps
# ship. Without it the secrets are the state folder's 0600 file.
os-keyring = ["azul-storage/azul"]
# azul-bridge-tray (src/tray_main.rs): `serve` with a menu-bar / tray item, with the OS keyring.
tray = ["dep:azul", "os-keyring"]

[dev-dependencies]
# A temporary folder for the tests (azul_storage::testing::TempDir).
azul-storage = { path = "../azul-storage", features = ["testing"] }
# The one-connection SMTP sink the sending tests deliver to (azmail_core::testutil).
azul-mail-core = { path = "../azul-mail-core", features = ["testing"] }

[lib]
name = "azul_bridge"
path = "src/lib.rs"

[[bin]]
name = "azul-bridge"
path = "src/main.rs"

[[bin]]
name = "azul-bridge-tray"
path = "src/tray_main.rs"
required-features = ["tray"]
