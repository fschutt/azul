[package]
name = "azul-pay"
version = "0.1.0"
edition = "2021"
authors = ["Felix Schuett <felix.schuett@maps4print.com>"]
license = "MIT"
description = """
    The client half of an Azlin checkout, as a plugin layer: the providers
    an app knows (a compiled-in registry - ids, names, the origins their
    pages may navigate to, which payment method may be shown in an embedded
    web view and which only in the system browser), the offer the token
    server sends (it can pick, order and narrow, never widen), the payment
    pills for a country, currency and period, the surface a checkout opens
    (hosted fields in a popover, a hosted page, the system browser), the
    navigation bridge to a hosted-fields page (intercepted main-frame
    navigations only, no script bridge), and the checkout's state machine
    (pure: effects out, events in). No azul types, no network, no secrets:
    tested without a window (`cargo test -p azul-pay`).
"""
publish = false

[dependencies]
# The token server's offer and checkout answers are JSON (already in the tree).
serde_json = "1"

[features]
# The fake providers of the local stacks (scripts/azlin_mock_stack.py, azul-apps local/): their
# pages live on this computer (http to loopback). Off by default, so a build without it cannot be
# pointed at a fake; even with it, a fake is only taken from a token server on this computer.
fake-providers = []

[lib]
name = "azul_pay"
path = "src/lib.rs"
