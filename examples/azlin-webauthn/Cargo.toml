[package]
name = "azlin-webauthn"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
authors = ["Felix Schuett <felix.schuett@maps4print.com>"]
license = "MIT"
description = "Azlin WebAuthn: passkey assertion verification (authenticator data, client data, COSE keys)"
publish = false

[dependencies]
azlin-seams = { path = "../azlin-seams" }
p256 = { version = "0.14", default-features = false, features = ["ecdsa"] }
ed25519-dalek = "2.2.0"
sha2 = "0.10"
serde_json = "1"
base64 = "0.22"
thiserror = "2"
subtle = "2"
