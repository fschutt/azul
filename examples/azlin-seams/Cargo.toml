# W1-SCAF skeleton (OWNERSHIP.md section 5, COMMON-W1R.md R2): the FINAL manifest. Lanes never edit it: a missing dependency is a drift row.

[package]
name = "azlin-seams"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
authors = ["Felix Schuett <felix.schuett@maps4print.com>"]
license = "MIT"
description = "Azlin seams: the engine's vocabulary adapter (hashes, stamps, sizes, signature verifier seam, mutation guards, seeded simulation)"
publish = false

[dependencies]
azlin-keys = { path = "../azlin-keys", default-features = false }
blake3 = "1.8"
ed25519-dalek = "2.2.0"
zeroize = "1.8"
thiserror = "2"

[features]
os-rng = ["azlin-keys/os-rng"]
# the mutation guard of src/mutants.rs (azlin_seams::mutant!): off unless this feature is on AND AZLIN_MUTANT names the id
mutants = []
