# The fuzz targets of azlin-keys (planning/architecture.md section 1.4 rule 3: "every parser has a
# fuzz target"): bytes that other devices, other people and the network wrote. `panic = "abort"`
# is the shipped profile, so every panic these find is an abort of the app.
#
# cargo-fuzz project of its own (its own workspace and lock, like examples/azul-storage/fuzz and
# examples/azlin-cbor/fuzz): `cargo install cargo-fuzz`, then from this folder
#
#     cargo +nightly fuzz build                   # what CI does; it never runs them
#     cargo +nightly fuzz run envelope_decode     # an hour on a quiet machine
#
# Four targets, one per parser of the crate, PRE-DECLARED by lane W1-S15a so that no later lane
# edits this file; each lane creates only its own target file under `fuzz_targets/`:
#
#     envelope_decode   W1-S15b  `Envelope::from_cbor`, `check_shape`, `open`
#     reg_wrap_row      W1-S15c2 `reg_wrap::validate_row` on a row's bytes
#     contact_text      W1-S15d  the contact, share and recovery-request text forms, `RecoveryCode::parse`
#     bound_secret      W1-S15e  `BoundSecret::from_bytes` (needs the feature `binding`, on below)
#
# The entry points are the same the lanes' unit tests run on a few thousand fixed inputs. A
# target whose file does not exist yet makes `cargo fuzz build` fail until its lane lands; `corpus/`
# is not committed.
[package]
name = "azlin-keys-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
azlin-keys = { path = "..", features = ["test-support", "pq", "binding"] }

# Not a member of azul's workspace: it needs nightly and libfuzzer, and keeps both out of the
# lockfile of the apps.
[workspace]

[[bin]]
name = "envelope_decode"
path = "fuzz_targets/envelope_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "reg_wrap_row"
path = "fuzz_targets/reg_wrap_row.rs"
test = false
doc = false
bench = false

[[bin]]
name = "contact_text"
path = "fuzz_targets/contact_text.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bound_secret"
path = "fuzz_targets/bound_secret.rs"
test = false
doc = false
bench = false
