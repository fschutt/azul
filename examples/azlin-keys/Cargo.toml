# W1-SCAF skeleton (OWNERSHIP.md section 5, COMMON-W1R.md R2): the FINAL manifest. Lanes never edit it: a missing dependency is a drift row.
# Every dependent uses azlin-keys with default-features = false (R3, crates.tsv).

[package]
name = "azlin-keys"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
authors = ["Felix Schuett <felix.schuett@maps4print.com>"]
license = "MIT"
description = "Azlin keys: typed ids, secrets, entropy and clock seams, key derivation, signatures, envelopes, key hierarchy, recovery"
publish = false

[dependencies]
azlin-cbor = { path = "../azlin-cbor" }
# DEP-2 (D-W1S15A -7): a hasher that held key material must be wipeable. blake3 1.8 defines `zeroize` as
# ["dep:zeroize", "arrayvec/zeroize"]: two lock edges (zeroize is a package already), no new package.
blake3 = { version = "1.8", features = ["zeroize"] }
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
x25519-dalek = { version = "2.0.1", default-features = false, features = ["static_secrets", "zeroize", "precomputed-tables"] }
ed25519-dalek = { version = "2.2", default-features = false, features = ["std", "zeroize", "fast"] }
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "zeroize"] }
subtle = "2"
zeroize = { version = "1.8", features = ["alloc"] }
getrandom = { version = "0.2", optional = true }
ml-kem = { version = "0.2.3", default-features = false, features = ["deterministic", "zeroize"], optional = true }
p256 = { version = "0.14", default-features = false, features = ["ecdh", "arithmetic"], optional = true }

[features]
default = ["os-rng"]
os-rng = ["dep:getrandom"]
# ML-KEM-768 (envelope algorithm 2): NOT a default feature until the owner has reviewed the crate (ARCH29 9.13 point 3, D-W1 point 2).
pq = ["dep:ml-kem"]
binding = ["dep:p256"]
test-support = []
