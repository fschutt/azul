[package]
name = "AzWidgets"
version = "0.1.0"
edition = "2021"
authors = ["Felix Schütt <felix.schuett@maps4print.com>"]
license = "MIT"
description = """
    AzulWidgets — a showcase of every built-in Azul widget. Demos the
    existing widgets (Button, CheckBox, ProgressBar, TextInput, NumberInput,
    ColorInput, DropDown) plus the 24 high-level widgets (Switch, Divider,
    Card, Badge, Slider, Segmented, RadioGroup, Tooltip, TextArea, Alert,
    Accordion, Avatar, Chip, Spinner, Dialog (modal, and as a popover),
    ComboBox,
    Breadcrumb, Pagination, Stepper, SplitPane, DatePicker, TimePicker, Frame),
    every HTML input type as its widget inside a Form (FormData on submit,
    reset), the same controls written as raw HTML that the engine replaces
    with those widgets, and a native OS notification in place of an
    in-window Toast. A toolbar switches the colour scheme (System / Light /
    Dark) and the widget theme (Flat / Flora) of the whole page.
    Replaces azul-spirit-level as the widgets demo on the release page.
"""
publish = false

[dependencies]
azul = { path = "../../dll", package = "azul-dll", default-features = false, features = ["link-dynamic"] }

[target.'cfg(target_os = "android")'.dependencies]
ctor = "0.2"

# There is no `e2e` feature here. The E2E scripting (AZ_E2E=script.json) and the debug server (AZ_DEBUG=<port>) belong to the library
# this app links, not to the app: `azul = link-dynamic` leaves every Az* symbol to the prebuilt libazul, so a feature that compiles the
# engine into the app (azul/e2e-scripting pulls azul-core, azul-layout and azul-css) neither links against it (duplicate C ABI symbols)
# nor passes the gate that fails such a build (scripts/demo_gate.py). The E2E runs of the desktop column build this app against the
# artifact-only QA library instead ([lib.desktop-e2e] of scripts/demo_apps.toml), as AzWidgets-e2e-<platform>:
#   bash scripts/ci/desktop_e2e_build.sh linux

[lib]
name = "azul_widgets"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "AzWidgets"
path = "src/main.rs"
