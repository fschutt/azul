[package]
name = "AzWidgets"
version = "0.1.0"
edition = "2021"
authors = ["Felix Schütt <felix.schuett@maps4print.com>"]
license = "MIT"
description = """
    AzulWidgets — a showcase of every built-in Azul widget. Demos the
    existing widgets (Button, CheckBox, ProgressBar, TextInput, NumberInput,
    ColorInput, DropDown) plus the 24 high-level widgets (Switch, Divider,
    Card, Badge, Slider, Segmented, RadioGroup, Tooltip, TextArea, Alert,
    Accordion, Avatar, Chip, Spinner, Dialog (modal, and as a popover),
    ComboBox,
    Breadcrumb, Pagination, Stepper, SplitPane, DatePicker, TimePicker, Frame),
    every HTML input type as its widget inside a Form (FormData on submit,
    reset), the same controls written as raw HTML that the engine replaces
    with those widgets, and a native OS notification in place of an
    in-window Toast. A toolbar switches the colour scheme (System / Light /
    Dark) and the widget theme (Flat / Flora) of the whole page.
    Replaces azul-spirit-level as the widgets demo on the release page.
"""
publish = false

[dependencies]
azul = { path = "../../dll", package = "azul-dll", default-features = false, features = ["link-dynamic", "e2e-scripting"] }

[target.'cfg(target_os = "android")'.dependencies]
azul = { path = "../../dll", package = "azul-dll", default-features = false, features = ["link-static", "android-activity"] }
ctor = "0.2"

[lib]
name = "azul_widgets"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "AzWidgets"
path = "src/main.rs"

[target.'cfg(target_os = "ios")'.dependencies]
azul = { path = "../../dll", package = "azul-dll", default-features = false, features = ["link-static"] }
