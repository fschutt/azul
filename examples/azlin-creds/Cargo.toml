# W1-SCAF skeleton (OWNERSHIP.md section 5, COMMON-W1R.md R2): the FINAL manifest. Lanes never edit it: a missing dependency is a drift row.
# No interim codec feature (D-W1-1, R6): the codec is azlin-cbor.

[package]
name = "azlin-creds"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
authors = ["Felix Schuett <felix.schuett@maps4print.com>"]
license = "MIT"
description = "Azlin credentials: credential v2, certificates, member assertions, signed entitlements and the refresh frames"
publish = false

[dependencies]
azlin-regbase = { path = "../azlin-regbase" }
azlin-keys = { path = "../azlin-keys", default-features = false }
azlin-seams = { path = "../azlin-seams" }
azlin-cbor = { path = "../azlin-cbor" }
ed25519-dalek = "2.2.0"
blake3 = "1.8"
subtle = "2"
thiserror = "2"
zeroize = "1.8"
