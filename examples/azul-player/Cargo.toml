[package]
name = "AzPlayer"
version = "0.1.0"
edition = "2021"
authors = ["Felix Schuett <felix.schuett@maps4print.com>"]
license = "MIT"
description = """
    AzPlayer - a video player on the public azul API: the picture is azul's
    VideoWidget (MP4 / MOV with H.264, decoded on its worker: VideoToolbox on
    Apple, Vulkan Video on x86_64 Linux / Windows), the sound is azul's
    AudioPlayer playing the file's audio track (AAC through Symphonia) kept in
    step with the picture, the controls are azul's MediaControls and SeekBar
    over the video, hidden while it plays; fullscreen, the keys of every
    player, recent files with resume positions in the data tree. Built on
    azul's S7 MediaShell (the player variant), NoTitle with the app-drawn
    Titlebar, flat and flora, light and dark.
"""
publish = false

[dependencies]
azul = { path = "../../dll", package = "azul-dll", default-features = false, features = ["link-dynamic"] }
azul-storage = { path = "../azul-storage", features = ["azul"] }
# The Azlin app skeleton: the common switches, the data root, the settings page (Appearance,
# Data, Shortcuts, About), the --shot timer.
azul-appkit = { path = "../azul-appkit", features = ["azul"] }
# The history file (already in the tree).
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "azplayer"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "AzPlayer"
path = "src/main.rs"
