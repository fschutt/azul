[package]
name = "AzPlayer"
version = "0.1.0"
edition = "2021"
authors = ["Felix Schuett <felix.schuett@maps4print.com>"]
license = "MIT"
description = """
    AzPlayer - a video player on the public azul API, in the look of
    Windows Media Center: the picture is azul's VideoWidget (MP4 / MOV with
    H.264, decoded on its worker in NV12: VideoToolbox on Apple, Vulkan
    Video on x86_64 Linux / Windows), drawn on the GPU; the sound is azul's
    AudioPlayer playing the file's audio track (AAC through Symphonia) kept
    in step with the picture; round glass transport buttons over the
    picture, hidden while it plays; a menu bar for the rest; the recent
    files as a gallery that resumes where you stopped.
"""
publish = false

[dependencies]
azul = { path = "../../dll", package = "azul-dll", default-features = false, features = ["link-dynamic"] }
azul-storage = { path = "../azul-storage", features = ["azul"] }
# The Azlin app skeleton: the common switches, the data root, the settings page (Appearance,
# Data, Shortcuts, About), the --shot timer.
azul-appkit = { path = "../azul-appkit", features = ["azul"] }
# The history file (already in the tree).
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "azplayer"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "AzPlayer"
path = "src/main.rs"
