[package]
name = "azul-examples"
version = "0.0.1"
authors = ["Felix Schütt <felix.schuett@maps4print.com>"]
license = "MIT"
description = '''
    Azul GUI is a free, functional, immediate-mode GUI framework
    for rapid development of desktop applications written in Rust,
    supported by the Mozilla WebRender rendering engine
'''
homepage = "https://azul.rs/"
keywords = ["gui", "GUI", "user-interface", "svg", "graphics" ]
categories = ["gui"]
repository = "https://github.com/maps4print/azul"
edition = "2021"
publish = false

[dependencies]
azul = { path = "../../dll", package = "azul-dll", default-features = false }
azul_css = { path = "../../css", package = "azul-css", default-features = false, optional = true }
serde = { version = "1", optional = true }
serde_derive = { version = "1", optional = true }
serde_json = { version = "1", optional = true }

[features]
# link-dynamic by DEFAULT (USER ruling 2026-08-29: "all should link
# dynamically") - a self-contained example freezes the engine at ITS build
# time, so redeploying libazul.so silently tested stale code (the dbusmenu
# session). `--no-default-features --features link-static` restores the old
# behaviour where a single-file binary is wanted.
default = ["link-dynamic"]
serde = ["dep:serde", "dep:serde_derive", "dep:serde_json"]
link-static = ["azul/link-static", "azul_css"]
link-dynamic = ["azul/link-dynamic"]
web = ["azul/link-static", "azul/web", "azul/web-transpiler", "azul_css"]
icu = ["azul/icu", "azul_css"]
fluent = ["azul/fluent", "azul_css"]
http = ["azul/http"]
zip = ["azul/zip"]

[[example]]
name = "async"
path = "src/async.rs"

[[example]]
name = "calc"
path = "src/calc.rs"

[[example]]
name = "hello-world"
path = "src/hello-world.rs"

[[example]]
name = "infinity"
path = "src/infinity.rs"

[[example]]
name = "opengl"
path = "src/opengl.rs"
required-features = ["serde"]

[[example]]
name = "widgets"
path = "src/widgets.rs"

[[example]]
name = "ribbon"
path = "src/ribbon.rs"

[[example]]
name = "xhtml"
path = "src/xhtml.rs"

[[example]]
name = "scrolling"
path = "src/scrolling.rs"

[[example]]
name = "anim"
path = "src/anim.rs"

[[example]]
name = "transitions"
path = "src/transitions.rs"

# Also needs `link-static`, for the same reason as `http_zip_demo` below: this
# demo drives `azul::desktop::icu`, which lives behind `cabi_internal` and so
# exists only in the static build. Without this the lean `link-dynamic` build
# fails with "could not find `desktop` in `azul`".
[[example]]
name = "icu_demo"
path = "src/icu_demo.rs"
required-features = ["icu", "link-static"]

# Needs `link-static` for the same reason as `http_zip_demo` below: it reaches
# into `azul::desktop::fluent` and `azul::desktop::zip`, which live behind
# `cabi_internal` and therefore do not exist in a `link-dynamic` build. Without
# it the lean build fails with "could not find `desktop` in `azul`" - which it
# has been doing, unseen, because that job sits behind a `needs: [clippy]` that
# was failing and skipped it.
[[example]]
name = "fluent_demo"
path = "src/fluent_demo.rs"
required-features = ["fluent", "icu", "link-static"]

# Also needs `link-static`: this demo drives the desktop ZIP helpers
# (`zip_create_from_files` / `zip_extract_all` / `zip_list_contents`), which
# live in `azul::desktop::zip` behind `cabi_internal`. The dynamic build
# exposes the generated `azul::zip::Zip` type instead, not these free
# functions, so without this the lean `link-dynamic` build fails with
# "could not find `desktop` in `azul`".
[[example]]
name = "http_zip_demo"
path = "src/http_zip_demo.rs"
required-features = ["fluent", "http", "zip", "link-static"]

[[example]]
name = "tray"
path = "src/tray.rs"

[[example]]
name = "tray_only"
path = "src/tray_only.rs"
