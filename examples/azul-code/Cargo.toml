[package]
name = "AzCode"
version = "0.1.0"
edition = "2021"
authors = ["Felix Schütt <felix.schuett@maps4print.com>"]
license = "MIT"
description = """
    AzCode - a code editor on the public azul API in VSCode's shape: the
    activity bar, the explorer tree (or "You have not yet opened a folder."
    with Open Folder and the recent folders), tabs with close buttons over
    azul's CodeView, the welcome page, quick open (Mod+P), a status bar with
    Ln / Col; dark by default. Files of a million lines (the CodeView
    builds only the lines in view; the text is a piece table), syntax
    colours from syntect (incremental: an edit re-parses from its line
    until the parse state meets the old one again; a far jump is parsed on
    an azul Thread), find / replace (azul-appkit's matcher), go to line,
    "Save changes?" (CloseGuard). A workspace is a folder read and written
    through azul-storage's Drive; the sample workspace (--sample) lives in
    the data tree, code/sample/.
"""
publish = false

[dependencies]
azul = { path = "../../dll", package = "azul-dll", default-features = false, features = ["link-dynamic"] }
# The skeleton the Azlin apps share: args, data root, settings, About, file jobs, the find matcher.
azul-appkit = { path = "../azul-appkit", features = ["azul"] }
# The workspace folder and the sample tree are read and written through the Drive (LocalDrive).
azul-storage = { path = "../azul-storage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Syntax colours: TextMate grammars, a line-oriented parse state (incremental by line), pure Rust
# through fancy-regex (already in the tree); no themes (azul's themes colour the token kinds).
syntect = { version = "5.2", default-features = false, features = ["parsing", "default-syntaxes", "regex-fancy"] }

[lib]
name = "azcode"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "AzCode"
path = "src/main.rs"
