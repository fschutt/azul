[package]
name = "AzMusic"
version = "0.1.0"
edition = "2021"
authors = ["Felix Schuett <felix.schuett@maps4print.com>"]
license = "MIT"
description = """
    AzMusic - a music player on the public azul API in the look of Spotify's
    2010 desktop player: a library scanned from a music folder (tags read by
    azul's AudioFileDecoder), a grid of album covers, artists, genres, dense
    song tables in a VirtualView, playlists as files in the data tree, a play
    queue with shuffle and repeat, gapless playback through azul's AudioPlayer,
    the now-playing bar (SeekBar, Slider, LevelMeter) and the OS media keys /
    now-playing widget. NoTitle, its tool bar the title bar, dark by default,
    light and dark.
"""
publish = false

[dependencies]
azul = { path = "../../dll", package = "azul-dll", default-features = false, features = ["link-dynamic"] }
azul-storage = { path = "../azul-storage", features = ["azul"] }
# The Azlin app skeleton: the common switches, the data root, the settings page (Appearance,
# Data, Shortcuts, About), the --shot timer.
azul-appkit = { path = "../azul-appkit", features = ["azul"] }
# The library and the playlists as JSON files (already in the tree).
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "azmusic"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "AzMusic"
path = "src/main.rs"
