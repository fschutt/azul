[package]
name = "AzDrive"
version = "0.1.0"
edition = "2021"
authors = ["Felix Schuett <felix.schuett@maps4print.com>"]
license = "MIT"
description = """
    AzDrive - an Explorer-like file browser on the public azul API. A sidebar
    of drives (Home, a folder on this computer, and S3 drives the user adds:
    AWS S3, Cloudflare R2, MinIO), a breadcrumb and a sortable, paged list of
    folders and files. Browsing a bucket fetches only listings; "Download" and
    "Open" fetch ONE object. The drives list lives in the per-user config
    folder without secrets; the keys live in the OS keyring. Storage is the
    shared `azul-storage` crate, which AzMail uses too.
"""
publish = false

[dependencies]
azul = { path = "../../dll", package = "azul-dll", default-features = false, features = ["link-dynamic"] }
azul-storage = { path = "../azul-storage", features = ["azul"] }
# The Azlin cloud client: Add drive > Buy storage (tiers, test drives, checkouts) and the
# Azlin drives that refresh their credentials by themselves.
azcloud-kit = { path = "../azcloud-kit" }
# Buy storage's payment: the provider registry, the token server's offer narrowed to it, the
# pills, the surfaces (hosted fields in a popover, a hosted page, the browser), the checkout's
# state machine.
azul-pay = { path = "../azul-pay" }
# The Azlin app skeleton: the common switches, the data root, the settings page (Appearance,
# Data, Shortcuts, About), the --shot timer.
azul-appkit = { path = "../azul-appkit", features = ["azul"] }
# The search box: the open folder and every folder below it, names then contents (ripgrep's
# walker and searcher; AzCode's find in files runs on it too).
azul-search = { path = "../azul-search" }
# A drive's full-text index (tantivy) for the search box's contents: the text of plain files,
# office documents, mail and - through azul's reader - PDFs, asked before the files are read.
azul-search-index = { path = "../azul-search-index" }
# The same features azul-layout and AzCalendar build chrono with (the local time of a date).
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# The settings file (already in the tree through azul-storage and azul-layout).
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# The one temporary folder for tests (azul_storage::testing::TempDir).
azul-storage = { path = "../azul-storage", features = ["testing"] }

[features]
# Add drive > Connect data source offers OpenDAL's services and the databases (tables as
# folders); `--no-default-features` builds AzDrive with S3 and local folders only (and without
# the encryption: a build for tests of the plain paths, never shipped).
default = ["opendal", "sql", "encryption"]
opendal = ["azul-storage/opendal"]
sql = ["azul-storage/sql"]
# The fake payment providers of the local stacks (scripts/azlin_mock_stack.py): only for test
# builds - a build without it cannot be pointed at a fake, and even with it a fake is only taken
# from a token server on this computer.
fake-providers = ["azul-pay/fake-providers"]
# Encrypted drives (src/encryption.rs), on by default ("we always encrypt and compress"): an
# Azlin drive opens through azul-storage's AutoEncrypted and the drive index; a NEW Azlin drive
# is encrypted as it is made (its keys, the recovery sheet); an older plaintext one keeps
# opening and its menu offers "Encrypt this drive" (the files moved into the encryption).
encryption = ["azul-storage/encryption", "azcloud-kit/encryption"]

[lib]
name = "azdrive"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "AzDrive"
path = "src/main.rs"
