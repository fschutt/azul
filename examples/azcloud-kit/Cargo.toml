[package]
name = "azcloud-kit"
version = "0.1.0"
edition = "2021"
authors = ["Felix Schuett <felix.schuett@maps4print.com>"]
license = "MIT"
description = """
    The Azlin cloud client the desktop apps share and the `azcloud` command
    line is built on: the token server's API (the storage tiers, a
    development sign-up, a checkout and its status, the refresh of a drive's
    credentials with its rotating drive token, members, lockdown, restore),
    the drive bundle it answers with, the session an app keeps in the OS
    keyring and an Azlin drive that refreshes its 12-hour credentials by
    itself; a device's account and state folder, the settings with where
    each came from; the bucket (S3 through azul-storage: endpoint failover,
    compare-and-swap, multipart, ranges), the folder sync (a CAS index,
    BLAKE3 blobs, a three-way merge) and public links. Blocking: every call
    goes through azul-storage's `Transport` (azul's HTTP client in the apps,
    a fake in the tests), from an azul `Thread`; a build that links iroh
    plugs in its dialer. No azul types, no dependency on the service's own
    crates.
"""
publish = false

[dependencies]
# The `Transport` seam, the S3 drive the credentials open, the drives-file entry and
# the time and URL helpers (no new crates: azul-storage is the apps' storage layer).
azul-storage = { path = "../azul-storage" }
# The shared Azlin config's `endpoints` (profile, token server) - resolve_endpoints.
azul-appkit = { path = "../azul-appkit" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The sync's content addresses: every blob is named by its BLAKE3 (no new crate: azul's tree has
# 1.8.7 already).
blake3 = "1.8"
# The claim of a paid drive (claim.rs): the sign-up the token server seals to a checkout's X25519
# key - X25519, HKDF-SHA256, ChaCha20-Poly1305 - opened with the key the app keeps, made from the
# OS random source, kept as base64. No new crates: AzMeet's sealed room keys use the same
# versions and features (Cargo.lock has them), AzMail base64 0.22.
x25519-dalek = { version = "2.0.1", default-features = false, features = ["static_secrets", "zeroize", "precomputed-tables"] }
hkdf = "0.12"
sha2 = "0.10"
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
getrandom = "0.2"
base64 = "0.22"
zeroize = { version = "1.8", features = ["alloc"] }
# A paid checkout's period tokens (period.rs): RFC 9474 blind RSA (SHA-384, PSS, randomized) -
# the issuer's SPKI PEM key, the PSS check of a finished token, the blinding arithmetic. No new
# crates: AzMail's rsa 0.9 (+pem) and the num-bigint-dig it is built on (Cargo.lock has both).
rsa = { version = "0.9", features = ["pem"] }
num-bigint-dig = { version = "0.8", default-features = false }
# A drive's recovery key at the token server (recovery.rs): Ed25519 from the recovery code, what
# signs a lockdown without a drive token. No new crate: AzMeet's and AzCalendar's version and
# features (Cargo.lock has 2.2.0).
ed25519-dalek = { version = "2.2", default-features = false, features = ["std", "zeroize", "fast"] }

[dev-dependencies]
# The one temporary folder for tests (azul_storage::testing::TempDir).
azul-storage = { path = "../azul-storage", features = ["testing"] }

[features]
default = []
# Encrypted drives (encryption.rs): azul-storage's AZL1 objects, the device's keys, the join
# code's key seal. Off until the drive index (the encrypted metadata repository) is in.
encryption = ["azul-storage/encryption"]

[lib]
name = "azcloud_kit"
path = "src/lib.rs"
