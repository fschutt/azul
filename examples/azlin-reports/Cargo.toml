# W1-SCAF skeleton (OWNERSHIP.md section 5, COMMON-W1R.md R2): the FINAL manifest. Lanes never edit it: a missing dependency is a drift row.

[package]
name = "azlin-reports"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
authors = ["Felix Schuett <felix.schuett@maps4print.com>"]
license = "MIT"
description = "Azlin reports: content reports, the counting that pauses a link, decisions and their statements of reasons"
publish = false

[dependencies]
azlin-cbor = { path = "../azlin-cbor" }
# DEP-2 (X-DELTA-W1S46A-10): the owned copy of a link's key (`Text`) must be wiped. The form azlin-cbor uses
# (default features off, `alloc`): a lock edge, no new package. The code that uses it is lane S46a's.
zeroize = { version = "1.8", default-features = false, features = ["alloc"] }
