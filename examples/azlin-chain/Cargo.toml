# W1-SCAF skeleton (OWNERSHIP.md section 5, COMMON-W1R.md R2): the FINAL manifest. Lanes never edit it: a missing dependency is a drift row.

[package]
name = "azlin-chain"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
authors = ["Felix Schuett <felix.schuett@maps4print.com>"]
license = "MIT"
description = "Azlin chain: signed hash chains (team log, space chains): entries, links, pins, peers, checkpoints, restore"
publish = false

[dependencies]
azlin-keys = { path = "../azlin-keys", default-features = false }
azlin-seams = { path = "../azlin-seams" }
blake3 = "1.8"
ed25519-dalek = "2.2.0"
zeroize = "1.8"
thiserror = "2"
