# Handles the layout as well as text layout, font decoding and 
# image layout / image decoding. 
# 
# Intermediary crate for if you need font and image loading,
# these cannot be in the core or css crates, because that would make 
# those crate unnecessarily heavy

[package]
readme = "../README.md"
name = "azul-layout"
version = "0.0.14"
authors = ["Felix Schütt <felix.schuett@maps4print.com>"]
license = "MIT"
description = "Layout solver + font and image loader the Azul GUI framework"
homepage = "https://azul.rs/"
keywords = ["gui", "user-interface", "svg", "graphics", "css" ]
categories = ["gui"]
repository = "https://github.com/maps4print/azul"
edition = "2021"
# These two integration tests `include_bytes!` fonts from the *workspace* asset tree —
# `examples/assets/fonts/KoHo-Light.ttf` and `doc/fonts/SourceSerifPro-Regular.ttf` — which
# live outside the crate root and so cannot be packaged alongside them. Cargo ships
# `tests/` but not those fonts, leaving `cargo test` on the published crate unable to
# compile. They are repo-only tests; keep them out of the package. (Contrast
# `src/text3/mock_fonts.rs`, which is a `pub mod` and so had its fonts vendored into
# `layout/assets/` instead.) The `publish_safety` CI job enforces this.
exclude = [
    "tests",
    "benches",
    "examples",
    "fuzz",
    # The two ~5 KiB mock fonts (azul-mock-mono/wide) under assets/fonts/test/ are NOT
    # excluded: they're include_bytes!'d into the library (src/text3/mock_fonts.rs) and
    # also serve as the #[cfg(test)] positive-control face, so they must ship.
]
resolver = "2"
autoexamples = true
# ONE integration-test binary instead of 118.
#
# Cargo compiles AND LINKS every auto-discovered `tests/*.rs` as its own binary,
# each statically pulling in all of azul-layout plus its dependency graph.
# Measured on this tree: 129 test binaries, 11.2 GB, averaging 89 MB each under
# `[profile.release]` (`debug = 1`, `strip = false` — both deliberate, so samply
# can resolve symbols), and larger still on the dev profile, where `debug = 2`
# applies and no `[profile.dev]` override exists. It was the single largest
# build cost in the repo, paid on every developer machine and every CI run of
# `cargo test -p azul-layout --lib --tests`, and it filled this machine's disk
# twice. Every test file is now a `#[path] mod` of `tests/all.rs`; that file
# carries the registration list and the full rationale.
#
# The price of the switch: an UNREGISTERED `tests/*.rs` is silently never
# compiled — it does not fail, it does not warn, it simply never runs.
# `tests/integration_test_registry_is_exhaustive.rs` is the interlock that makes
# that impossible to do by accident. Do not delete it.
autotests = false

[dependencies]
azul-css                = { version = "0.0.14", path = "../css", default-features = false, features = ["parser"] }
azul-core               = { version = "0.0.14", path = "../core", default-features = false }
# `pattern` form validation (11b-i-b). MINIMAL on purpose: only the string API,
# no dependencies of its own. NOT optional-on-std, though -- regex-lite's own
# lib.rs is `#[cfg(not(feature = "std"))] compile_error!("'std' is currently a
# required feature")`, so it cannot be built without std at all. It is therefore
# an optional dep enabled by `text_layout` (which implies std), matching the
# `form` module's own gate.
regex-lite              = { version = "0.1.9", default-features = false, features = ["string"], optional = true }
image                   = { version = "0.25", default-features = false, optional = true }
# Explicit override to disable SIMD features that were broken in older versions
# See: https://github.com/image-rs/image/issues/2705
zune-jpeg               = { version = "0.5", default-features = false, features = ["std"], optional = true }
rust-fontconfig = { version = ">=5.0, <5.1", default-features = false, optional = true }
libc                    = { version = "0.2", default-features = false, optional = true }
serde                   = { version = "1.0", features = ["derive"] }
brotli-decompressor     = { version = "5", default-features = false, features = ["std"], optional = true }
accesskit               = { version = "0.24", default-features = false, optional = true }
tinyvec                 = { version = "1.9.0", default-features = false, optional = true  }
smallvec                = { version = "1.13", default-features = false, features = ["union"] }
lyon                    = { version = "1.0.1",  default-features = false, optional = true }
agg-rust                = { package = "agg-rust-azul", version = "1.1.3", default-features = false, optional = true }
png                     = { version = "0.18", default-features = false, optional = true }
roxmltree               = { version = "0.21.1",   default-features = false, optional = true }
xmlwriter               = { version = "0.1.0",    default-features = false, optional = true }
xmlparser               = { version = "0.13.6",   default-features = false, optional = true }
gl-context-loader       = { version = "0.1.8", default-features = false, optional = true }

# text3 features
unicode-bidi            = { version = "0.3.18", default-features = false, optional = true, features = ["hardcoded-data"]}
thiserror = { version = "2.0.17", default-features = false }
hyphenation             = { version = "0.8.4", default-features = false, features = ["embed_all"], optional = true }
unicode-segmentation    = { version = "1.12.0", default-features = false, optional = true }
unicode-normalization   = { version = "0.1.24",  default-features = false, optional = true }
allsorts = { package = "allsorts-azul", version = "0.17.1", default-features = false, features = ["flate2_rust"], optional = true }
lru = { version = "0.18.2", default-features = false }
taffy = { version = "0.10", default-features = false, features = ["std", "flexbox", "grid", "alloc", "taffy_tree", "block_layout", "calc", "content_size", "detailed_layout_info"] }
base64 = "0.22.1"
strfmt = { version = "0.2", optional = true }
# tfd is desktop-only — its 0.1.0 release uses an outdated JNI API that
# doesn't cross-compile for Android, and there is no native modal dialog
# equivalent on iOS. Declared per-target below; the `extra` feature does
# nothing on mobile.

# ICU4X dependencies for internationalization
# compiled_data is enabled by default to include all locale data
icu = { version = "2.1", optional = true }
icu_provider_blob = { version = "2.1", default-features = false, optional = true }
writeable = { version = "0.6", default-features = false, optional = true }

# Optional: chrono for getting current date/time
chrono = { version = "0.4", default-features = false, features = ["std", "clock"], optional = true }

# Fluent localization (Project Fluent)
fluent = { version = "0.17", default-features = false, optional = true }
fluent-syntax = { version = "0.12", default-features = false, optional = true }
unic-langid = { version = "0.9", default-features = false, optional = true }
intl-memoizer = { version = "0.5", default-features = false, optional = true }

# ZIP file support for language packs
zip = { version = "2.1", default-features = false, features = ["deflate"], optional = true }

# Material Icons font (embedded TTF, Apache 2.0 licensed)
material-icons = { version = "0.3", optional = true }

# HTTP client for downloading language packs
# HTTP client — uses pure-Rust TLS (no ring/aws-lc-rs C code).
# Declared ONLY for non-wasm targets: rustls does not build on
# wasm32-unknown-unknown (no UnixTime::now), and a browser cannot open raw
# sockets anyway. The `http` feature stays ON there — `dep:` activation of a
# target-filtered optional dep is a no-op on wasm, and src/http.rs routes the
# whole public API to its loud error stubs.


# JSON parsing.
# `float_roundtrip` is REQUIRED for correctness, not a nicety: the default
# best-effort float parser loses precision on extreme magnitudes and rejects
# valid literals near f64::MAX outright ("number out of range"), so
# `json_parse(json_stringify(x)) != x`. See core/Cargo.toml.
serde_json = { version = "1.0", default-features = false, features = ["std", "float_roundtrip"], optional = true }
# Crash-report MAIL transport (EHLO SMTP client) — our own crate, published
# on crates.io (0.1.0, owner fschutt), consumed from the registry like any
# other dependency, so it is publish-safe for azul-layout.
micromail = { version = "0.1.0", optional = true, default-features = false }
# Digest verification of update downloads (already in the tree transitively).
sha2 = { version = "0.10", optional = true }
# Minisign SIGNATURE verification for update artifacts (pure Rust, zero deps).
minisign-verify = { version = "0.2", optional = true }

# SPMC channel — ONLY used by the e2e-server HTTP transport (feature
# `e2e-server-http`). The core op-dispatch does not need it.
spmc = { version = "0.3", optional = true }

# Platform-specific user directories (home, config, cache, etc.)
dirs = { version = "6.0", default-features = false, optional = true }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tfd = { version = "0.1", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# macOS Foundation ICU backend — enabled via the `icu_macos` feature
objc2 = { version = "0.6.0", optional = true }
objc2-foundation = { version = "0.3.0", default-features = true, optional = true, features = [
    "std",
    "NSArray",
    "NSCalendar",
    "NSDate",
    "NSDateFormatter",
    "NSListFormatter",
    "NSLocale",
    "NSNumberFormatter",
    "NSObjCRuntime",
    "NSRange",
    "NSString",
    "NSValue",
] }

# CoreText / CoreGraphics for native font rendering comparison tests
# NB: keep these three on the SAME core-foundation generation — core-text 20.1
# and core-graphics 0.23 are built against core-foundation 0.9, so pinning
# core-foundation to 0.9 keeps CTFont/TCFType consistent (0.10 splits the trait
# and CTLine::set_attribute then rejects the 0.9-declared CTFont).
core-foundation = { version = "0.9", optional = true }
core-graphics = { version = "0.23", optional = true }
core-text = { version = "20.1", optional = true }

# Allocator-specific purge hooks. Enabled by consumer crates that link
# against the matching global allocator. Both features are mutually
# exclusive — enabling both produces a build error.
libmimalloc-sys = { version = "0.1", default-features = false, features = ["extended"], optional = true }
tikv-jemalloc-sys = { version = "0.6", default-features = false, optional = true }

[features]
# WIP gate for the dormant-test port (see [[test]] text3_suite).
text3-suite-wip = []
# Default: Full layout engine with text, fonts, SVG, images, accessibility
# Uses multithreaded font loading for faster startup on desktop
# `probe` is DEFAULT-ON (USER ruling 2026-08-29): spans are one relaxed
# atomic when not recording, and every real build (build-dll, telemetry)
# wants them anyway - the only observability piece that stays opt-in is the
# HTTP debug server (`e2e-server-http`), which opens a listening socket.
default = ["std", "text_layout", "text_layout_hyphenation", "font_loading_multithreaded", "font_async_registry", "svg", "image_decoding", "cpurender", "a11y", "widgets", "extra", "icons", "probe"]

# Fine-grained timing + RSS instrumentation. Enables `probe::Probe::span`
# guards across the layout pipeline. Off by default — consumer crates
# (servo-shot, profiling harnesses) opt in. Zero cost when off.
probe = ["dep:libc"]

# WEB-LIFT (2026-06-02): set when azul-layout is compiled for the remill/web backend
# (azul-dll's web-transpiler). Skips code paths whose lifted form traps — currently the
# NAME-table string decode (encoding_rs jump-tables → MISSING_BLOCK); font_name is optional
# metadata, not used for layout/metrics/shaping. Off for native (full behaviour kept).
# Also enables rust-fontconfig's single-thread-unsafe-locks (no-atomic UnsafeCell StLock):
# std's queue RwLock `lock_contended` spins forever in single-threaded lifted wasm. `?` = only
# when rust-fontconfig (font_loading) is on; native builds keep the thread-safe RwLock. Feature
# unification applies it to azul-core's rust-fontconfig too.
web_lift = ["rust-fontconfig?/single-thread-unsafe-locks", "azul-core/web_lift"]

# Wire `hint_purge_allocator()` to the matching allocator's pressure-relief
# call. Without these flags the default macOS path only drains the system
# zone — which is a no-op when a third-party global allocator (mimalloc,
# jemalloc) is installed.
allocator_mimalloc = ["dep:libmimalloc-sys"]
allocator_jemalloc = ["dep:tikv-jemalloc-sys"]

# Standard library support
std = ["azul-core/std", "regex-lite?/std"]

# String formatting utilities (strfmt crate)
strfmt = ["dep:strfmt", "std"]

# Widget support (button, text_input, checkbox, etc.)
widgets = ["text_layout", "strfmt"]

# Extra APIs (native dialogs, file operations)
extra = ["dep:tfd", "dep:dirs"]

# Basic text shaping (unicode support, allsorts font parsing)
# Requires font_loading for font discovery (FcFontCache)
# Does NOT include hyphenation (saves ~25 dependencies)
text_layout = [
    "std",
    "font_loading",
    "dep:unicode-normalization",
    "dep:allsorts",
    "dep:tinyvec",
    "dep:unicode-segmentation",
    "dep:unicode-bidi",
    # `form` is the only consumer of regex-lite, and it is gated on this
    # feature. text_layout implies std, which regex-lite requires.
    "dep:regex-lite"
]

# Automatic hyphenation (adds ~25 deps: bincode, fst, hyphenation_commons, pocket-resources)
text_layout_hyphenation = ["text_layout", "dep:hyphenation"]

# PDF text operations (requires text_layout)
pdf = ["text_layout"]

# System font discovery (rust-fontconfig minimal, no parsing)
# NOTE: includes rust-fontconfig/async-registry because FontManager's `registry`
# field + lib.rs re-export use `rust_fontconfig::registry::FcFontRegistry`
# unconditionally (that module is gated behind async-registry upstream).
font_loading = ["dep:rust-fontconfig", "rust-fontconfig/std", "rust-fontconfig/parsing", "rust-fontconfig/mmapio", "rust-fontconfig/async-registry"]

# Multithreading for font cache building (faster on desktop, not available on WASM)
font_loading_multithreaded = ["font_loading", "rust-fontconfig/multithreading"]

# Async font registry: background scout + builder threads discover and parse fonts
# while the app initializes. At layout time, request_fonts() blocks only until the
# needed families are ready. Not available on WASM.
font_async_registry = ["font_loading", "rust-fontconfig/async-registry", "rust-fontconfig/cache"]

# Font introspection (adds allsorts via rust-fontconfig/parsing)
font_parsing = ["font_loading", "rust-fontconfig/parsing"]

# Image decoding support (image crate)
image_decoding = ["dep:image"]

# Individual image format features (require image_decoding)
gif = ["image_decoding", "image/gif"]
jpeg = ["image_decoding", "image/jpeg", "dep:zune-jpeg"]
png = ["image_decoding", "image/png"]
tiff = ["image_decoding", "image/tiff"]
bmp = ["image_decoding", "image/bmp"]
ico = ["image_decoding", "image/ico"]
tga = ["image_decoding", "image/tga"]
hdr = ["image_decoding", "image/hdr"]
webp = ["image_decoding", "image/webp"]
pnm = ["image_decoding", "image/pnm"]

# XML parsing support (for SVG and font configs)
xml = ["dep:roxmltree", "dep:xmlwriter", "dep:xmlparser"]

# SVG rendering support (lyon for tessellation, agg-rust for CPU render)
svg = [
    "dep:lyon",
    "dep:agg-rust",
    "dep:png",
    "xml",
    "dep:gl-context-loader"
]

# CPU-based rendering (agg-rust, requires allsorts for text)
# cpurender's svg.rs parses SVG through `crate::xml` — the feature must
# declare that, or enabling cpurender alone fails to compile (found when
# scoping the glyph rasterizer's azul-layout features).
cpurender = ["dep:agg-rust", "dep:png", "dep:allsorts", "dep:gl-context-loader", "xml"]

# Accessibility support (accesskit)
a11y = ["dep:accesskit"]

# macOS CoreText rendering comparison tests
coretext_tests = ["dep:core-foundation", "dep:core-graphics", "dep:core-text", "cpurender"]

# ICU4X internationalization support (number/date/list formatting, pluralization)
icu = ["dep:icu", "dep:icu_provider_blob", "dep:writeable", "std"]

# macOS Foundation ICU backend — uses NSNumberFormatter / NSDateFormatter /
# NSListFormatter instead of bundling ICU4X data blobs (~3.3 MB savings).
# On non-macOS platforms this feature is a no-op.
icu_macos = ["objc2", "objc2-foundation"]

# Windows NLS ICU backend — uses GetNumberFormatEx / GetDateFormatEx /
# GetTimeFormatEx / CompareStringEx from kernel32.dll (dynamically loaded).
# No new crate dependencies; no ICU data blobs bundled (~3.3 MB savings).
# On non-Windows platforms this feature is a no-op.
icu_windows = []

# Add chrono support for Date.now() style APIs (optional with ICU)
icu_chrono = ["icu", "dep:chrono"]

# Fluent localization support (Project Fluent FTL files, language packs)
fluent = ["dep:fluent", "dep:fluent-syntax", "dep:unic-langid", "dep:intl-memoizer", "zip", "strfmt", "std"]

# HTTP client support for downloading resources
http = ["dep:ureq", "azul-core/url", "dep:rustls", "dep:rustls-rustcrypto", "dep:webpki-roots", "std"]

# ZIP file manipulation (standalone, for C API)
zip = ["dep:zip", "std"]

# JSON parsing support
json = ["dep:serde_json", "std", "azul-core/serde-json"]

# Opt-in telemetry client: consent tiers, an in-process metric registry, an
# OTLP/HTTP JSON encoder, a disk-backed ping queue and an uploader.
#
# JSON encode/decode rides `serde_json` (the same optional dependency the
# `json` feature uses; USER ruling 2026-08-18 — no hand-rolled JSON), pulled
# in only when this feature is on. It does need `http` for the uploader's
# POST.
#
# Deliberately NOT in `default`: shipping an app that *can* phone home should
# be a decision the developer makes explicitly. Even with the feature on,
# collection stays off at runtime until a consent tier is configured — the
# tier is a runtime atomic (AZ_TELEMETRY + the layered config files), never a
# compile-time switch, so a consent toggle can flip it inside a running
# process.
# telemetry implies probe: the RSS/span instruments read through the probe,
# and a metrics build that silently reports 0 RSS violates "a zero is not a
# measurement".
telemetry = ["std", "http", "dep:serde_json", "probe"]

# Crash reports by EMAIL — the backup for deployments with no collector:
# telemetry tier `crashes` (metrics off), no Grafana/Loki, just a support
# mailbox that receives the crash dump as an attachment plus the user's
# message. Manual send from the app's next-launch dialog, never automatic.
crash-mail = ["telemetry", "dep:micromail"]

# Version checks + update policy (Phase 4). Notify-first: managed installs
# (dpkg, /usr, snap, flatpak, WindowsApps) are CLAMPED to notify-only at
# runtime — the system package manager owns those updates.
updater = ["std", "http", "dep:serde_json", "dep:sha2", "dep:minisign-verify"]

# Icon provider support (material icons, icon packs from fonts or ZIP files)
icons = ["std", "zip", "dep:material-icons", "dep:brotli-decompressor"]

# ─── E2E / debug-server op-dispatch (ported verbatim from the DLL) ───
# The ~12k-line `src/e2e/full.rs` op-dispatch (process_debug_event, the
# DebugEvent enum, the E2e* JSON types + scenario runner). Deliberately NOT in
# `default` so the lean published crate is byte-for-byte unaffected. The core
# path is host-agnostic (no networking, no OS coupling — those go through
# `e2e::hooks`), so a headless library caller can run E2E JSON scenarios with
# just this feature.
e2e-server = ["std", "json", "cpurender", "zip", "widgets", "text_layout", "font_loading", "a11y", "xml", "dep:spmc"]

# Request transport for the debug server: the spmc channel, the debug timer and
# `handle_event_request`. Opt-in ON TOP of `e2e-server`; the core op-dispatch and
# the headless runner compile WITHOUT it. This is what keeps the request
# plumbing off the library API path. The socket itself is the DLL's
# (`debug_server::platform`), because the debugger UI it serves is built by the
# DLL's build script.
e2e-server-http = ["e2e-server"]


# Opt-in gates for intentionally-disabled test files (kept in the tree, off by
# default — their `#![cfg(feature = "DISABLED_*")]` never matches normal builds).
# Declared here so the cfg is expected (silences unexpected_cfgs); enable with
# --features <name> to compile/run the corresponding test.
# `DISABLED_event_tests` and `DISABLED_selection_tests` are GONE (2026-08-20).
# Both gated integration files that were straight duplicates of unit tests
# already living next to the code they test, and which run (and pass) in
# `cargo test --lib`:
#   tests/selection.rs           -> layout/src/text3/selection.rs `mod tests`
#                                   (all 5 asserts, verbatim; 7 tests there)
#   tests/event_determination.rs -> layout/src/event_determination.rs
#                                   `mod tests` / `mod autotest_generated`
#                                   (window-resize + provider dedup, and far
#                                   more besides). The tests/ copies could not
#                                   even compile: they called the PRIVATE
#                                   `detect_window_state_events` and glob-
#                                   imported types that live in
#                                   `azul_core::events`, not in this module.
# The files were deleted rather than revived; there was nothing in them the
# library tests do not already assert.
DISABLED_hint_vs_freetype = []

# Live telemetry demo (see examples/telemetry-grafana/ for the Grafana stack).
# `required-features` keeps `cargo test --all-targets` on a default build from
# trying to compile it; add `probe` for the RSS + per-phase panels.
[[example]]
name = "verify_update_manifest"
path = "examples/verify_update_manifest.rs"
required-features = ["updater"]

[[example]]
name = "telemetry_grafana"
path = "examples/telemetry_grafana.rs"
required-features = ["telemetry"]

# THE integration-test target: the 116 former `tests/*.rs` binaries, folded into
# one link. Registration list and rationale live in tests/all.rs.
[[test]]
name = "all"
path = "tests/all.rs"

# Own process on purpose: forces AZ_TEXT_HINTING=0 (the macOS glyph mode)
# before the first glyph renders, which the read-once caches would otherwise
# leak into every other test of the shared binary.
[[test]]
name = "textinput_lcd_seam"
path = "tests/textinput_lcd_seam.rs"

[[test]]
name = "solver3_calc"
path = "tests/solver3/calc.rs"

[[test]]
name = "solver3_sizing"
path = "tests/solver3/sizing.rs"

[[test]]
name = "managers_scroll_into_view"
path = "tests/managers/scroll_into_view.rs"

[[test]]
name = "test_hint_debug"
path = "tests/test_hint_debug.rs"

[[test]]
name = "test_hint_vs_freetype"
path = "tests/test_hint_vs_freetype.rs"

[[test]]
name = "svg_path_parser"
path = "tests/svg_path_parser.rs"

[[test]]
name = "svg_render"
path = "tests/svg_render.rs"

[[test]]
name = "svg_xml_dom"
path = "tests/svg_xml_dom.rs"

# NOT folded into `all`: CI selects this one BY NAME, on its own feature set —
# `cargo test -p azul-layout --test icu_parity --no-default-features --features
# icu|icu_macos|icu_windows` (.github/workflows/rust.yml, job `icu_parity`).
# `--test <name>` only resolves against a real target, and the ~116 modules in
# `all` do not compile with `--no-default-features`, so this must stay
# separately selectable.
[[test]]
name = "icu_parity"
path = "tests/icu_parity.rs"

# NOT folded into `all`: `scripts/coretext_regression.sh` invokes it by name
# (`cargo test -p azul-layout --features coretext_tests --test
# coretext_autoregression --release -- --nocapture`). The file is
# `#![cfg(all(target_os = "macos", feature = "coretext_tests"))]`, so off macOS
# it links an empty ~6 MB harness — far cheaper than breaking the script.
[[test]]
name = "coretext_autoregression"
path = "tests/coretext_autoregression.rs"
# ADDED 2026-08-20. The file is `#![cfg(all(target_os = "macos", feature =
# "coretext_tests"))]`, so on every ubuntu `cargo test -p azul-layout --tests`
# it compiled to an EMPTY harness and printed a green `running 0 tests`.
# `required-features` makes cargo SKIP the target instead; the driver script
# passes `--features coretext_tests`, so it is unaffected. (The `target_os`
# half cannot be expressed here — on a Mac WITHOUT the feature the target is
# skipped too, and with it, it builds and runs.)
required-features = ["coretext_tests"]

[[test]]
name = "contenteditable_e2e"
path = "tests/contenteditable_e2e.rs"
required-features = ["cpurender", "text_layout", "font_loading", "a11y", "widgets"]

[[test]]
name = "text3_suite"
path = "tests/text3/mod.rs"
# The 57 formerly-dormant text3 tests (SHAPED_TEXT_REFACTOR_PLAN task
# T0), ported 2026-08-10 from the dead FontProviderTrait generation to
# the LoadedFonts pipeline via the compat wrappers in tests/text3/mod.rs.
# 45 live (incl. the only shape-outside + dictionary-hyphenation pins in
# the repo); 12 #[ignore]d. Those 12 were TRIAGED 2026-08-20 by actually
# running them (`--test text3_suite -- --ignored`): all 12 are RED, each
# pinning a hard-coded coordinate from the old generation. They are not
# hardware-gated and run in milliseconds, so this is a real behavioural
# delta someone must adjudicate per test — see the reason strings.
required-features = ["text_layout"]

[[test]]
name = "e2e_json"
path = "tests/e2e_json.rs"
required-features = ["e2e-server"]

# Renderer and hit test derive a VirtualView's child placement independently,
# in different modules; nothing else ties them together. Source-level, so it
# needs no features.
[[test]]
name = "virtualview_hit_matches_render"
path = "tests/virtualview_hit_matches_render.rs"

# Dev-only: JSON fixture deserialization for the e2e_json harness. Dev-deps are
# never shipped and never affect the published dependency graph, so this does
# NOT rely on the optional `json` crate feature.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "3.3", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "logging"], optional = true }
rustls-rustcrypto = { version = "0.0.2-alpha", optional = true }
webpki-roots = { version = "1.0", optional = true }

[dev-dependencies]
# Signing side of minisign — TESTS ONLY, to mint real signature vectors.
minisign = "0.9"
# The REAL accesskit consumer, TESTS ONLY: the a11y contract test feeds every
# TreeUpdate the manager parks through the same crate whose invariant
# `panic!`s abort a `panic = "abort"` release build.
accesskit = "0.24"
accesskit_consumer = "0.38"
serde_json = { version = "1.0", default-features = false, features = ["std"] }

[[bench]]
name = "fast_dom_bench"
harness = false
