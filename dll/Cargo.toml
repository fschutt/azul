[package]
readme = "../README.md"
name = "azul-dll"
version = "0.0.8"
# Lean published package: ship src only, not the test/bench/example/fuzz harnesses.
exclude = ["tests", "benches", "examples", "fuzz"]
authors = ["Felix Schütt <felix.schuett@maps4print.com>"]
license = "MIT"
description = "C-API of Azul GUI"
homepage = "https://azul.rs/"
keywords = ["gui", "user-interface", "svg", "graphics", "css" ]
categories = ["gui"]
repository = "https://github.com/maps4print/azul"
edition = "2021"
autoexamples = false
build = "build.rs"

[lib]
name = "azul"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# Core crates - only needed for build-dll and link-static, NOT for link-dynamic
azul-core = { path = "../core", version = "0.0.16", default-features = false, optional = true }
azul-css = { path = "../css", version = "0.0.16", default-features = false, optional = true }
# The dll uses azul_layout::widgets (43 sites) and azul_layout::desktop
# (dialogs), so those features must be DECLARED here. They used to arrive
# by accident: webrender took azul-layout with default features and cargo
# feature unification handed the full default set to every crate in the
# graph. Scoping webrender (2026-08-05) exposed the under-declaration -
# the dll stopped compiling until this line named what it actually uses.
azul-layout = { path = "../layout", version = "0.0.16", default-features = false, features = ["font_loading", "text_layout", "svg", "xml", "cpurender", "widgets", "extra", "icons", "image_decoding", "updater"], optional = true }

# Logging
log = { version = "0.4.17", default-features = false, optional = true }
fern = { version = "0.7.1", default-features = false, optional = true }
backtrace = { version = "0.3.66", optional = true }

# Python bindings.
# `extension-module` is REQUIRED: the `python-extension` feature builds the
# `dll` crate into a CPython extension module (`PyInit_azul`), so pyo3 must NOT
# link libpython (the manylinux/cibuildwheel build images have no shared
# libpython). The `auto-initialize` feature is deliberately OMITTED: it is only
# for *embedding* a Python interpreter inside a Rust binary and pulls in a
# shared-libpython link requirement that fails the static manylinux wheel build
# ("auto-initialize feature is enabled, but your python installation only
# supports embedding the Python interpreter statically"). Nothing in this crate
# embeds an interpreter, so it is unused.
pyo3 = { version = "0.27.1", default-features = false, features = ["abi3-py310", "multiple-pymethods", "extension-module", "macros"], optional = true }
pyo3-log = { version = "0.13.2", default-features = false, optional = true }

# PHP bindings (Zend engine extension via ext-php-rs)
# Used by feature `php-extension`. Provides closure-to-fnpointer
# support that standard php-ffi rejects, lifting the host-invoker
# blocker for the PHP example.
ext-php-rs = { version = "0.15", default-features = false, optional = true }

# Desktop windowing dependencies
# tfd (tinyfiledialogs) is for modal panic dialogs on the desktop;
# it has no equivalent on Android/iOS (no native modal API from a Rust
# crate) and its 0.1.0 release uses an older `jni` API that doesn't
# cross-compile for android targets. Declared per-target below.
rust-fontconfig = { version = "5.0", default-features = false, features = ["std", "parsing", "async-registry", "cache"], optional = true }
gl-context-loader = { version ="0.1.8", default-features = false, optional = true }
webrender = { path = "../webrender/core", default-features = false, optional = true }
once_cell = { version = "1.17.1", optional = true }
bitflags = { version = "2.8.0", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
# Postcard: compact no_std-friendly binary serialization. Used by
# the web backend's hydration payload (M8.7) — server serializes
# the HeadlessApp into one postcard envelope, embeds as base64 in
# the HTML head, wasm client deserializes at AzStartup_init.
postcard = { version = "1.0", features = ["use-std"], optional = true }
base64 = { version = "0.22", optional = true }

# Accessibility
accesskit = { version = "0.24", default-features = false, optional = true }

# PNG encoding for screenshots
png = { version = "0.18", default-features = false, optional = true }

# MP4 demux for the video decoder (extracts the H.264 elementary stream that
# gpu-video needs; gpu-video itself does NOT demux). Pure Rust, behind
# `video-native`. See dll/src/desktop/extra/video_codec/demux.rs.
mp4 = { version = "0.14", default-features = false, optional = true }

# Windows-only: libm for math functions
libm = { version = "0.2.2", default-features = false, optional = true }

# Enum iteration for debug server
strum = { version = "0.28", default-features = false, optional = true }

# SPMC channel for debug server → window timer communication
spmc = { version = "0.3", optional = true }

cfg-if = { version = "1.0", optional = true }

# Brotli decompression for embedded compressed assets (web backend api.json)
brotli-decompressor = { version = "5", default-features = false, features = ["std"], optional = true }

# Brotli COMPRESSION for the web server's wire encoding (mini.wasm + shards
# served with `Content-Encoding: br`; WEB_WASM_DIET_PLAN §2.2). Only pulled in
# by the `web` feature. NB: there is also a `brotli` build-dependency (the
# in-process remill/LLVM wrapper) — that one is unrelated and stays separate.
brotli = { version = "8", optional = true }

# Mach-O / ELF / PE parsing for the web-transpiler SymbolTable. Wraps
# every platform under one `goblin::Object::parse` call, so the
# SymbolTable's macOS / Linux backends share most of their code.
# (Default features include elf32/elf64/mach32/mach64/pe32/pe64; some
# of goblin's internal macros reference elf32 even when only elf64 is
# wanted, so defaults are the path of least friction.)
goblin = { version = "0.10", optional = true }

# Web-transpiler x86/Windows lift deps. Declared platform-agnostically
# (both are pure-Rust and build on every host) so the `web-transpiler`
# feature can reference `dep:pdb`/`dep:iced-x86` on ALL targets without a
# manifest error — a target-only optional dep cannot be named by a
# cross-platform feature. The CODE that uses them is `cfg(target_os =
# "windows")`-gated, so non-Windows builds compile them but never call in.
#   pdb     — PE images carry no symbol table; read the module's .pdb
#             (publics = mangled `_ZN…` link names classify_for_name keys on;
#             procs give exact sizes).
#   iced-x86 — x86 instruction LENGTH decoder; the byte scanners are rebuilt
#             on it because x86 is variable-length (compendium B8).
pdb = { version = "0.8", optional = true }
iced-x86 = { version = "1.21", optional = true, default-features = false, features = ["std", "decoder", "instr_info"] }

# Custom allocators — use these to aggressively return freed pages to the OS.
# Thanks to the C API boundary, the azul library can use a different allocator
# than the binary linking against it, so enabling these only affects azul's
# internal allocations.
mimalloc = { version = "0.1", default-features = false, optional = true }
tikv-jemallocator = { version = "0.6", default-features = false, optional = true }

# MVT/PBF decode + proj4rs Web-Mercator math for `MapWidget`'s tile pipeline.
# Inlined into `dll/src/desktop/extra/map/mvt.rs` (was the local-path `td`
# crate); proj4rs is the crates.io release. Opt-in via `feature = "map-tiles"`
# so default mobile builds stay light.
# NB: NO `wasm` feature — azul uses only the base Reader/feature/error API and
# does its own JSON translation. The `wasm` feature adds a wasm-bindgen JS
# interop module azul never touches, dragging js-sys + wasm-bindgen (+ their 6
# __wbindgen_* exports and ~1.2 MB of js_sys code, audit §2.10e) into every
# NATIVE build. Dropping it removes that dead weight on all platforms.
mvt-reader = { version = "2.1.0", optional = true }
geo-types = { version = "0.7", optional = true }
proj4rs = { version = "0.1", optional = true }
# `geojson` re-export so callers can name `geojson::Feature` in the
# `decode_mvt_tile` return type without going through `td`'s private
# graph. Same gate as `td`.
geojson = { version = "0.24", optional = true }
# SQLite engine for the `Db` API (P4.3), gated by `db-sqlite`. `turso` is a
# pure-Rust SQLite (no `cc`, no system libsqlite, no bindgen) so it
# cross-compiles to every target with no C toolchain. Default features OFF:
# they would add mimalloc (a C allocator via `cc`) and FTS; io_uring is an
# optional feature of turso_core that stays off, which is what the retired
# fork used to enforce.
turso = { version = "0.7", optional = true, default-features = false }
# turso pulls aegis (AEAD), whose build.rs compiles C AES via `cc` and fails to
# cross-compile to 32-bit (i686/armv7) — and a global cc-disable breaks zstd-sys.
# aegis's `pure-rust` feature (softaes) skips the C build entirely; pull it in
# directly so feature-unification enables it wherever turso is used.
aegis = { version = "0.9", features = ["pure-rust"], optional = true }
# PDF for AzulDoc (P5), gated by `pdf`. printpdf shares OUR azul-layout (via
# the root [patch.crates-io] → local printpdf branch + local azul-*), so the
# dll links exactly one azul-layout. The `html` feature pulls in printpdf's
# html/bridge module — `display_list_to_printpdf_ops_with_margins` walks OUR
# display lists into PDF ops INCLUDING TEXT (SetFont/ShowText via
# azul_layout::text3::glyphs::get_glyph_runs_pdf) — which dom_to_bytes uses;
# without it PDFs contained rectangles only (the textless azul-writer bug).
printpdf = { version = "0.12.7", default-features = false, features = ["html", "images", "png", "jpeg"], optional = true }

# Typed multi-flavor clipboard payloads: codecs (RTF/CF_HTML/uri-list/DIB/…)
# and read/write policy. Deliberately OS-FREE — pure Rust, no system library —
# so it belongs in the shared table, not behind a per-OS cfg. The TRANSPORTS
# are what vary: `shell2/<platform>/clipboard.rs` exchanges `ClipboardPayload`
# with it through `shell2/common/clipboard.rs`.
#
# This was previously excluded from iOS/Android, which is what made
# `common/clipboard.rs` fail to build there — the module is unconditional and
# the crate it imports was not. iOS now has a real `UIPasteboard` transport;
# Android still has none, but the codecs cost it nothing.
#
# Feature set per the crate's INTEGRATION.md §3: styled text both ways, file
# lists (incl. the GNOME/KDE cut conventions), DIB images, and link/shortcut
# files. No `image` feature: azul has its own PNG encoder for the pixels→PNG
# delegation if ever needed.
rich-clipboard = { version = "0.1", features = ["rich-text", "file-list", "dib", "shortcut"], optional = true }
# The vocabulary crate underneath it. Already in the graph via rich-clipboard
# (so it costs nothing extra to compile); named directly because the transports
# need two things the facade does not re-export: `WindowsFormat`, to map a
# predefined CF_* number to the name `Flavor::from_windows_name` reads back,
# and `Budget`, to bound a Wayland pipe read that declares no length.
rclip-core = { version = "0.1", optional = true }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tfd = { version = "0.1.0", default-features = false, optional = true }
# Gamepad input (P6 feature 6) — desktop backend (Win/Linux/macOS). Mobile
# uses GCController / InputDevice instead, so gilrs is desktop-only.
gilrs = { package = "gilrs-azul", version = "0.11.3", optional = true }


[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "0.2", optional = true }
x11-clipboard = { version = "0.9.3", optional = true }
accesskit_unix = { version = "0.21", optional = true }
# GeoClue2 D-Bus client for the Linux geolocation backend. Pure-Rust (no system
# lib, cross-compiles) and already in the linux graph via accesskit_unix;
# non-optional so geolocation/linux.rs always compiles on linux.
zbus = "5"
# Runtime loader for the Linux ALSA audio backend (audio/alsa.rs dlopen's
# libasound). Non-optional on linux so the AudioSink backend always compiles.
libloading = "0.8"
# The Linux camera backend (camera/v4l2.rs) dlopen's libv4l2 at runtime via the
# `libloading` dep above — NO static link, so it cross-compiles to every target
# and only fails (gracefully) at runtime if libv4l2 is absent.

# Hardware video decode (Vulkan Video, H.264/H.265) for the native VideoDecoder
# (video_codec/decode_vulkan.rs). x86_64 Linux + Windows only: gpu-video can't
# build on Apple (no MoltenVK video) or Android (MediaCodec), and its `vk-mem`
# (C++/VMA) dep needs a C++ toolchain that the ARM/RISC-V cross-compile checks
# lack — so restrict to x86_64 desktop (other arches keep the stub decoder).
# Behind `video-native`; `default-features = false` drops the heavy wgpu dep — we
# use the raw Vulkan BytesDecoder path (decode -> NV12 -> CPU RGBA convert), which
# also gives the "headless VK decode, copy back to CPU" CPU-mode fallback.
[target.'cfg(all(target_arch = "x86_64", any(target_os = "linux", target_os = "windows")))'.dependencies]
gpu-video = { package = "gpu-video-azul", version = "0.4.0", default-features = false, optional = true }

[target.'cfg(any(target_os = "ios"))'.dependencies]
objc = { version = "0.2", optional = true }
objc-foundation = { version = "0.1", optional = true }
objc_id = { version = "0.1", optional = true }
# Runtime loader for VideoToolbox/CoreMedia (video_codec/videotoolbox.rs is
# cfg'd for macos+ios but the optional dep was previously macos-only).
libloading = { version = "0.8.6", optional = true }
# objc2 stack for the biometric backend (P4.1) — shared with macOS via
# `extra/biometric/apple.rs`. New objc2-native backends (design decision
# #2) use these rather than the objc 0.2 above.
objc2 = { version = "0.6.0", optional = true }
block2 = { version = "0.6.0", optional = true }
objc2-foundation = { version = "0.3.0", default-features = true, optional = true, features = [
    "std",
    "NSString",
    "NSError",
    # 8e-i-a: the altimeter delivers to an NSOperationQueue, the pedometer
    # counts from an NSDate, and both hand back their value as an NSNumber
    # (which lives under the NSValue feature).
    "NSOperation",
    "NSDate",
    "NSValue",
] }
objc2-local-authentication = { version = "0.3.2", default-features = true, optional = true, features = [
    "std",
    "LAContext",
    "LABiometryType",
    "block2",
] }
# Keychain (generic-password) for the keyring backend (P4.2). Already in
# the lock as a transitive dep; declared direct + optional here.
security-framework = { version = "3", optional = true }
# Motion sensors (P6 feature 5) — CMMotionManager pull API, shared with
# macOS via `extra/sensors/apple.rs`. CMLogItem gates the data accessors
# (acceleration/rotationRate/magneticField) + provides the sample timestamp.
objc2-core-motion = { version = "0.3.2", default-features = true, optional = true, features = [
    "std",
    "CMMotionManager",
    "CMAccelerometer",
    "CMGyro",
    "CMMagnetometer",
    "CMLogItem",
    # 8e-i-a. CMDeviceMotion is a DIFFERENT object from the raw three above:
    # it carries the OS's fused gravity / user-acceleration / attitude, which
    # an app cannot reproduce from the raw channels (the drift correction is
    # the whole point). CMAttitude gates the quaternion accessor.
    "CMDeviceMotion",
    "CMAttitude",
    # Barometer and step counter. iOS-only on purpose: the classes are also
    # present on macOS (checked at runtime with objc_getClass, not assumed),
    # but a Mac has neither sensor and relying on a class the docs mark
    # iOS-only would make an older macOS fail to LAUNCH rather than degrade.
    # Both are push-only, hence block2.
    "CMAltimeter",
    "CMAltitude",
    "CMPedometer",
    "block2",
] }
# Camera capture (AVFoundation) for the iOS camera backend — shares
# camera/avfoundation.rs with macOS (same AVFoundation API). Minimal features.
objc2-av-foundation = { version = "0.3.0", default-features = false, optional = true, features = [
    "std",
    "dispatch2",
    "objc2-core-media",
    "AVCaptureSession",
    "AVCaptureDevice",
    "AVCaptureInput",
    "AVCaptureOutput",
    "AVCaptureOutputBase",
    "AVCaptureVideoDataOutput",
    "AVCaptureAudioDataOutput",
    "AVMediaFormat",
    # AVCaptureSession presets (640x480 / 960x540 / 1280x720): the camera
    # backend captures at the size the widget asked for, not at 1080p.
    "AVCaptureSessionPreset",
    # requestAccessForMediaType:completionHandler: (TCC prompt) takes an
    # ObjC completion block — gated behind objc2-av-foundation's block2 flag.
    "block2",
] }
objc2-core-media = { version = "0.3.0", default-features = false, optional = true, features = [
    "std",
    "objc2-core-video",
    "CMSampleBuffer",
    "CMBlockBuffer",
    "CMFormatDescription",
    "CMTime",
    "CMSync",
] }
objc2-core-video = { version = "0.3.0", default-features = false, optional = true, features = [
    "std",
    "CVBase",
    "CVPixelBuffer",
    "CVImageBuffer",
    "CVBuffer",
    "CVReturn",
] }
dispatch2 = { version = "0.3.0", default-features = false, features = ["std", "objc2"], optional = true }
# (objc2-avf-audio moved to the apple (ios+macos) section below.)

# AVAudioEngine audio backend (AudioSink + mic) for BOTH iOS and macOS. Pure-Rust
# objc2 bindings (no build-time bindgen/SDK), so apple targets CROSS-COMPILE —
# unlike cpal's coreaudio-sys. macOS uses this instead of cpal.
[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
objc2-avf-audio = { version = "0.3.0", default-features = false, optional = true, features = [
    "std",
    "AVAudioEngine",
    "AVAudioNode",
    "AVAudioIONode",
    "AVAudioMixing",
    "AVAudioMixerNode",
    "AVAudioPlayerNode",
    "AVAudioBuffer",
    "AVAudioFormat",
    "AVAudioTypes",
    "AVAudioTime",
    "block2",
] }

[target.'cfg(target_os = "android")'.dependencies]
# NativeActivity bootstrap, event polling, soft-keyboard control, and
# the input-event enum. `native-activity` feature gives us the C shim
# that calls `android_main` so no Java is needed for Phase 1-4.
android-activity = { version = "0.6", default-features = false, features = ["native-activity"], optional = true }
# `ANativeWindow_lock` / `unlockAndPost` and other NDK primitives.
ndk = { version = "0.9", default-features = false, optional = true }
# Raw NDK Camera2 FFI (ACameraManager / AImageReader) for the Android camera
# backend (camera/android.rs); the safe `ndk` crate doesn't wrap camera.
# Already transitive via `ndk`.
ndk-sys = { version = "0.6", optional = true }
# Runtime loader for AAudio (audio/aaudio.rs dlopen's libaaudio.so) — AAudio is
# API 26+, so dlopen instead of -laaudio keeps the app loadable on API 24/25.
# Non-optional so the Android AudioSink/mic backend always compiles.
libloading = "0.8"
# Optional bridge to logcat for `log` macros — feature-gated.
android_logger = { version = "0.14", optional = true }
# Soft-keyboard / IME bridge (Phase 5) — speaks to the Java
# `NativeInputConnection` shim via JNI.
jni = { version = "0.21", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
# Runtime loader for the Vulkan loader (vulkan-1.dll) — the hardware-decode
# capability probe (video_codec/provision.rs) dlopen's it to check for
# VK_KHR_video_decode_h264, same as the Linux path. No link-time dependency.
libloading = "0.8"
# Windows mic + AudioSink via cpal (WASAPI = pure-Rust `windows` crate, no
# build-time bindgen). macOS/iOS use AVFoundation (objc2-avf-audio) instead so the
# apple builds CROSS-COMPILE — cpal's coreaudio-sys needs libclang + the CoreAudio
# SDK headers at build time.
cpal = "0.15"
winapi = { version = "0.3.9", optional = true, default-features = false, features = [
    "windowsx",
    "libloaderapi",
    "errhandlingapi",
    # FormatMessageW, so GetLastError codes reach the log as text
    "winbase",
    "winuser",
    "uxtheme",
    "dwmapi",
    "wingdi",
    "commdlg",
    "winerror",
    "wincred",
    "minwindef",
    # CreateFileW / CloseHandle on a HID interface path, for hid.dll's
    # HidD_GetSerialNumberString and HidD_GetFeature (extra/hid/windows.rs,
    # 8f-i-a-i-a / 8f-i-a-i-b-i).
    "fileapi",
    "handleapi",
] }
# Motion sensors (Windows.Devices.Sensors, WinRT) — accel/gyro/mag.
windows = { version = "0.62", optional = true, features = [
    "Devices_Sensors",
    # The precision touchpad's scroll-direction preference
    # (extra/natural_scroll.rs, 9b-ii-b-i-a).
    "Win32_System_Registry",
    # Proximity sensor discovery (extra/sensors/windows.rs, 8e-i-a-ii):
    # `ProximitySensor` has no GetDefault(), only a device selector.
    "Devices_Enumeration",
    "Foundation",
    "Security_Credentials_UI",
    "Win32_Foundation",
    "Win32_System_WinRT",
    "Win32_System_Com",
    # File drag-and-drop via OLE IDropTarget (windows/dnd.rs).
    "Win32_System_Ole",
    # Precision-touchpad pinch/pan (windows/direct_manipulation.rs, 7c-i-a).
    "Win32_Graphics_DirectManipulation",
    # Surface Pen haptics (extra/haptics/windows.rs, 9g-i-c). Devices_Input is
    # what carries PenDevice; Devices_Haptics the controller it hands back.
    "Devices_Haptics",
    "Devices_Input",
    # Surface Dial (windows/radial_controller.rs, 9c-i-c). UI_Input carries
    # RadialController; the Win32 Radial feature carries the HWND interop that
    # makes it reachable from a desktop app at all.
    "UI_Input",
    "Win32_UI_Input_Radial",
    "Foundation_Collections",
    # System Media Transport Controls (extra/media_keys/windows.rs,
    # 9h-i-a-i-c). `Media` carries SMTC itself; `Storage_Streams` carries the
    # `RandomAccessStreamReference` its thumbnail wants, which is the one
    # platform that can take album art as a URI rather than as decoded pixels.
    "Media",
    "Storage_Streams",
    "Win32_System_SystemServices",
    "Win32_System_Com_StructuredStorage",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
] }
# Direct windows-core dep so the `#[implement(IDropTarget)]` macro's
# `::windows_core::` paths (windows/dnd.rs) resolve to 0.62, not the 0.54
# that cpal pulls in transitively (two windows-core versions otherwise clash).
windows-core = { version = "0.62", optional = true }
# WinRT IAsyncOperation lives in windows-future (0.62 split); pollster blocks on it.
windows-future = { version = "0.3", optional = true }
pollster = { version = "0.4", optional = true }
clipboard-win = { version = "5.4", optional = true }
# Camera capture (Media Foundation) for the Windows camera backend
# (camera/windows.rs) - nokhwa owns the COM/MF ABI + gives a pull API, so we
# don't hand-roll COM. OPTIONAL + behind `camera-native`: nokhwa's decoding pulls
# mozjpeg-sys (C/bindgen), which breaks `cargo check --target *-windows-gnu`. With
# the feature OFF (default) camera/windows.rs is a pure-Rust stub so Windows
# cross-compiles; flip `camera-native` on for a real build with a C toolchain.
nokhwa = { version = "0.10", features = ["input-native"], optional = true }
accesskit_windows = { version = "0.32", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
cgl = { version = "0.3.2", optional = true }
dispatch2 = { version = "0.3.0", default-features = false, features = ["std", "objc2"], optional = true }
objc2 = { version = "0.6.0", optional = true }
objc = { version = "0.2", optional = true }
# NOTE: `objc-foundation` / `objc_id` are deliberately NOT here. The clipboard
# was the last macOS user of the objc 0.2 Foundation wrappers; it moved to
# objc2-app-kit (design decision #2 — new backends are objc2-native), so on
# macOS they are dead weight. They stay in the iOS section, which still has
# real users (`shell2/ios/mod.rs`).
block2 = { version = "0.6.0", optional = true }
libloading = { version = "0.8.6", optional = true }
accesskit_macos = { version = "0.26", optional = true }
objc2-core-foundation = { version = "0.3.0", default-features = true, optional = true, features = [
    "std",
    "CFBase",
    "CFString",
    "CFBundle",
] }
objc2-foundation = { version = "0.3.0", default-features = true, optional = true, features = [
    "std",
    "NSArray",
    "NSThread",
    "NSString",
    "NSError",
    # NSData: the pasteboard's byte carrier. `-length` is also the read-side
    # SizeHint::Exact — asked BEFORE the bytes are copied into a Vec.
    "NSData",
    # NSArray::iter() is gated on this: the clipboard walks -pasteboardItems
    # and each item's -types.
    "NSEnumerator",
] }
objc2-app-kit = { version = "0.3.0", default-features = true, optional = true, features = [
    "std",
    "objc2-core-foundation",
    "NSApplication",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSTextInputClient",
    "NSTextInputContext",
    "NSView",
    "NSWindow",
    "NSOpenGL",
    "NSOpenGLView",
    "NSDragging",
    "NSPasteboard",
    # The payload-level clipboard transport walks -pasteboardItems (the
    # pasteboard-level API only reaches the FIRST item offering a type, so a
    # three-file copy would read back as one file).
    "NSPasteboardItem",
    # The eyedropper: NSColorSampler is the system loupe (no screen-recording
    # permission); NSColor/NSColorSpace read the picked colour's sRGB parts.
    "NSColorSampler",
    "NSColor",
    "NSColorSpace",
    "block2",
    # Transparent windows on the CPU path: the frame is drawn with the Copy
    # operation (NSCompositingOperation lives in NSGraphics).
    "NSGraphics",
] }
# Biometric auth (P4.1) — LAContext / evaluatePolicy / biometryType.
objc2-local-authentication = { version = "0.3.2", default-features = true, optional = true, features = [
    "std",
    "LAContext",
    "LABiometryType",
    "block2",
] }
# Keychain (generic-password) for the keyring backend (P4.2).
security-framework = { version = "3", optional = true }
# Motion sensors (P6 feature 5) — CMMotionManager, shared with iOS.
objc2-core-motion = { version = "0.3.2", default-features = true, optional = true, features = [
    "std",
    "CMMotionManager",
    "CMAccelerometer",
    "CMGyro",
    "CMMagnetometer",
    "CMLogItem",
    # 8e-i-a. The fused kinds; see the iOS block for why the altimeter and
    # the pedometer are NOT here.
    "CMDeviceMotion",
    "CMAttitude",
] }
# Camera capture (AVFoundation) for the macОS camera backend
# (camera/avfoundation.rs). objc2 framework crates gate each class behind a
# feature, so default-features = false + only the capture-path classes keeps
# the build minimal (not the whole AVFoundation API).
objc2-av-foundation = { version = "0.3.0", default-features = false, optional = true, features = [
    "std",
    "dispatch2",
    "objc2-core-media",
    "AVCaptureSession",
    "AVCaptureDevice",
    "AVCaptureInput",
    "AVCaptureOutput",
    "AVCaptureOutputBase",
    "AVCaptureVideoDataOutput",
    "AVCaptureAudioDataOutput",
    "AVMediaFormat",
    # AVCaptureSession presets (640x480 / 960x540 / 1280x720): the camera
    # backend captures at the size the widget asked for, not at 1080p.
    "AVCaptureSessionPreset",
    # requestAccessForMediaType:completionHandler: (TCC prompt) takes an
    # ObjC completion block — gated behind objc2-av-foundation's block2 flag.
    "block2",
] }
objc2-core-media = { version = "0.3.0", default-features = false, optional = true, features = [
    "std",
    "objc2-core-video",
    "CMSampleBuffer",
    "CMBlockBuffer",
    "CMFormatDescription",
    "CMTime",
    "CMSync",
] }
objc2-core-video = { version = "0.3.0", default-features = false, optional = true, features = [
    "std",
    "CVBase",
    "CVPixelBuffer",
    "CVImageBuffer",
    "CVBuffer",
    "CVReturn",
] }

[build-dependencies]
brotli = "8"
# M8.9: in-process remill + LLVM + LLD wrapper. Compiles
# dll/src/web/cpp/azul_remill.cpp + statically links the remill /
# LLVM / LLD libs from third_party/remill-install/ + cxx-common so
# libazul.dylib can lift native code → wasm32 without invoking
# external `remill-lift-17` / `opt` / `llc` / `wasm-ld` subprocesses.
# Gated by the `web-transpiler-static` feature; the build script
# no-ops when that's off.
cc = { version = "1.0", optional = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# A transitive getrandom 0.2 (via uuid / fluent / rand etc.) `compile_error!`s on
# wasm32-unknown-unknown unless its `js` backend is enabled. Pull it in here with
# `js` so feature-unification turns it on and azul-dll cross-checks for the web
# target. (Runtime uses the JS Crypto API in the browser.)
getrandom = { version = "0.2", features = ["js"] }

# =============================================================================
# Features
# =============================================================================

[features]
# Sentinel: never enabled. memtest gates its (otherwise-duplicate) C-ABI fns on
# this so they are not #[no_mangle] (avoids symbol clash with dll_api_internal in
# `cargo test`). See doc CodegenConfig::memtest.
__memtest_no_export = []

# Default: Build with static linking (for Rust applications)
# Use --features "build-dll" when building the shared library itself
default = [
    "std",
    "link-static",
    "logging",
    "a11y",
    "all_img_formats",
]

# -----------------------------------------------------------------------------
# Codegen Block Features (granular — each gates a generated include!() file)
# -----------------------------------------------------------------------------

# Internal C-ABI bindings: types + function bodies via transmute
# Uses: target/codegen/dll_api_internal.rs
# Requires the full azul stack (azul-core, azul-css, azul-layout)
cabi_internal = []

# Export C-ABI symbols with #[no_mangle] (for dlsym / C/C++/Python FFI)
# Implies cabi_internal. Also includes trait functions (_delete, _deepCopy, etc.)
# Needed by: build-dll (shared library), link-static + web (remill dlsym)
cabi_export = ["cabi_internal"]

# External C-ABI declarations: extern "C" { ... } for dynamic linking
# Uses: target/codegen/dll_api_external.rs
# Does NOT require azul-core or other internal crates
cabi_external = []

# Public Rust API re-exports (azul::dom::Dom, azul::app::App, etc.)
# Uses: target/codegen/reexports.rs
rust_api = []

# -----------------------------------------------------------------------------
# Build Modes
# -----------------------------------------------------------------------------

# Build the full desktop DLL with windowing, OpenGL, fonts, etc.
# This compiles all the platform-specific code in src/desktop/
# Exports C-ABI symbols with #[no_mangle] for use from C/C++/Python
build-dll = [
    "cabi_export",
    "rust_api",
    "_internal_deps",
    "font_loading_multithreaded",
    "font_async_registry",
    # Full functional surface for a complete libazul dylib — P4-P8 demos
    # consume these through api.json. New feature-gated subsystems
    # (db-sqlite, biometric, …) MUST be added here as they land.
    "a11y",
    "icons",
    "svg",
    "xml",
    "icu",
    "fluent",
    "http",
    "map-tiles",
    "db-sqlite",
    "pdf",
    "zip",
    # Real MP4/H.264 demux + Vulkan Video decode (video_codec/*). Pulls `mp4` +
    # (linux/windows) `gpu-video`, so libazul.so gives the C video player real
    # frames instead of the stub. No-op decoder on platforms without a backend.
    "video-native",
    # OTLP telemetry compiled into the shipped dylib so any app (and the
    # link-dynamic demos) can opt in at RUNTIME via AZ_TELEMETRY=... without a
    # special build. Consent stays dual-keyed: linking this in sends NOTHING
    # until the user/env turns a tier on (default Off).
    "telemetry",
    # Crash-report mail transport (micromail, our crate on crates.io): the
    # reporter dialog's Send when a deployment has no OTLP endpoint; armed by
    # `AppConfig.report_problem`. Pulls rustls for STARTTLS.
    "crash-mail",
    # Probe spans feed the app_phase_seconds{phase} + RSS-checkpoint panels.
    # Lazily gated at RUNTIME by AZ_PROFILE (probe.rs) - compiled in but not
    # recording, the spans are a branch and nothing else.
    "azul-layout/probe",
    # AZ_E2E SCRIPTING, in every shipped dylib. The execution engine only:
    # `debug-server` (the HTTP port + the bundled debugger JS) stays OUT, so
    # there is no listening socket and no 2-4 MB of JS in the binary. A script
    # handed over via `AZ_E2E=script.json` needs no server at all, and without
    # this an app built the normal way silently ignored AZ_E2E - which is
    # exactly what "the app did nothing" looked like (2026-09-01).
    "e2e-scripting",
]

# SQLite-backed `Db` API (P4.3). Pulls the bundled-SQLite `rusqlite`
# engine; the public surface (SQL strings + DbValue/DbRows) hides it. Kept
# OUT of `link-static` (the mobile gate) so the gate doesn't cross-compile
# SQLite's C amalgamation for every target — verified instead via the host
# check + a targeted per-target check (see MOBILE_SESSION_LOG P4.3b).
db-sqlite = ["dep:turso", "dep:aegis"]
# PDF export (P5 AzulDoc). Pulls printpdf's core PDF API (no azul-layout
# integration features). Out of `link-static` (the mobile gate), like
# db-sqlite; the export API is always present (stub when off), so it flows
# through codegen with no feature-gating.
pdf = ["dep:printpdf", "serde_json"]

# -----------------------------------------------------------------------------
# Link Modes (for consumers of the library)
# -----------------------------------------------------------------------------

# Static linking: C-ABI function bodies + #[no_mangle] exports
# Uses: target/codegen/dll_api_internal.rs (with #[no_mangle] via cabi_export)
# Requires the full azul stack to be compiled in
# NOTE: link-static now exports C-ABI symbols (same as build-dll) so that
# remill can discover function names via dlsym when AZ_BACKEND=web is used.
# Trait impls also route through C-ABI functions (not raw transmute) so that
# the call graph is visible to the x86→WASM lifter.
link-static = [
    "cabi_export",
    "rust_api",
    "_internal_deps",
]

# Dynamic linking: Include extern "C" declarations
# Uses: target/codegen/dll_api_external.rs
# Requires libazul.dylib/so/dll to be available at runtime
# Set AZ_LINK_PATH environment variable to the directory containing libazul
# NOTE: Does NOT require azul-core or other internal crates
link-dynamic = [
    "cabi_external",
    "rust_api",
]

# Shared dependencies for build-dll and link-static (not user-facing)
_internal_deps = [
    "std",
    "azul-core",
    "azul-css",
    "azul-layout",
    # AZ_PROFILE=cpu per-phase timings — per-span overhead is tiny
    # (Instant::now + thread-local Vec push on Drop). Always-on in the
    # DLL so live apps can opt into profiling at run time, no rebuild.
    # [g62 reverted] probe-disable did NOT fix the new_tree corruption (timeline unchanged) → the
    # probe Span sret was NOT it. Re-enabled to keep desktop profiling.
    "azul-layout?/probe",
    "cpurender",
    "tfd",
    "gilrs",
    "rust-fontconfig",
    "gl-context-loader",
    "webrender",
    "once_cell",
    "bitflags",
    "serde",
    "serde_json",
    "serde-json",
    "backtrace",
    "font_loading",
    "text_layout",
    "svg",
    "xml",
    "strum",
    "spmc",
    "dep:png",
    # Platform-specific clipboard transports + the shared payload/codec layer
    "x11-clipboard",
    "clipboard-win",
    "dep:rich-clipboard",
    "dep:rclip-core",
    # Windows needs libm
    "libm",
    # ICU backends: each platform picks the best one via cfg conditions.
    # macOS  → icu_macos  (Foundation, no data blobs)
    # Windows → icu_windows (Win32 NLS, no data blobs)
    # Linux  → icu        (ICU4X, data blobs — no system alternative)
    "icu",
    "icu_macos",
    "icu_windows",
    # Fluent localization support
    "fluent",
    # NOTE: `http` (rustls + rustls-rustcrypto + the elliptic-curve/getrandom
    # crypto stack) is deliberately NOT in the shared gate. Like db-sqlite/pdf
    # it belongs to build-dll only, so the `link-static` mobile/cross gate — and
    # wasm32-unknown-unknown — stay free of the crypto stack and cross-compile
    # cleanly. Consumers that need HTTPS enable the `http` feature explicitly
    # (e.g. azul-doc).
    # ZIP file manipulation
    "zip",
    # JSON support
    "json",
    # Icon provider support
    "icons",
    # Platform-specific deps (optional, only linked on matching OS)
    "cfg-if",
    "cgl",
    "dispatch2",
    "objc2",
    "objc",
    "objc-foundation",
    "objc_id",
    "block2",
    "libloading",
    # Android NDK + NativeActivity glue (no-op on non-Android targets via
    # target.'cfg' gate above).
    "android-activity",
    "ndk",
    "ndk-sys",
    # JNI for Rust → Java calls (file picker, soft keyboard, permission
    # prompts). The receiving direction (Java → Rust) is via raw `extern
    # "system"` symbols and doesn't need this dep.
    "jni",
    "objc2-core-foundation",
    "objc2-foundation",
    "objc2-app-kit",
    "objc2-local-authentication",
    "objc2-core-motion",
    "objc2-av-foundation",
    "objc2-avf-audio",
    "objc2-core-media",
    "objc2-core-video",
    "security-framework",
    "libc",
    "winapi",
    "windows",
    "windows-core",
    "windows-future",
    "pollster",
]

# -----------------------------------------------------------------------------
# Core Features
# -----------------------------------------------------------------------------

# NOTE: std feature only affects azul-core/layout when they are enabled via build-dll or link-static
# For link-dynamic, std has no effect since those crates aren't included
std = ["azul-core?/std", "azul-layout?/std"]
logging = ["log"]

# OTLP telemetry + crash capture (see layout/src/telemetry). NOT default:
# the shipped dll stays lean and phones nowhere. Enabling this also arms the
# AZ_CRASH_DUMP crash-reporter takeover in `App::run`.
telemetry = ["azul-layout?/telemetry"]
# Crash reports by EMAIL (micromail SMTP — our crate, on crates.io): the
# reporter dialog's Send when a deployment has no OTLP endpoint. Implies
# telemetry (the dump format + queue live there). `AppConfig.report_problem`
# arms the contact at startup.
crash-mail = ["telemetry", "azul-layout?/crash-mail"]

# Debug server / inspector / E2E runner. OFF by default so the shipped
# `azul.{so,dll,dylib}` is LEAN: no embedded HTTP server (AZ_DEBUG=<port> is a
# no-op), no E2E runner, no DOM-inspector/scaffold-generator machinery, and the
# ~8k lines of `common/debug_server` request handling are NOT compiled in (a few
# MB + an attacker-reachable port off the customer build). Build the swap-in
# `azuldbg.*` with `--features build-dll,debug-server` to re-enable AZ_DEBUG.
# Pulls `json`: the debug server's app-state ops (get/set/assert_app_state and
# the undo/redo mini-git) deserialize/serialize the app RefAny through
# `azul_layout::json`, so the server cannot compile without it.
#
# The implementation itself lives in `azul-layout` behind `e2e-server-http`
# (which implies `e2e-server`); `common/debug_server` only re-exports it and
# adds the TCP listener + `register_debug_timer`. It used to be a second, drifted
# copy of the same 12k lines.
debug-server = ["json", "azul-layout/e2e-server-http", "spmc"]
# E2E SCRIPTING WITHOUT THE HTTP SERVER.
#
# `debug-server` above pulls `e2e-server-http`, which opens a listening
# socket and carries the HTML debugger. Neither is wanted in a shipped
# binary: an accidentally-open port is a security problem, and the debugger's
# bundled JS is 2-4 MB of DLL. But the EXECUTION ENGINE is wanted — a script
# handed over via `AZ_E2E=script.json`, or by an app calling into it, needs no
# server at all.
#
# So this enables `e2e-server` (the op dispatch, despite the name) WITHOUT
# `-http` and without `spmc`, which exists only for the HTTP transport.
e2e-scripting = ["json", "azul-layout/e2e-server"]

# Memory allocator features — set the global allocator inside the azul DLL.
# Since azul exposes a C API, the allocator only affects azul's internal
# allocations. The host application keeps its own allocator.
# These are mutually exclusive; enabling both is a compile error.
allocator_mimalloc = ["dep:mimalloc"]
allocator_jemalloc = ["dep:tikv-jemallocator"]

# Web backend: serve the app as HTML over HTTP (AZ_BACKEND=web://ip:port)
# Phase 0: no external dependencies (uses std::net::TcpListener).
# Phase 1+: will add remill-rs, wasm-encoder as optional deps.
# Can be combined with link-static (Rust app) or used standalone (C binary).
web = [
    "azul-core",
    "azul-css",
    "azul-layout",
    "rust-fontconfig",
    "serde",
    "serde_json",
    "postcard",
    "base64",
    "dep:brotli-decompressor",
    "dep:brotli",
]

# x86-64 → WASM transpiler backend for the web feature.
# OFF by default: `default_transpiler()` returns `StubTranspiler`, the
# pure-Rust fallback that errors on lift and lets callbacks run server-side.
# ON: pulls in the remill-rs git submodule (third_party/remill-rs) and routes
# `default_transpiler()` through `RemillTranspiler`, which lifts x86-64 →
# LLVM IR → WASM. This is intentionally an opt-in feature so the default
# `web` build stays dependency-free and the transpile step's position in
# the web.md flow (build-time, first-request, lazy-per-callback) stays a
# caller decision rather than a hard-wired pipeline stage.
# dep:pdb / dep:iced-x86 are declared in the platform-agnostic [dependencies]
# (both are pure-Rust and build on every host), so this feature can reference
# them on ALL targets — a feature can't reference a target-only optional dep,
# which previously broke `cargo metadata` / CI on non-Windows. Their *use* in
# the source stays `#[cfg(windows)]`-gated, so mac/linux codegen is unchanged.
web-transpiler = ["web", "dep:goblin", "dep:pdb", "dep:iced-x86", "azul-layout?/web_lift"]

# Statically link remill + LLVM + LLD into libazul.dylib so the
# transpiler doesn't need external CLI tools. ~120 MB of static
# libs get pulled in. Requires:
#   - third_party/remill-install/install/{include,lib}/ populated
#     (run `bash scripts/build_remill.sh` to bootstrap).
#   - third_party/cxx-common/vcpkg_macos-13_llvm-17-liftingbits-llvm_xcode-15.0_arm64/
#     installed/arm64-osx-rel/{include,lib}/ populated (vcpkg-based
#     LLVM 17 + LLD ship with remill's cxx-common bundle).
# build.rs invokes `cc` to compile dll/src/web/cpp/azul_remill.cpp
# + emits the static-lib link line for cargo.
web-transpiler-static = ["web-transpiler", "dep:cc"]

# -----------------------------------------------------------------------------
# Accessibility
# -----------------------------------------------------------------------------

a11y = [
    "accesskit",
    "azul-layout/a11y",
    "accesskit_windows",
    "accesskit_macos",
    "accesskit_unix",
]

# -----------------------------------------------------------------------------
# Image Formats
# -----------------------------------------------------------------------------

all_img_formats = ["ico", "tga", "hdr", "jpeg", "webp", "pnm", "gif", "png", "tiff", "bmp"]
gif = ["azul-layout", "azul-layout/gif"]
jpeg = ["azul-layout", "azul-layout/jpeg"]
png = ["azul-layout", "azul-layout/png"]
tiff = ["azul-layout", "azul-layout/tiff"]
bmp = ["azul-layout", "azul-layout/bmp"]
ico = ["azul-layout", "azul-layout/ico"]
tga = ["azul-layout", "azul-layout/tga"]
hdr = ["azul-layout", "azul-layout/hdr"]
webp = ["azul-layout", "azul-layout/webp"]
pnm = ["azul-layout", "azul-layout/pnm"]

# -----------------------------------------------------------------------------
# Layout Features
# -----------------------------------------------------------------------------

svg = ["azul-layout", "azul-layout/svg"]
xml = ["azul-layout", "azul-layout/xml"]
cpurender = ["azul-layout", "azul-layout/cpurender"]
# Real Windows camera backend (nokhwa / Media Foundation). OFF by default so
# Windows cross-compiles with no C toolchain (camera/windows.rs is a pure-Rust
# stub); turn ON for an actual Windows build with mingw/MSVC. No effect on
# non-Windows targets (nokhwa is windows-only).
camera-native = ["dep:nokhwa"]
# Real video decode backend. The MP4->H.264 Annex-B demuxer (pure Rust, `mp4`
# crate) is unit-testable anywhere; the gpu-video (Vulkan Video) decoder rides on
# top on Linux/Windows (`dep:gpu-video` is a target-specific optional dep, so it's
# a no-op on Apple/Android — those use VideoToolbox/MediaCodec or the stub). OFF
# by default so the stub (video_codec/mod.rs) keeps cross-compile builds lean.
video-native = ["dep:mp4", "dep:gpu-video"]
font_loading = ["azul-layout", "azul-layout/font_loading"]
font_loading_multithreaded = ["font_loading", "azul-layout/font_loading_multithreaded"]
font_async_registry = ["font_loading", "azul-layout/font_async_registry"]
text_layout = ["azul-layout", "azul-layout/text_layout"]

# ICU4X internationalization support
icu = ["azul-layout", "azul-layout/icu"]
icu_chrono = ["icu", "azul-layout/icu_chrono"]

# macOS Foundation ICU backend (replaces ICU4X data blobs on macOS, ~3.3 MB savings).
# On non-macOS platforms this feature is a no-op.
icu_macos = ["azul-layout", "azul-layout/icu_macos"]

# Windows NLS ICU backend (replaces ICU4X data blobs on Windows, ~3.3 MB savings).
# On non-Windows platforms this feature is a no-op.
icu_windows = ["azul-layout", "azul-layout/icu_windows"]

# Project Fluent localization support (FTL files, language packs)
fluent = ["azul-layout", "azul-layout/fluent"]

# Icon provider support (material icons, icon packs). The dll owns the
# `include!` of the codegen-generated material_icons.ttf.br (moved out of
# azul-layout to break the azul-doc→azul-layout build cycle), so enabling
# icons must also pull the brotli decompressor here.
icons = ["azul-layout", "azul-layout/icons", "dep:brotli-decompressor"]

# HTTP client support for downloading resources.
#
# `azul-layout?/http` — NOT the bare `azul-layout` its siblings above use — so
# that asking for `http` cannot, by itself, drag the whole engine into a
# `link-dynamic` build. `map-tiles` implies `http` (the tile worker calls
# `azul_layout::http::http_get`), and a demo has to enable `map-tiles` to get a
# tile worker at all; with the bare form that turned AzMaps' dependency-only
# link-dynamic build into a full azul-layout + ureq + rustls compile, undoing
# the "demos link the prebuilt libazul, no engine rebuild" arrangement.
# Nothing is lost: the only `#[cfg(feature = "http")]` in dll/src re-exports
# `azul_layout::http` from `desktop::`, and that module is `cabi_internal`-gated
# — every build that can reach it already enables `azul-layout` via
# `_internal_deps`, so the forward still fires there.
http = ["azul-layout?/http"]

# ZIP archives. The `Zip` handle (extra/zip) is always compiled so it
# codegen-exposes unconditionally; this pulls the compressor behind it.
# Without it, entries still accumulate but `to_bytes`/`to_file` are empty.
zip = ["azul-layout", "azul-layout/zip"]

# JSON parsing and manipulation
json = ["azul-layout", "azul-layout/json"]

# MVT (Mapbox Vector Tile) decode + Web-Mercator projection math for
# `MapWidget`. Off by default — pulls in `td`, `mvt-reader`, `proj4rs`,
# `geo-types`, `geojson` which would inflate the mobile cargo-check.
# Desktop builds that actually fetch and decode tiles enable this via
# `--features map-tiles`.
map-tiles = ["dep:mvt-reader", "dep:geo-types", "dep:proj4rs", "dep:geojson", "serde_json", "http"]

# JSON serialization for RefAny (enables RefAny::new_serde<T>)
# Requires T: serde::Serialize + serde::de::DeserializeOwned
serde-json = ["serde", "serde_json", "azul-core?/serde-json"]

# -----------------------------------------------------------------------------
# Logging Backends
# -----------------------------------------------------------------------------

fern_logger = ["logging", "fern"]
pyo3_logger = ["pyo3-log", "logging"]

# -----------------------------------------------------------------------------
# Predefined Configurations
# -----------------------------------------------------------------------------

# Python extension module (ships as a SEPARATE artifact — azul.so — from the
# python-free C libazul.so). `Py*` symbols are left UNDEFINED for the interpreter
# to resolve at import (standard pyo3/manylinux). Do NOT bake Py* stubs into this
# cdylib: pyo3 is statically linked in, so a locally-defined Py* is dso_local and
# self-mis-binds, SIGSEGV-ing pyclass teardown (see src/lib.rs, removed 2026-07-07).
python-extension = ["build-dll", "pyo3", "pyo3_logger", "link-static"]

# PHP extension module (Zend engine native extension via ext-php-rs).
# Unlike the standard php-ffi path, this loads through the Zend engine
# and supports closure callbacks (the host-invoker pattern that all
# other managed-FFI hosts use).
# Build with:
#   cargo build --release --features php-extension
# Then load:
#   php -d extension=/path/to/libazul.so hello-world.php
php-extension = ["build-dll", "ext-php-rs", "link-static", "once_cell"]

# -----------------------------------------------------------------------------
# E2E Test Harness (AZ_E2E_TEST env-var-driven scenario runner)
# -----------------------------------------------------------------------------
# Enables the `common::e2e_test` module. At runtime, setting AZ_E2E_TEST=<json>
# replaces the normal window loop with a scripted resize/tick scenario that
# probes RSS after each batch of iterations. Used to reproduce the calc.c
# resize leak deterministically.
e2e-test = ["serde_json", "azul-layout?/probe"]

# -----------------------------------------------------------------------------
# Integration tests that need a non-default feature
# -----------------------------------------------------------------------------
#
# WHY THESE ENTRIES EXIST (2026-08-20). azul-dll's `default` is
# std + link-static + logging + a11y + all_img_formats — no `build-dll`, no
# `e2e-test`, no `xml`. Both files below are ENTIRELY inside a cfg that those
# defaults do not satisfy, so the ubuntu `cd dll && cargo test` job compiled
# each of them into an EMPTY test harness and printed a green `running 0 tests`.
# With `required-features`, cargo SKIPS the target instead of faking a pass —
# and the jobs that DO name them (`ffi_safety_tests` for leak_regression,
# `export_code_e2e` for the xml codegen tests) now fail loudly if the feature is
# ever renamed, rather than silently testing nothing.
#
# The `target_os` half of leak_regression's `#![cfg]` (macOS, or linux-gnu)
# cannot be expressed as a required-feature; ffi_safety_tests runs it on macOS
# only, which is where it is meaningful.

[[test]]
name = "leak_regression"
path = "tests/leak_regression.rs"
required-features = ["build-dll", "e2e-test"]

[[test]]
name = "xml_to_rust_compilation"
path = "tests/xml_to_rust_compilation.rs"
required-features = ["xml"]

# -----------------------------------------------------------------------------
# Examples
# -----------------------------------------------------------------------------

[[example]]
name = "transpile_fn"
path = "examples/transpile_fn.rs"
required-features = ["web", "link-static"]

[[example]]
name = "system_style"
path = "examples/system_style.rs"
required-features = ["link-static"]

[[example]]
name = "css_double_drop"
path = "examples/css_double_drop.rs"
required-features = ["link-static"]

[[example]]
name = "appconfig_double_drop"
path = "examples/appconfig_double_drop.rs"
required-features = ["link-static"]

[[example]]
name = "video_codec_provision"
path = "examples/video_codec_provision.rs"
required-features = ["link-static"]

# -----------------------------------------------------------------------------
# Package Metadata
# -----------------------------------------------------------------------------

[package.metadata.deb]
maintainer = "Felix Schütt <felix.schuett@maps4print.com>"
extended-description = """
    AZUL GUI Toolkit (https://azul.rs).
    Cross-platform GUI toolkit written in Rust
    built using the WebRender rendering engine
"""
depends = "$auto"
section = "utility"
priority = "optional"
assets = [
    ["target/release/libazul.so", "usr/lib/", "755"]
]

[package.metadata.docs.rs]
no-default-features = true
features = [
    "std",
    "logging",
    "all_img_formats",
    "font_loading",
    "text_layout",
    "svg",
    "xml",
    "fern_logger",
]
