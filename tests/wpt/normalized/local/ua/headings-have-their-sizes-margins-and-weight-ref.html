<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<title>Reference: h1 to h6 have their font sizes, margins and bold weight</title>
<style>
.h { display: block; font-weight: bold; }
</style>
</head>
<body><div class="h" style="font-size:2em;margin:.67em 0">h1</div><div class="h" style="font-size:1.5em;margin:.83em 0">h2</div><div class="h" style="font-size:1.17em;margin:1em 0">h3</div><div class="h" style="font-size:1em;margin:1.33em 0">h4</div><div class="h" style="font-size:.83em;margin:1.67em 0">h5</div><div class="h" style="font-size:.67em;margin:2.33em 0">h6</div>
</body>
</html>
