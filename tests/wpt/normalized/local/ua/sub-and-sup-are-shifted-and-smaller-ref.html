<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<title>Reference: sub and sup are shifted and smaller</title>
<style>
.sub { vertical-align: sub; font-size: smaller; }
.sup { vertical-align: super; font-size: smaller; }
</style>
</head>
<body><p>H<span class="sub">2</span>O and x<span class="sup">2</span></p>
</body>
</html>
