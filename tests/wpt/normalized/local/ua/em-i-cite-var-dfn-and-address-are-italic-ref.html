<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<title>Reference: em, i, cite, var, dfn and address are italic</title>
<style>
.it { font-style: italic; }
</style>
</head>
<body><p><span class="it">em</span> <span class="it">i</span> <span class="it">cite</span> <span class="it">var</span> <span class="it">dfn</span></p>
<div class="it">address</div>
</body>
</html>
