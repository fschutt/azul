<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<title>an ordered list numbers every item 1., 2., 3.</title>
<meta name="assert" content="HTML 15.3.8: ol { list-style-type: decimal }; each li increments list-item. The markers are inside, so they render as text."/>
<style>
.in { list-style-position: inside; }
</style>
</head>
<body><ol class="in"><li>one</li><li>two</li><li>three</li></ol>
</body>
</html>
