<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<title>Reference: ul has 40px start padding, 1em vertical margins and disc markers</title>
<style>
.ul { display: block; margin: 1em 0; padding-left: 40px; }
.li { display: list-item; list-style-type: disc; }
</style>
</head>
<body><div class="ul"><div class="li">one</div><div class="li">two</div></div>
</body>
</html>
