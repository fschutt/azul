<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<title>a block holding only a br is one line tall</title>
<meta name="assert" content="CSS 2 9.4.2: a forced line break ends a line box, so &lt;div>&lt;br>&lt;/div> holds one empty line (Gmail's blank lines)."/>
</head>
<body><div>one</div><div><br/></div><div>two</div>
</body>
