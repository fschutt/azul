<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<title>Reference: pre is monospace, keeps white space and has 1em vertical margins</title>
<style>
.pre { display: block; font-family: monospace; white-space: pre; margin: 1em 0; }
</style>
</head>
<body><div class="pre">one  two
  three</div><div>after</div>
</body>
</html>
