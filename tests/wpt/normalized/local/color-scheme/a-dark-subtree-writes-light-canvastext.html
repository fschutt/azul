<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<title>CanvasText in a color-scheme: dark subtree is not the light CanvasText</title>
<meta name="assert" content="CSS Color Adjust 1 2.1: color-scheme on an element changes the used values of system colours (CanvasText) in its subtree."/>
</head>
<body><div style="color-scheme:dark;color:CanvasText;background:gray;font-size:40px">Text</div>
</body>
</html>
