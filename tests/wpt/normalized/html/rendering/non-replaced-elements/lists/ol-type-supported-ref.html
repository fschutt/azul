<html>
<head>
<style>
.decimal {
  list-style-type: decimal;
}
.lower-alpha {
  list-style-type: lower-alpha;
}
.upper-alpha {
  list-style-type: upper-alpha;
}
.lower-roman {
  list-style-type: lower-roman;
}
.upper-roman {
  list-style-type: upper-roman;
}
</style>
</head>
<body><ol class="decimal"><li>1</li><li>2</li></ol>
<ol class="lower-alpha"><li>a</li><li>b</li></ol>
<ol class="upper-alpha"><li>A</li><li>B</li></ol>
<ol class="lower-roman"><li>i</li><li>ii</li></ol>
<ol class="upper-roman"><li>I</li><li>II</li></ol>
</body>
</html>
