<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<title>Table borders</title>
</head>
<body><table border="">
<tbody><tr><td>Test
</td></tr></tbody></table>
<table border="">
<tbody><tr><td>Test
</td></tr></tbody></table>
<table border="null">
<tbody><tr><td>Test
</td></tr></tbody></table>
<table border="undefined">
<tbody><tr><td>Test
</td></tr></tbody></table>
<table border="foo">
<tbody><tr><td>Test
</td></tr></tbody></table>
<table border="1">
<tbody><tr><td>Test
</td></tr></tbody></table>
<table border="1foo">
<tbody><tr><td>Test
</td></tr></tbody></table>
<table border="1%">
<tbody><tr><td>Test
</td></tr></tbody></table>
<table border="-1">
<tbody><tr><td>Test
</td></tr></tbody></table>
<table border="-1foo">
<tbody><tr><td>Test
</td></tr></tbody></table>
<table border="-1%">
<tbody><tr><td>Test
</td></tr></tbody></table>
</body>
</html>
