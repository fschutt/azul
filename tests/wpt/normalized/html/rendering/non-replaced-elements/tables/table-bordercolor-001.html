<html>
<head>
<style>
  table { margin: 5px }
</style>
</head>
<body><table bordercolor="red">
  <tbody><tr><td>I should not have a border.</td>
</tr></tbody></table>
<table style="border-color: red">
  <tbody><tr><td>I should not have a border.</td>
</tr></tbody></table>
<table bordercolor="red" style="border-width: 10px">
  <tbody><tr><td>I should not have a border.</td>
</tr></tbody></table>
<table style="border-color: red; border-width: 10px">
  <tbody><tr><td>I should not have a border.</td>
</tr></tbody></table>
<table bordercolor="lime" style="border-style: solid">
  <tbody><tr><td>I should have a border.</td>
</tr></tbody></table>
<table style="border-color: lime; border-style: solid">
  <tbody><tr><td>I should have a border.</td>
</tr></tbody></table>
</body>
</html>
