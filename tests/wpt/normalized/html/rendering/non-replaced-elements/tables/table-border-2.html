<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<title>Table borders</title>
</head>
<body><table border="0">
<tbody><tr><td>Test
</td></tr></tbody></table>
<table border="0foo">
<tbody><tr><td>Test
</td></tr></tbody></table>
<table border="0%">
<tbody><tr><td>Test
</td></tr></tbody></table>
<table border="+0">
<tbody><tr><td>Test
</td></tr></tbody></table>
<table border="+0foo">
<tbody><tr><td>Test
</td></tr></tbody></table>
<table border="+0%">
<tbody><tr><td>Test
</td></tr></tbody></table>
<table border="-0">
<tbody><tr><td>Test
</td></tr></tbody></table>
<table border="-0foo">
<tbody><tr><td>Test
</td></tr></tbody></table>
<table border="-0%">
<tbody><tr><td>Test
</td></tr></tbody></table>
</body>
</html>
