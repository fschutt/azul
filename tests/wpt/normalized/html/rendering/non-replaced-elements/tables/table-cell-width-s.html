<html>
<head>
<style>
body {
  margin: 0;
}

table {
  width: 400px;
  border-collapse: collapse;
}

th {
  font-weight: normal;
  text-align: left;
}

td, th {
  padding: 0;
}

td:first-child, th:first-child {
  background-color: red;
}
</style>
</head>
<body><table>
  <tbody><tr>
    <th width="0">a</th>
    <th>a</th>
  </tr>
</tbody></table>

<table>
  <tbody><tr>
    <td width="0">a</td>
    <td>a</td>
  </tr>
</tbody></table>


<table>
  <tbody><tr>
    <th width="100">a</th>
    <th>a</th>
  </tr>
</tbody></table>

<table>
  <tbody><tr>
    <td width="100">a</td>
    <td>a</td>
  </tr>
</tbody></table>
</body>
</html>
