<html>
<head>
<style>
html,body {
  color:black; background-color:white; font:16px/1 monospace; padding:0; margin:0;
}
body { margin-left: 10em; }
li { counter-increment: list-item 0; }
.dec { counter-increment:list-item -1; }
.zero { counter-increment:list-item 1 list-item -1; }
.two { counter-increment:list-item 3 list-item -1; }
  
</style>
</head>
<body>

<ol><li>a</li><li value="4">b</li><li>c</li></ol>
<ol><li>a</li><li value="4" style="counter-increment:list-item 5">b</li><li>c</li></ol>
<ol><li class="dec">a</li><li value="4" class="dec">b</li><li class="dec">c</li></ol>
<ol><li class="zero">a</li><li value="4" class="zero">b</li><li class="zero">c</li></ol>
<ol><li class="two">a</li><li value="4" class="two">b</li><li class="two">c</li></ol>



</body>
</html>
