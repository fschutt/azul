<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<title>CSS Reference Case</title>
<style>
  body {
    /* Increase left margin to ensure we can see the list item's marker. */
    margin-left: 50px;
  }
  .wrapper {
    border: 2px solid teal;
    width: max-content;
    margin-bottom: 2px;
  }
  ul {
    padding: 0;
    margin: 0;
  }
</style>
</head>
<body><div class="wrapper">
  
  <ul>
    <li>unspecified</li>
    <li>outside</li>
    <li>initial</li>
    <li>inherit</li>
    <li>unset</li>
    <li>revert</li>
    <li>revert-layer</li>
  </ul>
</div>
</body>
</html>
