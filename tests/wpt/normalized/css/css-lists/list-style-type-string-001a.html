<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
<title>CSS Test: String value of list-style-type</title>
<style>
    ol, ul { list-style-type: "# "; list-style-position: inside; }
  
</style>
</head>
<body>
  <ol start="-1">
    <li>item -1</li>
    <li>item 0</li>
    <li>item 1</li>
    <li>item 2</li>
  </ol>
  <ul start="-1">
    <li>item -1</li>
    <li>item 0</li>
    <li>item 1</li>
    <li>item 2</li>
  </ul>


</body>
</html>
