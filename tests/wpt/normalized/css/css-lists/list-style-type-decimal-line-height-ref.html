<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<title>CSS Lists Reference - check that the line height is the same between different forms of ::markers</title>
<style>
  div {
    display: grid;
    grid-template-columns: 100px 100px auto;
    align-items: start;
    background: red;
  }
  li {
    line-height: 100%;
    counter-set: list-item 1;
  }
  ol {
    margin: 0;
    padding: 0;
    padding-left: 40px;
    background: green;
  }
  ::marker {
    content: "1. ";
  }
</style>
</head>
<body><div>
  <ol>
    <li>foo</li>
    <li>bar</li>
    <li>baz</li>
  </ol>
  <ol>
    <li>foo</li>
    <li>bar</li>
    <li>baz</li>
  </ol>
  <ol>
    <li>foo</li>
    <li>bar</li>
    <li>baz</li>
  </ol>
</div>
</body>
</html>
