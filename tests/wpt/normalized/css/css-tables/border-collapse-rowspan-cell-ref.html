<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<title>CSS Reference</title>
<style>
  table {
    border-collapse: collapse;
  }

  td {
    border: 1px solid red;
  }
</style>
</head>
<body><table>
  <tbody><tr>
    <td id="target" rowspan="2">
      Needs border
    </td>
  </tr>
  <tr>
    <td>
    </td>
  </tr>
</tbody></table>
</body>
</html>
