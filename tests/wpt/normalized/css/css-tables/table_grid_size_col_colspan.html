<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta name="assert" content="colspanned cell fits inside grid defined by COL"/>
<style>
  table {
    border-collapse: collapse;
    table-layout:fixed;
  }
  td {
    height:50px;
    background: yellow;
    border: 10px solid green;
    padding:0;
  }
  col {
    width:50px;
  }
</style>
</head>
<body><table>
  <colgroup><col/>
  <col/>
  <col/>
  <td colspan="1"></td>
</colgroup></table>
<table>
  <colgroup><col/>
  <col/>
  <col/>
  <td colspan="2"></td>
</colgroup></table>
<table>
  <colgroup><col/>
  <col/>
  <col/>
  <td colspan="4"></td>
</colgroup></table>
<table>
  <colgroup><col/>
  <td colspan="1"></td>
</colgroup></table>
<table>
  <colgroup><col/>
  <td colspan="2"></td>
</colgroup></table>

</body>
</html>
