<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<style>
  span {
    border: 10px solid magenta;
    padding: 10px;
    margin: 10px;
    line-height: 200px;
  }
  div {
    border: solid cyan;
    line-height: initial;
    width: 200px;
  }
</style>
</head>
<body><span style="border-inline-end: none; padding-inline-end: 0; margin-inline-end: 0;">inline before split</span>
<div>There should be no magenta around this.</div>
<span style="border-inline-start: none; padding-inline-start: 0; margin-inline-start: 0;">inline after split</span>
</body>
</html>
