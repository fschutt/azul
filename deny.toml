# cargo-deny configuration — supply-chain, license, and dependency-tree gates.
# Run locally with `cargo deny check`. In CI the checks run in the quality jobs
# of .github/workflows/rust.yml and surface their output in the run Summary.

[advisories]
version = 2
# RUSTSEC advisory database. Vulnerabilities + unmaintained crates are reported;
# add specific IDs to `ignore` (with a justification comment) when a transitive
# advisory can't be fixed yet.
yanked = "warn"
ignore = [
    # ── Security — the shipped libazul reaches rsa ONLY through rustls-rustcrypto-azul
    # (our published fork of rustls-rustcrypto, rsa 0.10), used solely as a TLS *client*.
    # It is the pure-Rust crypto provider that lets libazul (via azul-layout)
    # cross-compile to the exotic targets (riscv64/s390x/ppc64/…) where ring /
    # aws-lc-rs need platform asm. rsa 0.9 comes in through example apps and
    # their crates (micromail's DKIM, sqlx, reqsign). Revisit when rsa ships a fix. ──
    { id = "RUSTSEC-2023-0071", reason = "rsa Marvin timing attack recovers a TLS *server's* RSA private key via decryption/signing timing. azul is a TLS client doing certificate signature *verification* (public-key) only and never performs RSA private-key ops, so the vulnerable path is unreachable. No fixed rsa release exists." },
    # rustls 0.23.45: the four advisories of 2026-10-14 are fixed in 0.23.46, published that same
    # day and so inside the 14-day cooldown for new crate versions; bump on or after 2026-10-28
    # and drop these four. None reaches azul's configuration (ring provider, default features).
    { id = "RUSTSEC-2026-0346", reason = "rustls 0.23.45 derived Debug on client session values. azul has no custom ClientSessionStore and never formats session values; the built-in cache's Debug is redacted. Fixed in 0.23.46 (cooldown until 2026-10-28)." },
    { id = "RUSTSEC-2026-0347", reason = "rustls 0.23.45 sends buffered data to the outer server after an ECH rejection. azul never enables EchMode::Enable. Fixed in 0.23.46 (cooldown until 2026-10-28)." },
    { id = "RUSTSEC-2026-0348", reason = "rustls 0.23.45 Brotli certificate decompression window. Only with the non-default brotli feature, which azul does not enable (Cargo.lock: rustls has no brotli dependency). Fixed in 0.23.46 (cooldown until 2026-10-28)." },
    { id = "RUSTSEC-2026-0349", reason = "rustls 0.23.45 remembers an unauthenticated key-exchange group, downgrading a hybrid post-quantum handshake. azul's rustls runs on ring, which offers no X25519MLKEM768, so there is no hybrid group to lose. Fixed in 0.23.46 (cooldown until 2026-10-28)." },
    # ── zip extraction to the filesystem. Every zip reader in the tree reads
    # entries into memory by index or name (azul-layout's zip.rs, AzMaps' KMZ
    # import, ironcalc's xlsx import in AzSheets, azul-doc's bundler); nothing
    # calls ZipArchive::extract or ZipStreamReader::extract, the only paths that
    # create files, symlinks or permission bits from an archive. Fixed in zip
    # >= 9.0.0, which azul-doc and ironcalc are on: a major-version move for
    # azul-layout (2.4), and ext-php-rs 0.15 (azul-dll's php-extension) pins 8. ──
    { id = "RUSTSEC-2026-0367", reason = "zip keeps SUID/SGID bits when extracting to disk. azul never extracts an archive to the filesystem (in-memory reads by index/name only), so no file is created with archive permissions. Fix: zip >= 9.0.0." },
    { id = "RUSTSEC-2026-0368", reason = "zip's ZipArchive::extract creates symlinks whose targets leave the destination. No caller of ZipArchive::extract exists in the tree; archives are read into memory. Fix: zip >= 9.0.0." },
    { id = "RUSTSEC-2026-0369", reason = "zip's extract() applies Unix permissions through extracted symlinks. No caller of extract() exists in the tree; archives are read into memory. Fix: zip >= 9.0.0." },
    # ── Unmaintained — no known vulnerability; deep-transitive in third-party
    # crates we don't own. Tracked, with fix paths noted. ──
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3/2.0.1 — team ceased development; 1.3.3 is declared a complete/stable release. Transitive via webrender 0.62, hyphenation (build dep), and rust-fontconfig. Migrating off it (postcard/…) needs upstream changes in those crates." },
    { id = "RUSTSEC-2025-0057", reason = "fxhash 0.2.1 unmaintained (-> rustc-hash). Pulled only by webrender 0.62 (our fork). Fix path: switch webrender's hasher to rustc-hash in the fork — tracked follow-up." },
    { id = "RUSTSEC-2026-0370", reason = "zvariant 5 unmaintained: merged into zbus 6 as its wire module (no vulnerability). Pulled by zbus 5: azul-dll's Linux D-Bus clients (portals, GeoClue, media keys) and accesskit_unix's AT-SPI stack (accesskit_atspi_common, atspi). Moving the dll to zbus 6 alone keeps zvariant 5 in the graph through accesskit_unix; the advisory names no safe upgrade until accesskit moves to zbus 6." },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained: merged into zbus 6 (no vulnerability). Same path as RUSTSEC-2026-0370 (zbus 5: the dll's D-Bus clients and accesskit_unix)." },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained: merged into zbus 6 (no vulnerability). Same path as RUSTSEC-2026-0370 (zbus 5: the dll's D-Bus clients and accesskit_unix)." },
    { id = "RUSTSEC-2024-0436", reason = "paste 1.0.15 archived (-> pastey). Transitive via nokhwa, netlink-packet-core, and rustls-rustcrypto-azul. Build-time macro only, no runtime/security impact; awaiting upstreams to migrate." },
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml 0.2.11 unmaintained. Pulled only by serde_yaml 0.9 in azul-doc, the build and docs tool that is never shipped; it parses the repo's own front matter and FUNDING.yml, no untrusted YAML. Fix path: move azul-doc to a maintained YAML reader." },
]

[licenses]
version = 2
# Permissive licenses azul + its dependency tree are expected to use. cargo-deny
# flags any crate whose license isn't on this list — that's the license review.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "OpenSSL",
    "MIT-0",
    "0BSD",
]
confidence-threshold = 0.8
exceptions = []

[bans]
# Duplicate dependency versions are reported (dependency-tree review) — a common
# source of bloat in the static dll. Wildcards (`*`) version reqs are discouraged.
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"
allow = []
deny = [
    # azlin-compress rebuilds deflate streams with the vendored examples/azlin-preflate. Every
    # published preflate-rs depends on cabac, and every cabac release is LGPL-3.0-or-later.
    { crate = "cabac", reason = "LGPL-3.0-or-later; azlin-compress uses the vendored azlin-preflate, which does not need it" },
    { crate = "preflate-rs", reason = "every published version depends on cabac (LGPL-3.0-or-later); azlin-compress uses the vendored azlin-preflate instead" },
]

[sources]
unknown-registry = "deny"
# azul pulls several git deps (turso fork, remill, allsorts-azul, rust-fontconfig,
# webrender). Git sources are allowed; crates.io is the only allowed registry.
unknown-git = "allow"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
