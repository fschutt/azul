name: The generated bindings
description: >-
  Downloads the tree a codegen job made (target/codegen) and unpacks it where the job wants it.

# The tree travels as ONE tar inside its artifact. download-artifact writes a zip's entries with
# many files open at once, and on Windows the tree's 15,847 files (the Java binding writes one
# per type) ran out of file handles - "EMFILE: too many open files" on every try - so no Windows
# job that needs the tree could start. One file is one handle.
inputs:
  os:
    description: The runner OS whose codegen job made the tree (Linux, macOS, Windows).
    required: true
  path:
    description: Where the tree goes (relative to the workspace).
    required: false
    default: target/codegen
runs:
  using: composite
  steps:
    - name: Download the generated bindings
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: codegen-tree-${{ inputs.os }}
        path: .codegen-tree-download

    # Relative paths only: GNU tar under Git Bash reads a drive letter ("D:") as a remote host.
    - name: Unpack the generated bindings
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "${{ inputs.path }}"
        tar -xf .codegen-tree-download/codegen-tree.tar -C "${{ inputs.path }}"
        rm -rf .codegen-tree-download
