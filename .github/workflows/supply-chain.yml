# Supply-chain checks separated from rust.yml to avoid exceeding GitHub's 512KB workflow size limit.
#
# Exceeding the 512KB limit causes GitHub to silently fail to start runs.
# Only `supply_chain_preflight` remains in rust.yml because `needs:` cannot cross workflow files.

name: Supply chain

on:
  push:
    branches: ['**']
    tags: ['[0-9]+.[0-9]+.[0-9]+*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{
      (github.event.pull_request.head.repo.full_name == github.repository
        && github.event.pull_request.head.ref) || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  NO_COLOR: "1"

jobs:
  # A workflow file over 512,000 bytes is silently inert. This size check must live in a separate,
  # small workflow file so it can actually run.
  workflow_size_guard:
    name: Workflow files must stay under GitHub's size limit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Check every workflow file against the 512,000-byte limit
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, sys
          LIMIT = 512_000          # GitHub limit for workflow triggers
          WARN  = int(LIMIT * 0.95)
          bad, warn = [], []
          for p in sorted(pathlib.Path(".github/workflows").glob("*.y*ml")):
              n = p.stat().st_size
              (bad if n > LIMIT else warn if n > WARN else []).append((p, n))
              print(f"{n:>9,}  {'OVER' if n > LIMIT else 'near' if n > WARN else 'ok':>4}  {p}")
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          for p, n in warn:
              print(f"::warning file={p}::{p} is {n:,} bytes, within 5% of the "
                    f"{LIMIT:,}-byte limit. Over it, GitHub silently stops running "
                    f"this workflow. Split shared logic into a composite action.")
          for p, n in bad:
              print(f"::error file={p}::{p} is {n:,} bytes, over GitHub's {LIMIT:,}-byte "
                    f"workflow limit. Runs for it are silently not started.")
          sys.exit(1 if bad else 0)
          PY

  # cargo-vet checks for unaudited dependencies per version. The cooldown refuses versions
  # younger than 14 days, mitigating supply chain attacks like compromised maintainer accounts.
  supply_chain_versions:
    name: cargo-vet + publish-age cooldown
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          # Fetch full history so the cooldown check can diff Cargo.lock against the base ref.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0

      - name: Install cargo-vet
        run: cargo install cargo-vet --locked || cargo install cargo-vet

      # --locked uses the audit set and imports.lock as committed, preventing network refreshes.
      - name: cargo vet
        shell: bash
        run: |
          set -o pipefail
          if ! cargo vet --locked 2>&1 | tee vet.txt; then
            # Distinguish a broken store from an unaudited dependency.
            if grep -qiE "couldn't acquire the store|no such file or directory" vet.txt; then
              echo "::error::cargo-vet could not read supply-chain/. Is the whole store committed? Ensure imports.lock is not ignored by .gitignore."
              exit 1
            fi
            {
              echo '## cargo-vet'; echo ''
              echo '```'; tail -80 vet.txt; echo '```'; echo ''
              echo 'A new or bumped dependency is neither audited nor exempted:'
              echo ''
              echo '```'
              echo 'cargo vet diff <crate> <old-version> <new-version>'
              echo 'cargo vet certify <crate> <old-version> <new-version>'
              echo '# or, if accepting it without review:'
              echo 'cargo vet add-exemption <crate> <version>'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::cargo-vet: an unaudited dependency version entered the tree."
            exit 1
          fi
          { echo '## cargo-vet'; echo ''; echo '```'; tail -20 vet.txt; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"

      # Only changed versions are age-checked to avoid rate limiting crates.io's API.
      - name: Publish-age cooldown (changed dependencies only)
        shell: bash
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          echo "comparing Cargo.lock against $BASE"
          python3 scripts/supply-chain/lockfile_guard.py \
            --check cooldown --min-age-days 14 \
            --changed-only --base-ref "$BASE" --no-cache

  # cargo-audit reads the same RustSec database as cargo-deny, fetching a fresh advisory-db on every run.
  # It is non-blocking and serves as a second opinion, surfacing advisories that deny.toml's ignore list may silence.
  advisories:
    name: cargo-audit (second opinion)
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked || cargo install cargo-audit
      - name: cargo audit
        shell: bash
        run: |
          mkdir -p stats
          cargo audit --color never 2>&1 | tee stats/cargo-audit.txt || true
          {
            echo '## cargo-audit (RustSec)'; echo ''
            echo '<details><summary>full report</summary>'; echo ''
            echo '```'; tail -120 stats/cargo-audit.txt; echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: stats-cargo-audit
          path: stats/cargo-audit.txt
          if-no-files-found: warn
          retention-days: 30
