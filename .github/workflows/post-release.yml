# Post-Release Watchdog Runner
#
# Verifies the published artifacts against the live host. A green CI build on a
# working tree can still ship broken artifacts (e.g., missing classes.dex in APKs,
# unresolved NuGet packages, missing dynamic libs).
#
# This workflow runs after a deployment to confirm the live site and artifacts
# actually work and reports failures without gating the release.
#
# Triggers:
#
#   - workflow_run: Verifies the exact deployment that just finished.
#   - schedule: Daily check to catch upstream ecosystem breakages (pip, NuGet).
#   - workflow_dispatch: Manual verification for a specific version.

name: Post-release checks

on:
  # Runs only when the build workflow completes. This ensures we test the
  # current release, rather than triggering on `push` which would test the
  # previous release ~80 minutes before the actual deploy finishes.
  workflow_run:
    workflows: ["build"]
    types: [completed]
  schedule:
    # Daily check against today's ecosystem clients. Failures show up in Actions.
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "azul version to verify (default: the version in api.json)"
        required: false
      base_url:
        description: "Base URL to verify against (default: https://azul.rs)"
        required: false

permissions:
  contents: read
  # Required to query the Actions API to check if the triggering run deployed.
  actions: read

concurrency:
  # Must run in a separate group from the build workflow so they never cancel each other.
  group: post-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve version + confirm the site is live
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
      base_url: ${{ steps.v.outputs.base_url }}
      # Ensure downstream jobs only run if a deploy actually occurred.
      deployed: ${{ steps.gate.outputs.deployed }}
      releases_url: ${{ steps.v.outputs.releases_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Filter out regular CI runs that did not deploy to GitHub Pages.
      - id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "workflow_run" ]; then
            echo "deployed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ github.event_name }} run — verifying the live site unconditionally"
            exit 0
          fi
          run_id="${{ github.event.workflow_run.id }}"
          concl="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs" --paginate \
                    --jq '.jobs[] | select(.name == "Deploy to GitHub Pages") | .conclusion' | head -1)"
          if [ "$concl" = "success" ]; then
            echo "deployed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::build run $run_id deployed successfully — verifying what it published"
          else
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::build run $run_id did not deploy — skipping verification"
          fi

      - id: v
        if: steps.gate.outputs.deployed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.inputs.base_url }}"
          [ -n "$BASE" ] || BASE="https://azul.rs"

          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            # api.json is the source of truth for the published version.
            VERSION=$(python3 -c 'import json;print(next(iter(json.load(open("api.json")))))')
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "base_url=$BASE"   >> "$GITHUB_OUTPUT"
          echo "::notice::verifying azul $VERSION against $BASE"

          # $BASE/releases is an HTML redirect stub. We must resolve the actual
          # `<meta http-equiv="refresh">` target rather than blindly checking
          # HTTP 200 on the stub, which breaks artifact parsing later.
          page=$(mktemp)
          curl -sSL -o "$page" "$BASE/releases" \
            || { echo "::error::$BASE/releases is unreachable"; exit 1; }

          target=$(grep -oiE 'http-equiv="refresh"[^>]*url=[^"'"'"']+' "$page" \
                   | sed 's/.*[Uu][Rr][Ll]=//' | head -1)
          if [ -n "$target" ]; then
            case "$target" in
              http*) : ;;
              /*)    target="${BASE}${target}" ;;
              *)     target="${BASE}/${target}" ;;
            esac
            echo "::notice::$BASE/releases redirects to $target"
            curl -sSL -o "$page" "$target" \
              || { echo "::error::redirect target $target is unreachable"; exit 1; }
          fi
          echo "releases_url=${target:-$BASE/releases}" >> "$GITHUB_OUTPUT"

          bytes=$(wc -c < "$page")
          if ! grep -qi 'release' "$page" || [ "$bytes" -le 2048 ]; then
            echo "::error::Resolved release page is $bytes bytes and invalid."
            exit 1
          fi
          echo "::notice::release page resolved, $bytes bytes"

  # Every self-hosted channel, run the way the site documents it, on the OS it
  # is for. Linux channels run in that ecosystem's own fresh container (a
  # Debian image for apt, an Arch image for pacman, ...); each check installs
  # from the live mirror and — where the tab then says "compile and run" —
  # builds the hello-world and runs it headless through the counter e2e.
  channels:
    name: "install: ${{ matrix.channel }}"
    needs: resolve
    if: needs.resolve.outputs.deployed == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { channel: pypi,     image: "python:3.12-bookworm@sha256:581429e3df12d76e6af4be5ab7d0e7fc2013eb57dc23d2de691411c8efdbb970",           prep: "" }
          - { channel: npm,      image: "node:22-bookworm@sha256:8a34c4ab3ea2c5cd194f07e317b2a8f09461d3c8b05c4e34c8ccd56d56024c4d",               prep: "" }
          - { channel: gems,     image: "ruby:3.3-bookworm@sha256:daf7fa54695b1fcb24fadd7b8cd18ff847e20ce76fe5a908e3cfe9af9147bc46",              prep: "" }
          - { channel: nuget,    image: "mcr.microsoft.com/dotnet/sdk:8.0@sha256:bb32ba3ba3ea36e38572d9d8db76fa15f7cbf722f3f886e06bca6d528bd4fba8", prep: "" }
          - { channel: apt,      image: "debian:bookworm@sha256:6ebd97fa83deb272194a2cf015b3d26a4d538e9ad3a7a79d544c8af5b0a01443",                prep: "apt-get update -qq && apt-get install -y -qq curl ca-certificates gnupg gcc g++ >/dev/null" }
          - { channel: maven,    image: "maven:3.9-eclipse-temurin-17@sha256:a8746f15d5bb26b5b8bacb056cc76211553850f4c71d16aff845cfa004cbc197",   prep: "apt-get update -qq && apt-get install -y -qq curl unzip >/dev/null" }
          - { channel: pacman,   image: "archlinux:base@sha256:82b1b08faae9d61e3e7e13d562f4d09114d939105b0d59ff34140f3bd418593a",                 prep: "pacman -Sy --noconfirm curl" }
          - { channel: apk,      image: "alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc",                    prep: "apk add -q bash curl coreutils" }
          - { channel: bindings, image: "python:3.12-bookworm@sha256:581429e3df12d76e6af4be5ab7d0e7fc2013eb57dc23d2de691411c8efdbb970",           prep: "" }
          - { channel: rust,     image: "rust:1.90-bookworm@sha256:3914072ca0c3b8aad871db9169a651ccfce30cf58303e5d6f2db16d1d8a7e58f",             prep: "" }
          - { channel: cargo,    image: "rust:1.90-bookworm@sha256:3914072ca0c3b8aad871db9169a651ccfce30cf58303e5d6f2db16d1d8a7e58f",             prep: "" }
          - { channel: doclinks, image: "python:3.12-bookworm@sha256:581429e3df12d76e6af4be5ab7d0e7fc2013eb57dc23d2de691411c8efdbb970",           prep: "" }
    container:
      image: ${{ matrix.image }}
    steps:
      - name: "Provide tools assumed by the documented commands"
        if: matrix.prep != ''
        shell: sh
        run: ${{ matrix.prep }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Run the documented command for ${{ matrix.channel }}"
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify_install_commands.sh \
            "${{ matrix.channel }}" \
            "${{ needs.resolve.outputs.base_url }}" \
            "${{ needs.resolve.outputs.version }}"

  # macOS: the Homebrew tap (+ the documented clang build, run headless), the
  # macOS wheel, and the cargo registry against the brew-installed libazul.
  macos:
    name: "install: ${{ matrix.channel }} (macOS)"
    needs: resolve
    if: needs.resolve.outputs.deployed == 'true'
    runs-on: macos-14
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        channel: [brew, pypi, cargo]
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: matrix.channel == 'pypi'
        with:
          python-version: "3.12"
      - name: "Run the documented command for ${{ matrix.channel }}"
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify_install_commands.sh \
            "${{ matrix.channel }}" \
            "${{ needs.resolve.outputs.base_url }}" \
            "${{ needs.resolve.outputs.version }}"

  # Windows: Chocolatey, the Scoop bucket and the Windows wheel.
  windows:
    name: "install: ${{ matrix.channel }} (Windows)"
    needs: resolve
    if: needs.resolve.outputs.deployed == 'true'
    runs-on: windows-2022
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        channel: [choco, scoop, pypi]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: matrix.channel == 'pypi'
        with:
          python-version: "3.12"
      - name: "Run the documented command for ${{ matrix.channel }}"
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify_install_commands.sh \
            "${{ matrix.channel }}" \
            "${{ needs.resolve.outputs.base_url }}" \
            "${{ needs.resolve.outputs.version }}"

  # The "curl these files" route: for every shipped language, on every OS it
  # documents, execute the frontpage's steps LITERALLY from the published
  # api.json (scripts/run_install_steps.py) and require the program they build
  # to pass the headless counter e2e. Toolchains are set up the way the e2e
  # matrix in rust.yml does it. Nothing is excluded: a language the site
  # documents for an OS is checked on that OS, and a red cell here is a
  # documented route that does not work — the finding, not noise.
  manual:
    name: "steps: ${{ matrix.lang }} (${{ matrix.os }})"
    needs: resolve
    if: needs.resolve.outputs.deployed == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
        lang: [c, cpp, rust, csharp, java, kotlin, lua, ruby, node, ocaml, zig, go, pascal, scala, fortran, haskell, python]
        exclude:
          # Not shipped there, and SAID so: the Kotlin Windows tab and guide
          # carry the blocker (JVM never terminates after the headless
          # layout). The tab has no commands to run. Re-enable together with
          # the fix in lang_kotlin (scripts/e2e_language_matrix.sh).
          - { os: windows-2022, lang: kotlin }
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ---- toolchains (the same actions the AZ_E2E matrix uses) ----
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential curl libgl1-mesa-dev libx11-dev >/dev/null
          case "${{ matrix.lang }}" in
            fortran) sudo apt-get install -y -qq gfortran make >/dev/null ;;
            pascal)  sudo apt-get install -y -qq fpc >/dev/null ;;
          esac
      - name: macOS packages
        if: runner.os == 'macOS'
        run: |
          set -e
          case "${{ matrix.lang }}" in
            # brew cannot pin versions (a formula is its current version); these
            # macOS-only extras therefore track Homebrew. Everything else is pinned.
            fortran) brew install gcc make >/dev/null ;;
            pascal)  brew install fpc >/dev/null ;;
            lua)     brew install luajit >/dev/null ;;
          esac
      - name: Linux packages (lua)
        if: runner.os == 'Linux' && matrix.lang == 'lua'
        run: sudo apt-get install -y -qq luajit >/dev/null
      - name: MSVC (LuaJIT build on Windows)
        if: runner.os == 'Windows' && matrix.lang == 'lua'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - name: LuaJIT (Windows; no choco package exists - built from source, ~1 min)
        if: runner.os == 'Windows' && matrix.lang == 'lua'
        shell: cmd
        run: |
          git clone --depth 1 https://github.com/LuaJIT/LuaJIT.git %RUNNER_TEMP%\LuaJIT
          cd %RUNNER_TEMP%\LuaJIT\src && msvcbuild.bat
          echo %RUNNER_TEMP%\LuaJIT\src>> %GITHUB_PATH%
      - name: MSVC (C / C++ on Windows)
        if: runner.os == 'Windows' && (matrix.lang == 'c' || matrix.lang == 'cpp')
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - name: Windows packages
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -e
          case "${{ matrix.lang }}" in
            pascal)  choco install freepascal --version 3.2.2 -y --no-progress ;;
            fortran) echo "C:\msys64\mingw64\bin" >> "$GITHUB_PATH"; C:/msys64/usr/bin/pacman -S --noconfirm mingw-w64-x86_64-gcc-fortran make ;;
          esac
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, 2026-09-07; the toolchain itself is pinned via with:
        if: matrix.lang == 'rust'
        with:
          toolchain: 1.90.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: matrix.lang == 'python'
        with:
          python-version: "3.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        if: matrix.lang == 'node'
        with:
          node-version: "22"
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1 branch, 2026-09-07
        if: matrix.lang == 'ruby'
        with:
          ruby-version: "3.3"
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        if: matrix.lang == 'csharp'
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        if: matrix.lang == 'java' || matrix.lang == 'kotlin' || matrix.lang == 'scala'
        with:
          distribution: temurin
          java-version: "17"
      - uses: fwilhe2/setup-kotlin@c061b2b2664e466684327ec98bd4e6f9aa9c2048 # v1 branch, 2026-09-07
        if: matrix.lang == 'kotlin'
        with:
          version: '2.3.10'
      - uses: coursier/setup-action@039f736548afa5411c1382f40a5bd9c2d30e0383 # v1.3.9
        if: matrix.lang == 'scala'
        with:
          apps: scala:3.9.0 scalac:3.9.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.lang == 'go'
        with:
          go-version: "1.22"
      - uses: mlugg/setup-zig@53fc45b17fe98b52f92ee5ea08ff48a85a3e7eb7 # v1.2.2
        if: matrix.lang == 'zig'
        with:
          version: "0.14.1"
      - uses: ocaml/setup-ocaml@e89b2ded52a6e13f50162220cf5fe47290162032 # v3.8.0
        if: matrix.lang == 'ocaml'
        with:
          ocaml-compiler: "5.2"
      - name: OCaml FFI packages
        if: matrix.lang == 'ocaml'
        run: opam install -y dune.3.24.2 ctypes.0.24.0 ctypes-foreign.0.24.0
      - uses: haskell-actions/setup@6037f33647c3f17758a2356c80fc4a53d7e0685d # v2.12.0
        if: matrix.lang == 'haskell'
        with:
          ghc-version: "9.6"
          cabal-version: "3.10"

      # The node tab documents a Bun and a Deno route besides the npm one,
      # and neither runtime is preinstalled on the runners.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: matrix.lang == 'node'
        with:
          bun-version: "1.4.2"
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        if: matrix.lang == 'node'
        with:
          deno-version: "v2.7.14"

      # Several tabs document a Scoop route (Chocolatey is preinstalled on
      # the runner; Scoop is not). Installed the way its site says to.
      - name: Scoop (Windows; the documented Scoop routes need it)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-RestMethod get.scoop.sh -OutFile "$env:RUNNER_TEMP\install-scoop.ps1"
          & "$env:RUNNER_TEMP\install-scoop.ps1" -RunAsAdmin
          "$env:USERPROFILE\scoop\shims" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Fetch the published api.json
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/api.json \
            "${{ needs.resolve.outputs.base_url }}/ui/release/${{ needs.resolve.outputs.version }}/api.json"

      # Every route the tab documents for this OS runs, one after the other,
      # each in its own directory (run_install_steps.py --platform). Routes
      # that assume another distribution (`container` in api.json) run in
      # the distros job below instead.
      - name: "Run the documented ${{ matrix.lang }} steps"
        shell: bash
        run: |
          set -euo pipefail
          case "${{ runner.os }}" in Linux) P=linux;; macOS) P=macos;; Windows) P=windows;; esac
          # opam's environment (ocaml) and cabal's PATH are per-shell.
          [ "${{ matrix.lang }}" = ocaml ] && eval "$(opam env)" || true
          python3 scripts/run_install_steps.py --api /tmp/api.json \
            --lang "${{ matrix.lang }}" --platform "$P" \
            --base "${{ needs.resolve.outputs.base_url }}" \
            --version "${{ needs.resolve.outputs.version }}"

  # The Linux package-manager routes that are not apt (dnf / pacman / apk)
  # assume a distribution the ubuntu runner is not, so api.json marks them
  # with the image they expect (`container`) and they run inside it here,
  # one route per job. Only the C / C++ tabs document such routes.
  distros:
    name: "steps: ${{ matrix.lang }} (${{ matrix.variant }})"
    needs: resolve
    if: needs.resolve.outputs.deployed == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lang: c,   variant: linux-dnf,    image: "fedora:40",        setup: "dnf install -y gcc gcc-c++ curl python3" }
          - { lang: cpp, variant: linux-dnf,    image: "fedora:40",        setup: "dnf install -y gcc gcc-c++ curl python3" }
          - { lang: c,   variant: linux-pacman, image: "archlinux:latest", setup: "pacman -Sy --noconfirm gcc curl python" }
          - { lang: cpp, variant: linux-pacman, image: "archlinux:latest", setup: "pacman -Sy --noconfirm gcc curl python" }
          - { lang: c,   variant: linux-apk,    image: "alpine:3.20",      setup: "apk add --no-cache bash gcc g++ musl-dev curl python3" }
          - { lang: cpp, variant: linux-apk,    image: "alpine:3.20",      setup: "apk add --no-cache bash gcc g++ musl-dev curl python3" }
    steps:
      - name: Toolchain (${{ matrix.image }})
        run: ${{ matrix.setup }}
      - uses: actions/checkout@v7
      - name: Fetch the published api.json
        run: |
          curl -fsSL --retry 3 -o /tmp/api.json \
            "${{ needs.resolve.outputs.base_url }}/ui/release/${{ needs.resolve.outputs.version }}/api.json"
      - name: "Run the documented ${{ matrix.variant }} steps"
        run: |
          python3 scripts/run_install_steps.py --api /tmp/api.json \
            --lang "${{ matrix.lang }}" --platform linux --variant "${{ matrix.variant }}" \
            --base "${{ needs.resolve.outputs.base_url }}" \
            --version "${{ needs.resolve.outputs.version }}"

  # A successful `pip install` does not guarantee successful import (e.g., SIGILL/SIGSEGV).
  python_import:
    name: "python: install, import, construct, teardown"
    needs: resolve
    if: needs.resolve.outputs.deployed == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    container:
      image: "python:3.12-bookworm@sha256:581429e3df12d76e6af4be5ab7d0e7fc2013eb57dc23d2de691411c8efdbb970"
    steps:
      - name: Install from the live index and exercise the object lifecycle
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ needs.resolve.outputs.base_url }}"

          python3 -m pip install --target /tmp/azul-site --no-cache-dir \
            azul --index-url "$BASE/ui"

          cat > /tmp/smoke.py <<'PYEOF'
          import azul
          n = len([x for x in dir(azul) if x[:1].isupper()])
          assert n > 100, f"only {n} classes exported - loaded but empty"
          c = azul.ColorU(255, 0, 0, 255)
          del c
          print(f"import OK: {n} classes, construct+teardown clean")
          PYEOF
          sed -i 's/^          //' /tmp/smoke.py

          # Enforce ulimit to prevent unguarded imports from locking the runner via OOM.
          ( ulimit -v 4000000
            PYTHONPATH=/tmp/azul-site python3 /tmp/smoke.py )

  artifacts:
    name: Release page lists the expected artifacts
    needs: resolve
    if: needs.resolve.outputs.deployed == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The expected artifacts are named on the page
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ needs.resolve.outputs.base_url }}"
          VERSION="${{ needs.resolve.outputs.version }}"
          RELEASES="${{ needs.resolve.outputs.releases_url }}"
          page=$(mktemp)
          curl -sSL --fail "$RELEASES" -o "$page"
          echo "checking $RELEASES ($(wc -c < "$page") bytes) for azul $VERSION"

          # The index is `/ui/releases`, but downloads are on `/ui/release/<version>/`.
          # We extract the version link if available, or fall back to constructing it.
          sub=$(grep -oE 'href="[^"]*releases?/'"$VERSION"'[^"]*"' "$page" \
                | head -1 | sed 's/^href="//;s/"$//' || true)
          [ -n "$sub" ] || sub="$BASE/ui/release/$VERSION/"
          if [ -n "$sub" ]; then
            case "$sub" in
              http*) : ;;
              /*)    sub="${BASE}${sub}" ;;
              *)     sub="${BASE}/${sub}" ;;
            esac
            echo "::notice::following per-version page $sub"
            curl -sSL "$sub" >> "$page" || true
          else
            echo "::notice::no per-version link for $VERSION; searching the index itself"
          fi

          # Verify exact shared libraries / packages ship as expected.
          missing=0
          for artifact in \
            "libazul.so" \
            "azul.dll" \
            "libazul.dylib" \
            "azul_${VERSION}_amd64.deb" \
            "azul-${VERSION}-1.x86_64.rpm"; do
            if grep -qi "$artifact" "$page"; then
              echo "  listed: $artifact"
            else
              echo "::error::$artifact is not listed on $RELEASES"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            if grep -q "$VERSION" "$page"; then
              echo "::error::The page names $VERSION but is missing expected artifacts."
            else
              echo "::error::The page does not mention $VERSION at all."
            fi
          fi

          # Warn if iOS builds are missing but not labeled as 'unavailable'.
          if grep -qi 'ios' "$page"; then
            grep -qiE 'ios[^<]*(unavailable|not available)' "$page" \
              || echo "::notice::iOS artifacts are listed as present — verify they are actually signed"
          fi
          exit "$missing"

      - name: Every advertised download actually resolves
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ needs.resolve.outputs.base_url }}"
          VERSION="${{ needs.resolve.outputs.version }}"
          bash scripts/verify_release_page_links.sh \
            "$BASE/ui/release/$VERSION/" "$BASE" "$VERSION"

  apk_install:
    name: "android: install the published APK and launch it"
    needs: resolve
    if: needs.resolve.outputs.deployed == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Download the published APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve.outputs.version }}"

          # APKs are offloaded to GitHub Releases because they breach GitHub Pages'
          # 1 GB artifact limit. Attempt x86_64 first (emulator native), fallback to arm64.
          if gh release download "$VERSION" --repo "$GH_REPO" \
               --pattern 'azul-self-test-android-x86_64.apk' --dir /tmp --clobber 2>/dev/null; then
            mv /tmp/azul-self-test-android-x86_64.apk /tmp/azul.apk
            echo "abi=x86_64" > /tmp/apk-abi.env
          elif gh release download "$VERSION" --repo "$GH_REPO" \
               --pattern 'azul-self-test-android.apk' --dir /tmp --clobber 2>/tmp/dl.log; then
            mv /tmp/azul-self-test-android.apk /tmp/azul.apk
            echo "abi=arm64-v8a" > /tmp/apk-abi.env
          else
            cat /tmp/dl.log >&2 || true
            echo "::error::no azul-self-test-android*.apk on the $VERSION GitHub Release"
            exit 1
          fi
          ls -l /tmp/azul.apk; cat /tmp/apk-abi.env

      - name: Static checks the phone performs before it will run anything
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_SDK_ROOT/build-tools/34.0.0"
          "$BT/apksigner" verify --verbose /tmp/azul.apk \
            || { echo "::error::published APK is not validly signed"; exit 1; }
          unzip -l /tmp/azul.apk | grep -q 'classes\.dex' \
            || { echo "::error::published APK has no classes.dex"; exit 1; }
          "$BT/aapt2" dump badging /tmp/azul.apk | tee /tmp/badging.txt | grep -q launchable-activity \
            || { echo "::error::published APK declares no launchable activity"; exit 1; }

      - name: Enable KVM group perms
        # Required for the Android emulator runner to use hardware acceleration.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install on an emulator and start the launcher activity
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 30
          arch: x86_64
          disable-animations: true
          # The action runs `script` line-by-line in separate shells. We pass a
          # single script file to preserve state and variables between steps.
          script: bash "$GITHUB_WORKSPACE/scripts/verify_apk_launch.sh"
