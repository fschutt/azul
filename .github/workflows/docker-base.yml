name: Docker base image (ghcr.io/fschutt/azul)

# Builds and pushes the Azul web base image (libazul with the in-process
# remill/LLVM/LLD lifter) to the GitHub Container Registry. Downstream apps
# can use `FROM ghcr.io/fschutt/azul` in their Dockerfiles.
#
# This is a separate workflow because the Dockerfile builds remill + LLVM
# from source, which requires ~45 minutes and ~10 GB of disk space.
# It relies on Docker Buildx and GitHub Actions layer caching to keep repeat
# builds fast.
#
# Triggers:
#   - workflow_dispatch: Manual run. Builds always; pushes only if `push: true`.
#   - release (published): Builds and pushes using the release tag + `latest`.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "git ref (branch or tag) to build libazul from"
        required: false
        default: "master"
      tag:
        description: "image tag to publish (e.g. 0.2.0)"
        required: false
        default: "0.2.0"
      push:
        description: "push to ghcr.io (otherwise build-only validation)"
        required: false
        default: false
        type: boolean
  release:
    types: [published]

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-base-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build + push ghcr.io/fschutt/azul
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      # The remill+LLVM build requires significantly more than the stock ~14 GB
      # of free disk space provided by GitHub-hosted runners.
      - name: Free disk space
        run: |
          echo "Before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          sudo docker image prune --all --force 2>/dev/null || true
          echo "After:"; df -h / | tail -1

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Resolve the build ref, tag, and push intention depending on the trigger event.
      - name: Resolve build parameters
        id: params
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            ref="${{ github.event.release.tag_name }}"
            tag="${{ github.event.release.tag_name }}"
            push=true
          else
            ref="${{ github.event.inputs.ref }}"
            tag="${{ github.event.inputs.tag }}"
            push="${{ github.event.inputs.push }}"
          fi
          echo "ref=$ref"   >> "$GITHUB_OUTPUT"
          echo "tag=$tag"   >> "$GITHUB_OUTPUT"
          echo "push=$push" >> "$GITHUB_OUTPUT"
          echo "::notice::docker base: ref=$ref tag=$tag push=$push"

      # Only authenticate if we intend to push (build-only validation requires no credentials).
      - name: Log in to GHCR
        if: steps.params.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # The Dockerfile runs `git clone --branch $AZUL_REF`.
          # Therefore, `AZUL_REF` must be a valid branch or tag name, not a commit SHA.
          build-args: |
            AZUL_REF=${{ steps.params.outputs.ref }}
          push: ${{ steps.params.outputs.push == 'true' }}
          tags: |
            ghcr.io/fschutt/azul:${{ steps.params.outputs.tag }}
            ghcr.io/fschutt/azul:latest
          # Utilize GitHub Actions layer caching to reuse the expensive remill+LLVM
          # build stages across runs unless third-party sources or LLVM pins change.
          cache-from: type=gha
          cache-to: type=gha,mode=max
