# .github/workflows/rust.yml
#
# Two modes:
# - ci: Runs on push/PR, builds everything, runs tests, creates artifacts
# - deploy: Manual trigger, downloads CI artifacts, deploys to GitHub Pages

name: build

on:
  push:
    branches:
      - '**'
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
  pull_request:

  workflow_dispatch:
    inputs:
      run_mode:
        description: 'Select the workflow to run'
        type: choice
        options:
          - ci
          - website
          - deploy
        required: true
        default: 'ci'
      cache_bust:
        description: 'Force-clear all caches'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# Only allow one run per branch. A newer push cancels an older run.
concurrency:
  group: >-
    ${{ github.workflow }}-${{
      (github.event.pull_request.head.repo.full_name == github.repository
        && github.event.pull_request.head.ref) || github.ref_name }}
  cancel-in-progress: true

env:
  # Force ANSI color off for every step so tool output renders correctly in markdown summaries.
  CARGO_TERM_COLOR: never
  NO_COLOR: "1"
  # Forces JS actions to Node 24 to silence deprecation warnings.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  AZUL_VERSION: "0.2.0"
  # Prefix for cache keys. When cache_bust is true, run_id forces a clean rebuild.
  CACHE_BUST: ${{ github.event.inputs.cache_bust == 'true' && github.run_id || '' }}

jobs:
  # CI Jobs run on push, PR, or manual 'ci' mode.
  # Pipeline stages:
  # 1. Preflight: Fast checks (lints, docs, clippy) that depend on nothing.
  # 2. Fast Lane: Cheap compiles and unit tests.
  # 3. Bindings: OS-specific bindings generation.
  # 4. Normal Tier: Expensive jobs.
  # 5. E2E Lane: Depends on DLL builds.

  # Checks if dependencies are allowed to run before compiling anything. Gates everything else.
  supply_chain_preflight:
    name: Supply chain preflight (build-time code + env)
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.run_mode == 'ci' || github.event.inputs.run_mode == 'deploy' || github.event.inputs.run_mode == 'website'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
      - uses: ./.github/actions/supply-chain-preflight

  content_state_lint:
    # Checks architecture and release contracts. Backends must not touch content state directly,
    # must not hand-write event-diff baselines, and must not block the UI thread.
    needs: [supply_chain_preflight]
    name: Architecture + release contracts (preflight)
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.run_mode == 'ci' || github.event.inputs.run_mode == 'deploy' || github.event.inputs.run_mode == 'website'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Release contracts (naming, widget wiring, sparse checkout, api.json)
        run: python3 scripts/preflight_contracts.py

      - name: Backends must not touch content state
        run: |
          set -e
          violations=$(grep -rnE 'set_node_type|image_cache|dirty_text_nodes|cpu_image_callback_results' \
            dll/src/desktop/shell2 \
            --include='*.rs' \
            | grep -v '/common/' \
            | grep -vE '^[^:]*:[0-9]+:\s*//' \
            || true)
          if [ -n "$violations" ]; then
            echo "Platform backends may not touch content state (route through LayoutWindow::apply_content_change):"
            echo "$violations"
            exit 1
          fi
          echo "shell2 backends are content-state clean"

      - name: Backends must not hand-write the event-diff baseline
        run: |
          set -e
          violations=$(grep -rnE 'previous_window_state\s*=[^=]' \
            dll/src/desktop/shell2 \
            --include='*.rs' \
            | grep -v '/common/' \
            | grep -vE '^[^:]*:[0-9]+:\s*//' \
            || true)
          if [ -n "$violations" ]; then
            echo "Do not assign previous_window_state directly. Use, from PlatformWindow:"
            echo "  self.snapshot_window_state_baseline(\"<backend>.<handler>\")"
            echo "  self.discard_input_delta(\"<backend>.<handler>.<why>\")"
            echo "  self.seed_window_state_baseline(\"<backend>.<site>\")"
            echo "  self.set_previous_window_state(<baseline>)"
            echo "$violations"
            exit 1
          fi
          echo "shell2 backends route every event-diff baseline write through PlatformWindow"

      - name: Backends must not block the UI thread on I/O
        run: |
          set -e
          violations=$(grep -rnE '\.recv\(\)'             dll/src/desktop/shell2             --include='*.rs'             | grep -v '/common/'             | grep -vE '^[^:]*:[0-9]+:\s*//'             | grep -vE 'while let Ok\([^)]*\) = [A-Za-z_][A-Za-z0-9_.]*\.recv\(\)'             || true)
          if [ -n "$violations" ]; then
            echo "Unbounded .recv() in a backend. The UI thread must not block:"
            echo "  worker side : while let Ok(job) = rx.recv()"
            echo "  UI side     : rx.recv_timeout(<deadline>)"
            echo "$violations"
            exit 1
          fi
          echo "shell2 backends keep blocking waits off the UI thread"

  documentation_paths:
    # Checks documented paths using docproof.
    needs: [supply_chain_preflight]
    name: Documentation paths (docproof)
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.run_mode == 'ci' || github.event.inputs.run_mode == 'deploy' || github.event.inputs.run_mode == 'website'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch docproof at a pinned commit
        uses: actions/checkout@v7
        with:
          repository: melbinjp/docproof
          ref: 8b135f6ca2ce18cd2ea5298fc48111e4b7e21e9e
          path: .docproof
          persist-credentials: false

      - name: Verify the pin
        run: |
          set -e
          want=8b135f6ca2ce18cd2ea5298fc48111e4b7e21e9e
          got=$(git -C .docproof rev-parse HEAD)
          if [ "$got" != "$want" ]; then
            echo "::error::docproof checkout is $got, expected the pinned $want"
            exit 1
          fi
          echo "docproof pinned at $got"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check documented paths against the repository
        run: |
          set -e
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            echo "::error::This checkout is shallow, so docproof cannot tell a deleted path from one that never existed and would pass having judged nothing. Restore fetch-depth: 0."
            exit 1
          fi
          status=0
          PYTHONPATH="$PWD/.docproof/src" python -m docproof.cli . > docproof.log 2>&1 || status=$?
          cat docproof.log
          {
            echo '### Documented paths'
            echo
            echo '```'
            cat docproof.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if ! grep -qE '^(ok|BROKEN) paths: ' docproof.log; then
            echo "::error::docproof did not run its path verifier at all - the gate checked nothing."
            exit 1
          fi
          exit $status

      - name: The checker must not have modified the tree
        if: always()
        run: |
          set -e
          if ! git diff --quiet; then
            echo "::error::docproof modified tracked files; it is documented as read-only."
            git diff --stat
            exit 1
          fi
          echo "working tree untouched"

  codegen_linux:
    # Builds azul-doc once per runner OS and uploads the binary and generated bindings.
    name: Generate bindings (Linux)
    needs: [content_state_lint, documentation_paths]
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.run_mode == 'ci' || github.event.inputs.run_mode == 'deploy' || github.event.inputs.run_mode == 'website'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0

      - name: Cache the azul-doc binary
        id: doc-bin-cache
        uses: actions/cache@v6
        with:
          path: |
            target/release/azul-doc
            target/release/azul-doc.exe
          key: azul-doc-bin-v2-${{ env.CACHE_BUST }}-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('doc/src/**/*.rs', 'doc/Cargo.toml', 'layout/src/**/*.rs', 'layout/Cargo.toml', 'core/src/**/*.rs', 'core/Cargo.toml', 'css/src/**/*.rs', 'css/Cargo.toml') }}

      - name: Build azul-doc (release)
        if: steps.doc-bin-cache.outputs.cache-hit != 'true'
        run: cargo build -r -p azul-doc

      - name: Cache codegen output
        id: codegen-cache
        uses: actions/cache@v6
        with:
          path: target/codegen
          key: codegen-v2-${{ env.CACHE_BUST }}-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('doc/src/**/*.rs', 'doc/Cargo.toml', 'api.json') }}

      - name: Generate DLL API bindings
        if: steps.codegen-cache.outputs.cache-hit != 'true'
        run: cargo run -r -p azul-doc codegen all

      - name: Codegen must be deterministic (same inputs -> same bytes)
        if: steps.codegen-cache.outputs.cache-hit != 'true'
        run: |
          rm -rf /tmp/codegen-run1
          cp -r target/codegen /tmp/codegen-run1
          cargo run -r -p azul-doc codegen all
          if ! diff -r /tmp/codegen-run1 target/codegen; then
            echo "::error::'azul-doc codegen all' is not deterministic - the same inputs produced different output."
            exit 1
          fi

      - name: Ensure the azul-doc binary exists
        shell: bash
        run: |
          set -e
          if [ ! -x target/release/azul-doc ] && [ ! -x target/release/azul-doc.exe ]; then
            echo "azul-doc binary missing after cache + build; building it now"
            cargo build -r -p azul-doc
          fi
          ls -la target/release/azul-doc* || true

      - name: Upload the azul-doc binary
        uses: actions/upload-artifact@v7
        with:
          name: azul-doc-bin-${{ runner.os }}
          path: |
            target/release/azul-doc
            target/release/azul-doc.exe
          retention-days: 1
          if-no-files-found: error

      - name: Upload the generated bindings
        uses: actions/upload-artifact@v7
        with:
          name: codegen-tree-${{ runner.os }}
          path: target/codegen
          retention-days: 1
          if-no-files-found: error

  codegen_macos:
    name: Generate bindings (macOS)
    needs: [content_state_lint, documentation_paths]
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.run_mode == 'ci' || github.event.inputs.run_mode == 'deploy' || github.event.inputs.run_mode == 'website'
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0

      - name: Cache the azul-doc binary
        id: doc-bin-cache
        uses: actions/cache@v6
        with:
          path: |
            target/release/azul-doc
            target/release/azul-doc.exe
          key: azul-doc-bin-v2-${{ env.CACHE_BUST }}-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('doc/src/**/*.rs', 'doc/Cargo.toml', 'layout/src/**/*.rs', 'layout/Cargo.toml', 'core/src/**/*.rs', 'core/Cargo.toml', 'css/src/**/*.rs', 'css/Cargo.toml') }}

      - name: Build azul-doc (release)
        if: steps.doc-bin-cache.outputs.cache-hit != 'true'
        run: cargo build -r -p azul-doc

      - name: Cache codegen output
        id: codegen-cache
        uses: actions/cache@v6
        with:
          path: target/codegen
          key: codegen-v2-${{ env.CACHE_BUST }}-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('doc/src/**/*.rs', 'doc/Cargo.toml', 'api.json') }}

      - name: Generate DLL API bindings
        if: steps.codegen-cache.outputs.cache-hit != 'true'
        run: cargo run -r -p azul-doc codegen all

      - name: Ensure the azul-doc binary exists
        shell: bash
        run: |
          set -e
          if [ ! -x target/release/azul-doc ] && [ ! -x target/release/azul-doc.exe ]; then
            cargo build -r -p azul-doc
          fi

      - name: Upload the azul-doc binary
        uses: actions/upload-artifact@v7
        with:
          name: azul-doc-bin-${{ runner.os }}
          path: |
            target/release/azul-doc
            target/release/azul-doc.exe
          retention-days: 1
          if-no-files-found: error

      - name: Upload the generated bindings
        uses: actions/upload-artifact@v7
        with:
          name: codegen-tree-${{ runner.os }}
          path: target/codegen
          retention-days: 1
          if-no-files-found: error

  codegen_windows:
    name: Generate bindings (Windows)
    needs: [content_state_lint, documentation_paths]
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.run_mode == 'ci' || github.event.inputs.run_mode == 'deploy' || github.event.inputs.run_mode == 'website'
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0

      - name: Cache the azul-doc binary
        id: doc-bin-cache
        uses: actions/cache@v6
        with:
          path: |
            target/release/azul-doc
            target/release/azul-doc.exe
          key: azul-doc-bin-v2-${{ env.CACHE_BUST }}-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('doc/src/**/*.rs', 'doc/Cargo.toml', 'layout/src/**/*.rs', 'layout/Cargo.toml', 'core/src/**/*.rs', 'core/Cargo.toml', 'css/src/**/*.rs', 'css/Cargo.toml') }}

      - name: Build azul-doc (release)
        if: steps.doc-bin-cache.outputs.cache-hit != 'true'
        run: cargo build -r -p azul-doc

      - name: Cache codegen output
        id: codegen-cache
        uses: actions/cache@v6
        with:
          path: target/codegen
          key: codegen-v2-${{ env.CACHE_BUST }}-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('doc/src/**/*.rs', 'doc/Cargo.toml', 'api.json') }}

      - name: Generate DLL API bindings
        if: steps.codegen-cache.outputs.cache-hit != 'true'
        run: cargo run -r -p azul-doc codegen all

      - name: Ensure the azul-doc binary exists
        shell: bash
        run: |
          set -e
          if [ ! -x target/release/azul-doc ] && [ ! -x target/release/azul-doc.exe ]; then
            cargo build -r -p azul-doc
          fi

      - name: Upload the azul-doc binary
        uses: actions/upload-artifact@v7
        with:
          name: azul-doc-bin-${{ runner.os }}
          path: |
            target/release/azul-doc
            target/release/azul-doc.exe
          retention-days: 1
          if-no-files-found: error

      - name: Upload the generated bindings
        uses: actions/upload-artifact@v7
        with:
          name: codegen-tree-${{ runner.os }}
          path: target/codegen
          retention-days: 1
          if-no-files-found: error

  check_crates:
    # Fast preflight checks for engine crates. Does not require generated bindings.
    needs: [supply_chain_preflight]
    name: Check crates (engine)
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.run_mode == 'ci' || github.event.inputs.run_mode == 'deploy' || github.event.inputs.run_mode == 'website'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0

      - name: Check crates
        run: |
          cargo check -p azul-css
          cargo check -p azul-core
          cargo check -p azul-layout

      - name: No workspace member may join untested
        run: ./scripts/workspace_test_coverage.sh

      - name: Check no std Instant::now() in WASM-compatible crates
        run: STRICT_WASM_CFG=1 bash scripts/check_wasm_instant.sh

  autofix_check:
    # Validates api.json drift using autofix.
    name: Autofix + normalize (api.json drift)
    needs: [content_state_lint, documentation_paths, clippy, check_crates, codegen_linux]
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.run_mode == 'ci' || github.event.inputs.run_mode == 'deploy' || github.event.inputs.run_mode == 'website'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0

      - name: Install dependencies (Ubuntu)
        run: sudo apt-get update && sudo apt-get install -y libv4l-dev

      - name: Download the azul-doc binary
        uses: actions/download-artifact@v8
        with:
          name: azul-doc-bin-${{ runner.os }}
          path: .azul-doc-bin

      - name: Make azul-doc executable
        run: |
          chmod +x .azul-doc-bin/azul-doc
          echo "$PWD/.azul-doc-bin" >> "$GITHUB_PATH"

      - name: Run autofix and normalize
        run: |
          azul-doc autofix
          azul-doc autofix explain
          azul-doc patch safe target/autofix/patches
          azul-doc patch target/autofix/patches
          azul-doc normalize

      - name: Check for uncommitted changes after autofix
        run: |
          if ! git diff --quiet; then
            echo "There are uncommitted content changes after running autofix:"
            git diff --stat
            git diff
            exit 1
          elif [[ -n $(git status --porcelain) ]]; then
            echo "Files touched but no content changes - resetting:"
            git checkout -- .
            echo "Reset complete, continuing..."
          else
            echo "No uncommitted changes after autofix."
          fi

  azul_doc_tests:
    # Runs azul-doc tests and checks double-drop and guide link invariants.
    name: azul-doc tests + invariants
    needs: [content_state_lint, documentation_paths, clippy, check_crates, codegen_linux]
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.run_mode == 'ci' || github.event.inputs.run_mode == 'deploy' || github.event.inputs.run_mode == 'website'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0

      - name: Run azul-doc tests
        run: |
          set -o pipefail
          cargo test -p azul-doc --bins --no-fail-fast 2>&1 | tee azul-doc-tests.txt
          ./scripts/zero_test_guard.sh --strict azul-doc-tests.txt

      - name: Download the azul-doc binary
        uses: actions/download-artifact@v8
        with:
          name: azul-doc-bin-${{ runner.os }}
          path: .azul-doc-bin

      - name: Make azul-doc executable
        run: |
          chmod +x .azul-doc-bin/azul-doc
          echo "$PWD/.azul-doc-bin" >> "$GITHUB_PATH"

      - name: Double-drop invariant + guide links (azul-doc)
        run: azul-doc check

  dll_tests:
    # Runs azul-dll unit tests and feature checks. Also tests AzPaint, AzMaps, and AzWriter.
    name: DLL tests + feature check
    needs: [content_state_lint, documentation_paths, clippy, check_crates, codegen_linux]
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.run_mode == 'ci' || github.event.inputs.run_mode == 'deploy' || github.event.inputs.run_mode == 'website'
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0

      - name: Install dependencies (Ubuntu)
        run: sudo apt-get update && sudo apt-get install -y libv4l-dev

      - name: Download generated bindings (built once by codegen_linux)
        uses: actions/download-artifact@v8
        with:
          name: codegen-tree-${{ runner.os }}
          path: target/codegen

      - name: Run DLL tests
        run: |
          set -o pipefail
          cd dll && cargo test 2>&1 | tee ../dll-default-tests.txt
          cd .. && ./scripts/zero_test_guard.sh dll-default-tests.txt

      - name: Build the C-ABI libazul.so for the link-dynamic example lib-tests
        run: |
          set -o pipefail
          cargo build -p azul-dll 2>&1 | tee azul-dll-cabi-build.txt
          mkdir -p "$RUNNER_TEMP/azul-cabi"
          cp target/debug/libazul.so "$RUNNER_TEMP/azul-cabi/"
          nm -D "$RUNNER_TEMP/azul-cabi/libazul.so" | grep -q ' T AzU8Vec_delete' \
            || { echo "FATAL: the built libazul.so does not export the C ABI"; exit 1; }

      - name: Run AzPaint tests
        env:
          AZ_LINK_PATH: ${{ runner.temp }}/azul-cabi
        run: |
          set -o pipefail
          cargo test -p AzPaint --lib --no-fail-fast 2>&1 | tee azul-paint-tests.txt
          ./scripts/zero_test_guard.sh --strict azul-paint-tests.txt

      - name: Run AzMaps tests
        env:
          AZ_LINK_PATH: ${{ runner.temp }}/azul-cabi
        run: |
          set -o pipefail
          cargo test -p AzMaps --lib --no-fail-fast 2>&1 | tee azul-maps-tests.txt
          ./scripts/zero_test_guard.sh --strict azul-maps-tests.txt

      - name: Run AzWriter tests
        env:
          AZ_LINK_PATH: ${{ runner.temp }}/azul-cabi
        run: |
          set -o pipefail
          cargo test -p AzWriter --lib --no-fail-fast 2>&1 | tee azul-writer-tests.txt
          ./scripts/zero_test_guard.sh --strict azul-writer-tests.txt

      - name: Check azul-dll (release feature set)
        run: cargo check -p azul-dll --no-default-features --features "link-static,logging,ico,tga,hdr,webp,pnm,gif,png,tiff,bmp,a11y"

  double_drop:
    # Runtime gate for double-free bugs.
    name: Double-drop runtime gates
    needs: [content_state_lint, documentation_paths, clippy, check_crates, codegen_linux]
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.run_mode == 'ci' || github.event.inputs.run_mode == 'deploy' || github.event.inputs.run_mode == 'website'
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0

      - name: Install dependencies (Ubuntu)
        run: sudo apt-get update && sudo apt-get install -y libv4l-dev

      - name: Download generated bindings (built once by codegen_linux)
        uses: actions/download-artifact@v8
        with:
          name: codegen-tree-${{ runner.os }}
          path: target/codegen

      - name: Double-drop runtime gate (appconfig_double_drop)
        run: cargo run -r -p azul-dll --example appconfig_double_drop --features link-static

      - name: Double-drop runtime gate (css_double_drop, issue #15)
        run: cargo run -r -p azul-dll --example css_double_drop --features link-static

  feature_matrix_check:
    # Checks that the crate compiles with various feature combinations.
    name: Feature Matrix Check
    needs: [content_state_lint, documentation_paths, clippy, check_crates, codegen_linux]
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.run_mode == 'ci' || github.event.inputs.run_mode == 'deploy' || github.event.inputs.run_mode == 'website'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0

      - name: Download generated bindings (built once per OS)
        uses: actions/download-artifact@v8
        with:
          name: codegen-tree-${{ runner.os }}
          path: target/codegen

      - name: Check azul-dll with a11y enabled (default)
        run: cargo check -p azul-dll --no-default-features --features "link-static,logging,a11y"

      - name: Check azul-dll WITHOUT a11y (stub implementations)
        run: cargo check -p azul-dll --no-default-features --features "link-static,logging"

      - name: Check azul-dll with minimal features
        run: cargo check -p azul-dll --no-default-features --features "link-static"

      - name: Check azul-dll with all image formats
        run: cargo check -p azul-dll --no-default-features --features "link-static,all_img_formats"

      - name: Check azul-dll with svg and xml
        run: cargo check -p azul-dll --no-default-features --features "link-static,svg,xml"

      - name: Check azul-dll with link-dynamic (no internal crates)
        run: cargo check -p azul-dll --no-default-features --features "link-dynamic"

      - name: Check azul-layout with various features
        run: |
          cargo check -p azul-layout --no-default-features
          cargo check -p azul-layout --no-default-features --features "text_layout"
          cargo check -p azul-layout --no-default-features --features "font_loading"
          cargo check -p azul-layout --no-default-features --features "svg"
          cargo check -p azul-layout --no-default-features --features "xml"
          cargo check -p azul-layout --no-default-features --features "text_layout,font_loading,svg,xml"

      # printpdf's exact azul-layout surface (its `html` feature): text layout,
      # hyphenation, font loading, xml, pdf - and NO cpurender/svg. No other
      # combination in this matrix enables `pdf` or `text_layout_hyphenation`,
      # which is how the missing cpurender gates on `tray_icon` and
      # `rasterize_svg_clip_to_r8` only surfaced in printpdf's own build.
      # Keep in sync with printpdf/Cargo.toml (`text_layout`,
      # `text_layout_hyphenation`, `html` feature lists).
      - name: Check azul-layout with printpdf's feature set (no cpurender)
        run: cargo check -p azul-layout --no-default-features --features "std,text_layout,text_layout_hyphenation,font_loading,xml,pdf"

  dll_windows_unit_tests:
    # Runs Windows backend unit tests.
    name: azul-dll unit tests (Windows backend)
    needs: [content_state_lint, documentation_paths, clippy, check_crates, feature_matrix_check, test_lib, codegen_windows]
    timeout-minutes: 60
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.run_mode == 'ci' || github.event.inputs.run_mode == 'deploy' || github.event.inputs.run_mode == 'website'
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0

      - name: Download generated bindings (built once per OS)
        uses: actions/download-artifact@v8
        with:
          name: codegen-tree-${{ runner.os }}
          path: target/codegen

      - name: azul-dll unit tests
        shell: bash
        run: |
          set -o pipefail
          cargo test -p azul-dll --lib --features build-dll 2>&1 | tee dll-lib.txt
          ./scripts/zero_test_guard.sh --strict dll-lib.txt
          if ! grep -qE '^test desktop::shell2::windows::' dll-lib.txt; then
            echo "::error::no desktop::shell2::windows::* test ran - the Win32 backend is still untested."
            exit 1
          fi

  cross_compile_check:
    # Cross-compile cargo check for 32-bit and exotic targets.
    name: Cross-Compile Check (${{ matrix.target }})
    needs: [content_state_lint, documentation_paths, clippy, check_crates, feature_matrix_check, test_lib, codegen_linux, codegen_macos, codegen_windows]
    if: >-
      (github.event_name != 'workflow_dispatch' || github.event.inputs.run_mode == 'ci' || github.event.inputs.run_mode == 'deploy' || github.event.inputs.run_mode == 'website')
      && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
          || github.event_name == 'workflow_dispatch')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: i686-unknown-linux-gnu
            runner: ubuntu-22.04
            check_build_dll: true
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04
            check_build_dll: true
          - target: armv7-unknown-linux-gnueabihf
            runner: ubuntu-22.04
            check_build_dll: true
          - target: riscv64gc-unknown-linux-gnu
            runner: ubuntu-22.04
            check_build_dll: true
          - target: powerpc64-unknown-linux-gnu
            runner: ubuntu-22.04
            check_build_dll: true
          - target: s390x-unknown-linux-gnu
            runner: ubuntu-22.04
            check_build_dll: true
          - target: i686-pc-windows-msvc
            runner: windows-2022
            check_build_dll: true
          - target: x86_64-apple-darwin
            runner: macos-14
            check_build_dll: true
            macos_deployment_target: "10.13"
          - target: x86_64-apple-darwin
            runner: macos-14
            check_build_dll: true
            macos_deployment_target: "10.15"
          - target: aarch64-apple-darwin
            runner: macos-14
            check_build_dll: true
            macos_deployment_target: "11.0"
          - target: wasm32-unknown-unknown
            runner: ubuntu-22.04
            check_build_dll: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          targets: ${{ matrix.target }}

      - name: Download generated bindings (built once per OS)
        uses: actions/download-artifact@v8
        with:
          name: codegen-tree-${{ runner.os }}
          path: target/codegen

      - name: Check sub-crates (azul-css, azul-core, azul-layout)
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target || '' }}
        run: |
          cargo check --target ${{ matrix.target }} -p azul-css
          cargo check --target ${{ matrix.target }} -p azul-core
          cargo check --target ${{ matrix.target }} -p azul-layout --no-default-features --features "text_layout,svg,xml"

      - name: Check azul-dll link-static
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target || '' }}
        run: cargo check --target ${{ matrix.target }} -p azul-dll --no-default-features --features "link-static,logging"

      - name: Check azul-dll build-dll
        if: matrix.check_build_dll
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target || '' }}
        run: cargo check --target ${{ matrix.target }} -p azul-dll --features "build-dll"

  cross_build_binaries:
    # Cross-builds binaries for additional architectures.
    name: Cross-Build (${{ matrix.target }})
    needs: [content_state_lint, documentation_paths, clippy, check_crates, feature_matrix_check, test_lib, codegen_linux, codegen_macos, codegen_windows]
    timeout-minutes: 90
    if: >-
      (github.event_name != 'workflow_dispatch' || github.event.inputs.run_mode == 'ci' || github.event.inputs.run_mode == 'deploy' || github.event.inputs.run_mode == 'website')
      && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
          || github.event_name == 'workflow_dispatch')
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: i686-unknown-linux-gnu
            runner: ubuntu-22.04
            artifact_name: azul-linux-i686
            use_cross: true
            artifact_ext: so
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04
            artifact_name: azul-linux-aarch64
            use_cross: true
            artifact_ext: so
          - target: armv7-unknown-linux-gnueabihf
            runner: ubuntu-22.04
            artifact_name: azul-linux-armv7
            use_cross: true
            artifact_ext: so
          - target: i686-pc-windows-msvc
            runner: windows-2022
            artifact_name: azul-windows-i686
            use_cross: false
            artifact_ext: dll
          - target: x86_64-apple-darwin
            runner: macos-14
            artifact_name: azul-macos-x86_64
            use_cross: false
            artifact_ext: dylib
          - target: powerpc64-unknown-linux-gnu
            runner: ubuntu-22.04
            artifact_name: azul-linux-ppc64
            use_cross: true
            artifact_ext: so
            experimental: true
            nfpm_arch: ppc64
          - target: s390x-unknown-linux-gnu
            runner: ubuntu-22.04
            artifact_name: azul-linux-s390x
            use_cross: true
            artifact_ext: so
            experimental: true
            nfpm_arch: s390x
          - target: riscv64gc-unknown-linux-gnu
            runner: ubuntu-22.04
            artifact_name: azul-linux-riscv64
            use_cross: true
            artifact_ext: so
            experimental: true
            nfpm_arch: riscv64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check cross-build artifact cache
        id: build-cache
        uses: actions/cache@v6
        with:
          path: |
            target/${{ matrix.target }}/prod-release
            target/codegen
          key: cross-build-${{ env.CACHE_BUST }}-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('css/src/**/*.rs', 'core/src/**/*.rs', 'layout/src/**/*.rs', 'dll/src/**/*.rs', 'dll/build.rs') }}
          restore-keys: |
            cross-build-${{ env.CACHE_BUST }}-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}-
            cross-build-${{ env.CACHE_BUST }}-${{ matrix.target }}-

      - name: Validate build cache
        id: cache-valid
        shell: bash
        run: |
          if [ "${{ steps.build-cache.outputs.cache-hit }}" != "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          DIR="target/${{ matrix.target }}/prod-release"
          if compgen -G "$DIR/*azul*" > /dev/null 2>&1; then
            echo "Cache valid - output artifacts present in $DIR"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Cache restored $DIR but no *azul* output found - rebuilding"
            rm -rf "$DIR"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust
        if: steps.cache-valid.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          targets: ${{ matrix.target }}
      - name: Install cross (Linux)
        if: steps.cache-valid.outputs.skip != 'true' && matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Download generated bindings (built once per OS)
        uses: actions/download-artifact@v8
        with:
          name: codegen-tree-${{ runner.os }}
          path: target/codegen

      - name: Build with cross (Linux cross-arch)
        if: steps.cache-valid.outputs.skip != 'true' && matrix.use_cross
        run: cross build --profile prod-release --target ${{ matrix.target }} -p azul-dll --features="build-dll"

      - name: Build natively (Windows/macOS cross-arch)
        if: steps.cache-valid.outputs.skip != 'true' && !matrix.use_cross
        run: cargo build --profile prod-release --target ${{ matrix.target }} -p azul-dll --features="build-dll"

      - name: Strip static lib (bitcode + debug)
        if: steps.cache-valid.outputs.skip != 'true' && (success() || matrix.experimental)
        shell: bash
        run: |
          shopt -s nullglob
          set -- target/${{ matrix.target }}/prod-release/*azul*.a \
                 target/${{ matrix.target }}/prod-release/azul*.lib
          bash scripts/strip_staticlib.sh --optional "$@"

      - name: Upload Artifacts
        if: ${{ success() || matrix.experimental }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            target/${{ matrix.target }}/prod-release/*azul*.${{ matrix.artifact_ext }}
            target/${{ matrix.target }}/prod-release/*azul*.a
            target/${{ matrix.target }}/prod-release/*azul*.lib
          retention-days: 30
          if-no-files-found: ${{ matrix.experimental && 'ignore' || 'warn' }}

  build_rust9x:
    # Builds azul for Windows 98/XP using the rust9x fork. Downloads the toolchain asset from GitHub Releases or builds it inline.
    name: Build rust9x (Win98/XP experimental)
    needs: [content_state_lint, documentation_paths, clippy, check_crates, feature_matrix_check, test_lib, codegen_windows]
    timeout-minutes: 360
    if: >-
      (github.event_name != 'workflow_dispatch' || github.event.inputs.run_mode == 'ci' || github.event.inputs.run_mode == 'deploy' || github.event.inputs.run_mode == 'website')
      && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
          || github.event_name == 'workflow_dispatch')
    runs-on: windows-2022
    continue-on-error: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RUST9X_TAG: rust9x-toolchain
      RUST9X_ASSET: rust9x-stage1-x86_64-pc-windows-msvc.tar.gz
    steps:
      - name: Checkout azul
        uses: actions/checkout@v7
        with:
          path: azul

      - name: Install Rust (for bootstrap + rustup)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0

      - name: Clone rust9x source (for std + toolchain link)
        shell: bash
        run: |
          GIT_TERMINAL_PROMPT=0 git clone --branch rust9x https://github.com/rust9x/rust.git rust9x

      - name: Download rust9x toolchain from Releases
        id: rust9x_asset
        shell: bash
        run: |
          mkdir -p dist
          found=false
          for attempt in 1 2 3; do
            if err=$(gh release download "$RUST9X_TAG" \
                       --repo "$GITHUB_REPOSITORY" \
                       --pattern "$RUST9X_ASSET" \
                       --clobber \
                       --dir dist 2>&1) && [ -s "dist/$RUST9X_ASSET" ]; then
              found=true
              echo "rust9x toolchain asset downloaded from release $RUST9X_TAG (attempt $attempt)"
              break
            fi
            echo "::warning::rust9x asset download attempt $attempt/3 failed: ${err:-<no output>}"
            rm -f "dist/$RUST9X_ASSET"
            sleep $((attempt * 15))
          done
          if [ "$found" = true ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::warning::rust9x toolchain asset not found on release '$RUST9X_TAG' after 3 attempts - building it inline (~90 min) and publishing it."
          fi

      - name: Install Python (for x.py)
        if: steps.rust9x_asset.outputs.found != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Ninja (for the LLVM source build)
        if: steps.rust9x_asset.outputs.found != 'true'
        run: choco install ninja -y

      - name: Build rust9x stage1 (asset missing)
        if: steps.rust9x_asset.outputs.found != 'true'
        shell: bash
        working-directory: rust9x
        timeout-minutes: 330
        run: |
          cp bootstrap.rust9x.toml bootstrap.toml 2>/dev/null || true
          python x.py build --stage 1 --set llvm.download-ci-llvm=false
          test -f build/x86_64-pc-windows-msvc/stage1/bin/rustc.exe

      - name: Publish rust9x toolchain to Releases
        if: steps.rust9x_asset.outputs.found != 'true'
        shell: bash
        run: |
          set -euo pipefail
          stage1=rust9x/build/x86_64-pc-windows-msvc/stage1

          find "$stage1" -name '*.pdb' -delete
          for tool in llc.exe opt.exe llvm-nm.exe llvm-objdump.exe; do
            find "$stage1" -name "$tool" -delete
          done
          test -f "$stage1/bin/rustc.exe"
          test -f "$stage1/lib/rustlib/x86_64-pc-windows-msvc/bin/rust-lld.exe"
          ls "$stage1"/bin/rustc_driver-*.dll >/dev/null

          tar -czf "$RUST9X_ASSET" -C rust9x/build/x86_64-pc-windows-msvc stage1
          gh release view "$RUST9X_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$RUST9X_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "rust9x toolchain (stage1)" \
              --notes "Prebuilt rust9x stage1 compiler." \
              --latest=false
          gh release upload "$RUST9X_TAG" "$RUST9X_ASSET" \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Unpack rust9x toolchain (asset present)
        if: steps.rust9x_asset.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rust9x/build/x86_64-pc-windows-msvc
          tar -xzf "dist/$RUST9X_ASSET" -C rust9x/build/x86_64-pc-windows-msvc \
            --exclude='stage1/lib/rustlib/rustc-src/rust' \
            --exclude='stage1/lib/rustlib/src/rust'
          test -f rust9x/build/x86_64-pc-windows-msvc/stage1/bin/rustc.exe

      - name: Link rust9x toolchain
        shell: bash
        run: rustup toolchain link rust9x "$(pwd)/rust9x/build/x86_64-pc-windows-msvc/stage1"

      - name: Download generated bindings (built once per OS)
        uses: actions/download-artifact@v8
        with:
          name: codegen-tree-${{ runner.os }}
          path: azul/target/codegen

      - name: Build azul with rust9x (i686, WinXP+)
        working-directory: azul
        shell: bash
        run: |
          cargo +rust9x build --release \
            --target i686-rust9x-windows-msvc \
            -p azul-dll --features="build-dll"

      - name: Upload rust9x artifact
        uses: actions/upload-artifact@v7
        with:
          name: azul-windows-i686-rust9x
          path: |
            azul/target/i686-rust9x-windows-msvc/release/azul.dll
            azul/target/i686-rust9x-windows-msvc/release/azul.lib
          retention-days: 30
          if-no-files-found: ignore

  test_lib:
    # Runs workspace unit tests on the dev profile so debug assertions and overflow checks remain enabled.
    name: Workspace Unit Tests (dev profile)
    needs: [content_state_lint, documentation_paths, clippy, check_crates]
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.run_mode == 'ci' || github.event.inputs.run_mode == 'deploy' || github.event.inputs.run_mode == 'website'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0

      - name: Rust build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/release/deps
            target/release/build
            target/release/.fingerprint
          key: test-lib-${{ env.CACHE_BUST }}-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('css/src/**/*.rs', 'core/src/**/*.rs', 'layout/src/**/*.rs') }}
          restore-keys: |
            test-lib-${{ env.CACHE_BUST }}-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            test-lib-${{ env.CACHE_BUST }}-${{ runner.os }}-

      - name: Run workspace lib + integration tests (debug-assertions + overflow-checks ON)
        env:
          AZ_REQUIRE_TEST_FONTS: "1"
        run: |
          set -o pipefail
          cargo test -p azul-css -p azul-core -p azul-layout -p webrender --lib --tests \
            --features azul-core/serde-json,azul-core/url,azul-layout/json,azul-layout/e2e-server \
            --no-fail-fast 2>&1 | tee workspace-tests.txt
          ./scripts/zero_test_guard.sh workspace-tests.txt

      - name: Run the system-style IO test (required-features gate)
        run: |
          set -o pipefail
          cargo test -p azul-css --features io --test test_system_style 2>&1 \
            | tee css-io-test.txt
          ./scripts/zero_test_guard.sh --strict css-io-test.txt

      - name: Run the JSON-driven E2E scenario target (required-features gate)
        run: |
          set -o pipefail
          cargo test -p azul-layout --test e2e_json --features e2e-server 2>&1 \
            | tee e2e-json.txt
          ./scripts/zero_test_guard.sh --strict e2e-json.txt

  test_heavy:
    # Runs Miri and Reftests.
    name: Run Heavy Tests (Miri + Reftests)
    needs: [content_state_lint, documentation_paths, clippy, check_crates, feature_matrix_check, test_lib, codegen_linux]
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.run_mode == 'ci' || github.event.inputs.run_mode == 'deploy' || github.event.inputs.run_mode == 'website'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
      - name: Install Miri
        run: |
          rustup toolchain install nightly --component miri
          cargo +nightly miri setup

      - name: Run Miri tests
        run: |
          cargo +nightly miri test --lib -p azul-core -- refany::

      - name: Download generated bindings (built once per OS)
        uses: actions/download-artifact@v8
        with:
          name: codegen-tree-${{ runner.os }}
          path: target/codegen

      - name: Download the azul-doc binary
        uses: actions/download-artifact@v8
        with:
          name: azul-doc-bin-${{ runner.os }}
          path: .azul-doc-bin

      - name: Make azul-doc executable
        run: |
          chmod +x .azul-doc-bin/azul-doc
          echo "$PWD/.azul-doc-bin" >> "$GITHUB_PATH"

      - name: Install the fonts the hermetic fontconfig pins
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-noto-mono
          fc-cache -f
          echo "families the reftest pins"
          for fam in "Noto Sans" "Noto Serif" "Noto Sans Mono"; do
            printf '%s -> %s\n' "$fam" "$(fc-match "$fam" 2>/dev/null || echo MISSING)"
          done

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: "150"

      - name: Cache Chrome reference images
        uses: actions/cache@v6
        with:
          path: doc/target/reftest/reftest_img/*_chrome.webp
          key: reftest-chrome-images-chrome150-${{ env.CACHE_BUST }}-${{ hashFiles('doc/working/*.xht') }}
          restore-keys: |
            reftest-chrome-images-chrome150-${{ env.CACHE_BUST }}-

      - name: Run reftests
        run: azul-doc reftest

      - name: Upload reftest results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reftest-results
          path: |
            doc/target/reftest/index.html
            doc/target/reftest/results.json
            doc/target/reftest/reftest_img/
          retention-days: 30
          if-no-files-found: warn

  coverage:
    # Code coverage.
    name: Code Coverage
    needs: [content_state_lint, documentation_paths, clippy, check_crates, feature_matrix_check, test_lib]
    if: >-
      (github.event_name != 'workflow_dispatch' || github.event.inputs.run_mode == 'ci' || github.event.inputs.run_mode == 'deploy' || github.event.inputs.run_mode == 'website')
      && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
          || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
      - name: Rust build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/bin/grcov
            target/coverage
          key: coverage-${{ env.CACHE_BUST }}-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('css/src/**/*.rs', 'core/src/**/*.rs', 'layout/src/**/*.rs', 'dll/src/**/*.rs', 'dll/build.rs') }}
          restore-keys: |
            coverage-${{ env.CACHE_BUST }}-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            coverage-${{ env.CACHE_BUST }}-${{ runner.os }}-

      - name: Install coverage tools
        run: |
          rustup component add llvm-tools-preview
          cargo install grcov

      - name: Run coverage
        run: bash scripts/coverage.sh --skip-install

      - name: Run coverage analysis
        if: always()
        run: python3 scripts/analyze_coverage.py coverage.txt | tee coverage_analysis.txt

      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: |
            coverage/
            coverage.txt
            coverage_analysis.txt
          retention-days: 30
          if-no-files-found: warn

  ffi_safety_tests:
    # FFI safety and leak regression tests on Ubuntu and macOS.
    name: FFI Safety Tests (${{ matrix.os }})
    needs: [content_state_lint, documentation_paths, clippy, check_crates, feature_matrix_check, test_lib, codegen_linux, codegen_macos]
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.run_mode == 'ci' || github.event.inputs.run_mode == 'deploy' || github.event.inputs.run_mode == 'website'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            timeout_cmd: timeout
          - os: macos-14
            timeout_cmd: gtimeout
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y clang lldb libv4l-dev

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-14'
        run: brew install coreutils

      - name: Install Miri
        run: |
          rustup toolchain install nightly --component miri
          cargo +nightly miri setup

      - name: Download generated bindings (built once per OS)
        uses: actions/download-artifact@v8
        with:
          name: codegen-tree-${{ runner.os }}
          path: target/codegen

      - name: Build azul-dll (debug)
        run: cargo build -p azul-dll --features build-dll

      - name: Leak regression tests (macOS only)
        if: matrix.os == 'macos-14'
        shell: bash
        run: |
          set -o pipefail
          cargo test -p azul-dll --features build-dll,e2e-test --test leak_regression 2>&1 | tee leak.txt
          ./scripts/zero_test_guard.sh --strict leak.txt

      - name: azul-dll unit tests (macOS backend)
        if: matrix.os == 'macos-14'
        shell: bash
        run: |
          set -o pipefail
          cargo test -p azul-dll --lib --features build-dll 2>&1 | tee dll-lib.txt
          ./scripts/zero_test_guard.sh --strict dll-lib.txt
          if ! grep -qE '^test desktop::shell2::macos::' dll-lib.txt; then
            echo "::error::no desktop::shell2::macos::* test ran - the macOS backend is still untested."
            exit 1
          fi

      - name: Compile C hello-world with ASan
        run: |
          cp target/codegen/azul.h examples/c/
          cd examples/c
          clang -g -O0 -fsanitize=address -I. hello-world.c -L../../target/debug -lazul -o hello-world-asan

      - name: Run C hello-world with ASan
        working-directory: examples/c
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/debug
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/target/debug
          ASAN_OPTIONS: detect_leaks=0,abort_on_error=1
          AZ_EXIT_SUCCESS_AFTER_FRAME_RENDER: "1"
          AZ_BACKEND: headless
        run: ${{ matrix.timeout_cmd }} 30 ./hello-world-asan

      - name: Run Miri on azul-dll
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
        run: |
          cargo +nightly miri test --lib -p azul-dll -- --nocapture \
            --skip desktop::extra \
            --skip desktop::shell2 \
            --skip desktop::display \
            --skip desktop::native_screenshot

  icu_parity:
    # Cross-backend ICU parity checks.
    needs: [supply_chain_preflight]
    name: ICU Parity (${{ matrix.backend.feature }})
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.run_mode == 'ci' || github.event.inputs.run_mode == 'deploy' || github.event.inputs.run_mode == 'website'
    runs-on: ${{ matrix.backend.os }}
    strategy:
      fail-fast: false
      matrix:
        backend:
          - os: ubuntu-22.04
            feature: icu
            run: true
          - os: macos-14
            feature: icu_macos
            run: true
          - os: windows-2022
            feature: icu_windows
            run: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check ICU parity cache
        id: icu-cache
        uses: actions/cache@v6
        with:
          path: target/icu-parity-done-${{ matrix.backend.feature }}
          key: icu-parity-${{ env.CACHE_BUST }}-${{ matrix.backend.os }}-${{ matrix.backend.feature }}-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('layout/src/**/*.rs', 'layout/tests/**/*.rs', 'layout/Cargo.toml') }}
          restore-keys: |
            icu-parity-${{ env.CACHE_BUST }}-${{ matrix.backend.os }}-${{ matrix.backend.feature }}-${{ hashFiles('Cargo.lock') }}-
            icu-parity-${{ env.CACHE_BUST }}-${{ matrix.backend.os }}-${{ matrix.backend.feature }}-

      - name: Install Rust
        if: steps.icu-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0

      - name: Run ICU parity tests (${{ matrix.backend.feature }})
        if: steps.icu-cache.outputs.cache-hit != 'true' && matrix.backend.run
        shell: bash
        run: |
          set -o pipefail
          cargo test -p azul-layout --test icu_parity --no-default-features --features ${{ matrix.backend.feature }} 2>&1 | tee icu-parity.txt
          ./scripts/zero_test_guard.sh --strict icu-parity.txt

      - name: Compile-check ICU parity test (${{ matrix.backend.feature }})
        if: steps.icu-cache.outputs.cache-hit != 'true' && !matrix.backend.run
        run: cargo test -p azul-layout --test icu_parity --no-default-features --features ${{ matrix.backend.feature }} --no-run

      - name: Mark ICU parity done
        if: steps.icu-cache.outputs.cache-hit != 'true'
        shell: bash
        run: mkdir -p target && echo "done" > target/icu-parity-done-${{ matrix.backend.feature }}

  c_compile_check:
    # Checks if azul.h compiles and links with various C compilers.
    name: C FFI Compile (${{ matrix.os }})
    needs: [content_state_lint, documentation_paths, clippy, check_crates, feature_matrix_check, test_lib, codegen_linux, codegen_macos, codegen_windows]
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.run_mode == 'ci' || github.event.inputs.run_mode == 'deploy' || github.event.inputs.run_mode == 'website'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: macos-14
          - os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0

      - name: Install clang (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libv4l-dev

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Download generated bindings (built once per OS)
        uses: actions/download-artifact@v8
        with:
          name: codegen-tree-${{ runner.os }}
          path: target/codegen

      - name: Build azul-dll (debug, build-once-per-ABI)
        run: cargo build -p azul-dll --features build-dll

      - name: Compile + link C hello-world (Linux)
        if: runner.os == 'Linux'
        run: |
          cp target/codegen/azul.h examples/c/
          cd examples/c
          for cc in gcc clang; do
            echo "::group::$cc"
            "$cc" -I. hello-world.c -L../../target/debug -lazul \
              -Wl,-rpath,../../target/debug -o "hw-$cc"
            echo "::endgroup::"
          done

      - name: Compile + link C hello-world (macOS)
        if: runner.os == 'macOS'
        run: |
          cp target/codegen/azul.h examples/c/
          cd examples/c
          clang -I. hello-world.c -L../../target/debug -lazul \
            -Wl,-rpath,@executable_path/../../target/debug -o hw-clang

      - name: Compile + link C hello-world (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          copy target\codegen\azul.h examples\c\ /Y
          cd examples\c
          cl /nologo /I . hello-world.c /Fe:hw-cl.exe /link /LIBPATH:..\..\target\debug azul.dll.lib || exit /b 1
          clang-cl /I . hello-world.c /Fe:hw-clang.exe /link /LIBPATH:..\..\target\debug azul.dll.lib || exit /b 1

  export_code_e2e:
    # Export code E2E tests for C/C++/Rust/Python.
    name: Export-Code E2E (rust/c/cpp/python)
    needs: [content_state_lint, documentation_paths, clippy, check_crates, feature_matrix_check, test_lib, codegen_linux]
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.run_mode == 'ci' || github.event.inputs.run_mode == 'deploy' || github.event.inputs.run_mode == 'website'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0

      - name: Install toolchains (clang/c++/python + headless GL deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libgl1-mesa-dev libx11-dev libxext-dev python3

      - name: Download generated bindings (built once per OS)
        uses: actions/download-artifact@v8
        with:
          name: codegen-tree-${{ runner.os }}
          path: target/codegen

      - name: Build azul-dll (release, with debug-server)
        run: cargo build --release -p azul-dll --features build-dll,debug-server

      - name: Codegen unit tests (HTML to code)
        shell: bash
        run: |
          set -o pipefail
          cargo test -p azul-dll --test xml_to_rust_compilation --test kitchen_sink_integration --features xml 2>&1 | tee xml-codegen-tests.txt
          ./scripts/zero_test_guard.sh --strict xml-codegen-tests.txt

      - name: Run export-code E2E (export live page -> compile 4 languages)
        run: bash tests/e2e/test_export_code.sh

      - name: Run undo/redo E2E (app-state mini-git via debug server)
