[[app]]
package = "AzWriter"
dir = "examples/azul-writer"
description = "a document editor - a full application"
platforms = ["linux", "macos-arm64", "macos-intel", "windows", "android", "ios"]
weight = 2
docker = true
mobile_lib = "mobile"

[[app]]
package = "AzCompanion"
dir = "examples/azul-companion"
name = "AzReview Companion"
description = "the phone remote control of AzReview: pan and zoom the review from your phone"
# Phones only: the macOS simulator window (companion_sim) is a development tool, not a demo.
platforms = ["android", "ios"]
weight = 1
bundle_id = "com.azul.azreview_companion"
mobile_lib = "mobile-iroh"
needs = ["AzReview on a Mac in the same network (the first build has a demo mode without one)"]
# Installed from AzReview over a cable, re-signed there: the device .app is UNSIGNED on purpose.
[app.android]
permissions = [
    "android.permission.ACCESS_WIFI_STATE",
    "android.permission.CHANGE_WIFI_MULTICAST_STATE",
    "android.permission.CAMERA",
]
# The first build has no network layer: its first screen offers "Try it without a Mac" (a stand-in Mac inside the
# app); the boot test presses it (by its accessibility name) and looks again: the remote must come up, no crash.
[app.smoke]
expect = "Connect to AzReview"
tap = "Try it without a Mac"
[app.ios]
# build-ios.sh writes NSLocalNetworkUsageDescription and NSBonjourServices = [_irohv1._udp] from this text
local_network = "AzReview Companion finds AzReview on your Mac over your Wi-Fi to use your phone as its remote control."
[app.ios.usage]
NSCameraUsageDescription = "AzReview Companion scans the pairing code AzReview shows on your Mac."
[app.ios.strings.de]
NSLocalNetworkUsageDescription = "AzReview Companion findet AzReview auf deinem Mac über dein WLAN, damit dein Telefon als Fernbedienung dient."
NSCameraUsageDescription = "AzReview Companion liest den Kopplungscode, den AzReview auf deinem Mac zeigt."

[[app]]
package = "AzBuilder"
dir = "examples/azul-builder"
description = "the drag-and-drop GUI builder - opens its editor in your browser"
# Desktop only: it drives its window from a browser tab on the same machine.
platforms = ["linux", "macos-arm64", "macos-intel", "windows"]
weight = 1
# QUESTION FOR THE OWNER (ledger): AzBuilder sets AZ_DEBUG and talks to the debug server of its libazul, and the shipped
# libazul (`dist`) has none (a door shut on purpose). Built against it, the demo opens its window and no editor in the
# browser. A variant of the library with `debug-server` for this one app ([lib.desktop-debug], four more library builds
# of ~25 minutes) would make it what the page says; until it is decided the page says what is missing.
needs = ["a libazul with the debug server (AZ_DEBUG) for its browser editor: the shipped libazul has none, so the editor does not open"]

