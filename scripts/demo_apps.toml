e2e_lib = "mobile-e2e-iroh"
[app.android]
# What the rows of the capabilities that need a permission need declared (`pm grant` / the row's own request answers them):
# camera and microphone (the capture rows and the recogniser), location (the geolocation row), activity recognition (the step counter).
permissions = [
  "android.permission.CAMERA",
  "android.permission.RECORD_AUDIO",
  "android.permission.ACCESS_FINE_LOCATION",
  "android.permission.ACCESS_COARSE_LOCATION",
  "android.permission.ACTIVITY_RECOGNITION",
]
[app.ios]
# build-ios.sh writes NSLocalNetworkUsageDescription and NSBonjourServices = [_irohv1._udp] from this text (the Simulator does not show the prompt: TN3179).
local_network = "AzSelfTest uses the local network to prove that discovery on it works."
[app.ios.usage]
NSCameraUsageDescription = "AzSelfTest opens the camera to prove that it works."
NSMicrophoneUsageDescription = "AzSelfTest opens the microphone to prove that it works."
NSLocationWhenInUseUsageDescription = "AzSelfTest reads your location to prove that it works."
NSFaceIDUsageDescription = "AzSelfTest asks for Face ID to prove that the sheet works."
NSMotionUsageDescription = "AzSelfTest reads the motion sensors to prove that they work."
NSSpeechRecognitionUsageDescription = "AzSelfTest listens to you to prove that speech recognition works."
