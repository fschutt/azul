# scripts/demo_apps.toml: the ONE list of the demo apps.
#
# Everything that names an Az app reads THIS file and nothing keeps a second list:
#   * rust.yml's `demos` run (the plan job turns it into the build matrices: scripts/demo_apps.py plan),
#   * the staging of the binaries, the status table of a run (scripts/demo_apps.py status),
#   * the release page's Demos section (doc/src/dllgen/demo_apps.rs, embedded at compile time),
#   * the tests that fail when an Az package of the workspace, this file, the generator and the
#     asset names disagree (scripts/demo_apps.py check; doc/src/dllgen/demo_apps_test.rs).
#
# An app is a cargo package of the workspace named AzXxx; its binary and its release assets carry the
# same name (dll/tests/demo_naming_contract.rs). Every build links the ONE prebuilt libazul of its target
# over the C ABI (no engine crate compiles in an app build: scripts/demo_gate.py), so a feature the
# engine needs is a feature of a [lib.*] below, never of an app's dependency on azul-dll.
#
# PLATFORMS of an app (what it is built for, what the page links when the build exists):
#   linux          x86_64
#   macos-arm64    Apple Silicon, macOS 11 and later
#   macos-intel    x86_64, macOS 10.12 and later (built on an Apple Silicon runner)
#   windows        x86_64
#   android        arm64 APK (+ an x86_64 emulator APK, the one the boot test starts)
#   ios            an UNSIGNED device .app (zipped) + a Simulator .app (zipped)
#
# The asset names (one function, doc/src/dllgen/demo_apps.rs and scripts/demo_apps.py agree, a test pins both):
#   <Name>-linux  <Name>-macos  <Name>-macos-intel  <Name>-windows.exe        (shipped as .tar.gz)
#   <Name>-android-arm64.apk  <Name>-android-x86_64.apk
#   <Name>-ios-device.app.zip  <Name>-ios-sim.app.zip

schema = 1

[android]
# The SDK levels of every APK, as scripts/android/AndroidManifest.xml says them (`demo_apps.py check` fails when the two differ):
# the lowest Android the apps run on (API 24, Android 7.0: the NDK camera and media stubs the engine links are API 24) and the
# level they are built for and tested at (34, Android 14; platforms;android-34 and build-tools 34.0.0 on the runner).
# Google requires apps that target 35 and later to support 16 KiB memory pages from 2027-02-01, and a device with 16 KiB pages
# cannot load a library whose segments are 4 KiB aligned: the libraries are linked 16 KiB aligned already (the rustflags of the
# Android targets in .cargo/config.toml) and scripts/android_elf_check.py fails a lib job or an app whose library is not, so
# raising target_sdk to 35 is a change of the template and of the emulator image, not of the libraries.
min_sdk = 24
target_sdk = 34

# ---------------------------------------------------------------------------------------------------
# The libazul every app of a target links. One build per target and variant, uploaded once.
# ---------------------------------------------------------------------------------------------------

[lib.desktop]
# What ships (build_lib): the full desktop libazul. Static archive: libazul.a (azul.lib on Windows).
features = "dist"
profile = "prod-release"
targets = ["linux", "macos-arm64", "macos-intel", "windows"]

[lib.mobile]
# The lean engine of a phone (the "mobile gate" of dll/Cargo.toml: no db-sqlite, no iroh) plus what the
# mobile apps ask for: AzMaps the tile worker, AzWriter the PDF export. Android adds android-activity.
features = "std,logging,link-static,a11y,map-tiles,pdf"
targets = ["android-arm64", "android-x86_64", "ios-device", "ios-sim"]

[lib.mobile-iroh]
# AzCompanion's transport: azul.iroh (QUIC on the local network). It brings ring and tokio onto a phone, so
# it is a variant of its own and only the apps that ask for it link it; the other apps never carry it.
features = "std,logging,link-static,a11y,map-tiles,pdf,iroh"
targets = ["android-arm64", "android-x86_64", "ios-device", "ios-sim"]
reason = "azul.iroh for the phone companion (AzReview talks to it over the local network)"

[lib.mobile-e2e]
# A QA variant, ARTIFACT ONLY: the phone libazul plus the engine's debug server and E2E scripting. AZ_DEBUG=<port> serves
# HTTP on the app's loopback (take_screenshot, click, get_dom, wait_frame, run_e2e_tests) and AZ_E2E=<file> runs a scenario in
# the process. An open debug port is what `e2e-scripting` exists to keep out of shipped builds, so this variant is never a
# release asset and never a link of the page (no app's mobile_lib may name it: scripts/demo_apps.py check), it is built only
# when a run asks for it (rust.yml's demos_e2e input) and only for the apps that say `e2e = true`, as
# <Name>-e2e-<column> in artifacts named demoe2e-*. No test-hooks: those stand in for the keyring and the biometrics and
# switch the headless backend on, which a phone must not get.
features = "std,logging,link-static,a11y,map-tiles,pdf,debug-server,e2e-scripting"
targets = ["android-x86_64", "ios-sim"]
artifact_only = true
reason = "the engine's debug server for the E2E and lifecycle tests of the phone shells (never shipped)"

# ---------------------------------------------------------------------------------------------------
# The apps. `weight` (1 light .. 3 heavy) is what the plan job balances the build groups by: the guess
# of the first run, replaced by the measured seconds of the status table.
# ---------------------------------------------------------------------------------------------------

[[app]]
package = "AzWidgets"
dir = "examples/azul-widgets"
description = "every built-in widget in one window"
platforms = ["linux", "macos-arm64", "macos-intel", "windows", "android", "ios"]
weight = 1
docker = true
mobile_lib = "mobile"
e2e = true   # also built against [lib.mobile-e2e] when a run asks for it (an artifact for the QA of the phone shells)

[[app]]
package = "AzMaps"
dir = "examples/azul-maps"
description = "a slippy-map tile viewer - async work in the UI"
platforms = ["linux", "macos-arm64", "macos-intel", "windows", "android", "ios"]
weight = 2
docker = true
mobile_lib = "mobile"
needs = ["a network connection for the map tiles"]
[app.android]
permissions = ["android.permission.ACCESS_FINE_LOCATION"]

[[app]]
package = "AzPaint"
dir = "examples/azul-paint"
description = "a small paint app - canvas drawing"
platforms = ["linux", "macos-arm64", "macos-intel", "windows", "android", "ios"]
weight = 1
docker = true
mobile_lib = "mobile"

[[app]]
