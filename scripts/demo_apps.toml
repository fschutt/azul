[[app]]
package = "AzMeet"
dir = "examples/azul-meet"
description = "screenshare, video and audio capture and playback"
platforms = ["linux", "macos-arm64", "macos-intel", "windows", "android", "ios"]
weight = 2
docker = true
# AzMeet's endpoint is azul.iroh (IrohEndpoint::bind): the lean `mobile` library has no iroh, so on a phone it cannot bind (bind_failure)
mobile_lib = "mobile-iroh"
e2e = true   # the QA variant too: the layout audit and the scripted checks of the phone apps (an artifact, never shipped)
e2e_lib = "mobile-e2e-iroh"
needs = ["a meeting server (the `meet` worker) to start or join a meeting"]
[app.android]
# The camera and the microphone, and what iroh's local discovery needs beside the multicast permission the Android template declares for
# every app (CHANGE_WIFI_MULTICAST_STATE: the engine takes a WifiManager.MulticastLock): the same as AzCompanion lists.
permissions = ["android.permission.CAMERA", "android.permission.RECORD_AUDIO", "android.permission.ACCESS_WIFI_STATE"]
[app.ios]
# build-ios.sh writes NSLocalNetworkUsageDescription and NSBonjourServices = [_irohv1._udp] from this text: without them iOS silently drops
# the local-network traffic of the app and the call goes through the relay only (the Simulator does not show the prompt: TN3179).
local_network = "AzMeet finds the other people of a meeting on your Wi-Fi to connect to them directly."
[app.ios.strings.de]
NSLocalNetworkUsageDescription = "AzMeet findet die anderen Teilnehmer eines Meetings in deinem WLAN, um dich direkt mit ihnen zu verbinden."
[app.ios.usage]
# iOS refuses the camera and the microphone without the text that says why (the engine refuses to start them and names the key):
# these texts are the ones of the Android permissions above, in the words of the prompt. build-ios.sh writes them (AZ_IOS_USAGE).
NSCameraUsageDescription = "AzMeet shows your camera to the other people in the meeting."
NSMicrophoneUsageDescription = "AzMeet sends your voice to the other people in the meeting."

