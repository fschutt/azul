# AzMail compiles azul-core on Linux and Windows (not on macOS: the macOS Intel leg of 2026-11-28 built it in 153 s with no engine crate, so
# macOS is not listed below): azul-mail-core uses `azul_core::tls::MailTls` (the connection policy of every mail client of the tree,
# shared with the Azlin Bridge, which runs without libazul), azul-icons-haiku depends on azul-core unconditionally and azul-appkit with
# its `trust` feature. azul-core defines the C ABI functions of libazul (`#[no_mangle] AzApp_*`), so an app that compiles it and links
# the prebuilt libazul has each of them twice: the link of the first Linux leg (2026-11-28) stopped in rust-lld with 12 duplicate symbols,
# and the engine gate would refuse the build even where a linker lets it pass (two copies of the engine's statics). The old exception
# ("the one engine crate an app may compile") is gone for that reason. The type belongs in the facade or in a crate of its own, and the
# icons crate must not depend on azul-core: ledger row. Until then the page says it, and the build is still tried on every run.
# UPDATE 2026-11-28 05:20: the CODE of that fix is on master (azul-mail-core's own `TlsPolicy`, azul-core a dev-dependency there: `cargo tree -i
# azul-core -p AzMail` finds nothing; the Android link of AzMail passes, run 46103694882). This entry and the phone platforms change when
# a demos run (or QA's phone build) has shown the desktop links: ci-wip/azmail-mobile has the manifest part. (azul-icons-haiku has azul-core
# as a dev-dependency only and azul-appkit behind `trust`, which AzMail does not use: the list above of who pulled it was too long.)
[app.known_failing]
linux = "AzMail compiles azul-core (the mail connection policy type), whose C ABI symbols are also in the prebuilt libazul: the link fails with duplicate symbols"
windows = "AzMail compiles azul-core (the mail connection policy type), whose C ABI symbols are also in the prebuilt libazul: the link fails with duplicate symbols"

