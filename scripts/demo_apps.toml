# scripts/demo_apps.toml: the ONE list of the demo apps.
#
# Everything that names an Az app reads THIS file and nothing keeps a second list:
#   * rust.yml's `demos` run (the plan job turns it into the build matrices: scripts/demo_apps.py plan),
#   * the staging of the binaries, the status table of a run (scripts/demo_apps.py status),
#   * the release page's Demos section (doc/src/dllgen/demo_apps.rs, embedded at compile time),
#   * the tests that fail when an Az package of the workspace, this file, the generator and the
#     asset names disagree (scripts/demo_apps.py check; doc/src/dllgen/demo_apps_test.rs).
#
# An app is a cargo package of the workspace named AzXxx; its binary and its release assets carry the
# same name (dll/tests/demo_naming_contract.rs). Every build links the ONE prebuilt libazul of its target
# over the C ABI (no engine crate compiles in an app build: scripts/demo_gate.py), so a feature the
# engine needs is a feature of a [lib.*] below, never of an app's dependency on azul-dll.
#
# PLATFORMS of an app (what it is built for, what the page links when the build exists):
#   linux          x86_64
#   macos-arm64    Apple Silicon, macOS 11 and later
#   macos-intel    x86_64, macOS 10.12 and later (built on an Apple Silicon runner)
#   windows        x86_64
#   android        arm64 APK (+ an x86_64 emulator APK, the one the boot test starts)
#   ios            an UNSIGNED device .app (zipped) + a Simulator .app (zipped)
#
# The asset names (one function, doc/src/dllgen/demo_apps.rs and scripts/demo_apps.py agree, a test pins both):
#   <Name>-linux  <Name>-macos  <Name>-macos-intel  <Name>-windows.exe        (shipped as .tar.gz)
#   <Name>-android-arm64.apk  <Name>-android-x86_64.apk
#   <Name>-ios-device.app.zip  <Name>-ios-sim.app.zip
#
# QA-ONLY APPS (`qa_only = true`, AzSelfTest: every device capability, one probe each): an app that exists only as a QA build. It is
# built when a run asks for QA builds (rust.yml's demos_e2e), for the phone columns of the artifact-only library its `mobile_lib` names
# (which is its QA library: android-arm64, android-x86_64, ios-sim), as <Name>-e2e-<column> in artifacts named demoe2e-*. It is no row or
# link of the release page, no release asset, no cell of the status table (its builds are lines of the QA table) and no entry of the
# shipped plan: scripts/demo_apps.py load() keeps it in m["qa_app"], apart from m["app"], and the page generator drops it when it reads
# this file. Phones only (platforms = ["android", "ios"]); `demo_apps.py check` refuses everything else.

schema = 1

[android]
# The SDK levels of every APK, as scripts/android/AndroidManifest.xml says them (`demo_apps.py check` fails when the two differ):
# the lowest Android the apps run on (API 24, Android 7.0: the NDK camera and media stubs the engine links are API 24) and the
# level they are built for and tested at (34, Android 14; platforms;android-34 and build-tools 34.0.0 on the runner).
# Google requires apps that target 35 and later to support 16 KiB memory pages from 2027-02-01, and a device with 16 KiB pages
# cannot load a library whose segments are 4 KiB aligned: the libraries are linked 16 KiB aligned already (the rustflags of the
# Android targets in .cargo/config.toml) and scripts/android_elf_check.py fails a lib job or an app whose library is not, so
# raising target_sdk to 35 is a change of the template and of the emulator image, not of the libraries.
min_sdk = 24
target_sdk = 34

# ---------------------------------------------------------------------------------------------------
# The libazul every app of a target links. One build per target and variant, uploaded once.
# ---------------------------------------------------------------------------------------------------

[lib.desktop]
# What ships (build_lib): the full desktop libazul. Static archive: libazul.a (azul.lib on Windows).
features = "dist"
profile = "prod-release"
targets = ["linux", "macos-arm64", "macos-intel", "windows"]

[lib.mobile]
# The lean engine of a phone (the "mobile gate" of dll/Cargo.toml: no db-sqlite, no iroh) plus what the
# mobile apps ask for: AzMaps the tile worker, AzWriter the PDF export. Android adds android-activity.
features = "std,logging,link-static,a11y,map-tiles,pdf"
targets = ["android-arm64", "android-x86_64", "ios-device", "ios-sim"]

[lib.mobile-iroh]
# azul.iroh (QUIC, direct on the local network or through a relay) for the phone apps that use it: AzCompanion (AzReview talks to it
# over the local network) and AzMeet (the people of a meeting reach each other directly). It brings ring and tokio onto a phone, so
# it is a variant of its own and only the apps that use iroh link it; the other apps never carry it. An app that uses iroh and
# links the lean `mobile` library cannot bind its endpoint on a phone (bind_failure): `demo_apps.py check` reads the sources of every
# phone app (and of the crates it depends on by path) and fails the preflight for an app that names no library with `iroh` here.
features = "std,logging,link-static,a11y,map-tiles,pdf,iroh"
targets = ["android-arm64", "android-x86_64", "ios-device", "ios-sim"]
reason = "azul.iroh for the phone apps that use it (AzCompanion: AzReview over the local network; AzMeet: the direct path of a meeting)"

[lib.mobile-e2e]
# A QA variant, ARTIFACT ONLY: the phone libazul plus the engine's debug server, E2E scripting and test hooks. AZ_DEBUG=<port>
# serves HTTP on the app's loopback (take_screenshot, click, get_dom, wait_frame, run_e2e_tests) and AZ_E2E=<file> runs a scenario
# in the process. An open debug port is what `e2e-scripting` exists to keep out of shipped builds, so this variant is never a
# release asset and never a link of the page (no app's mobile_lib may name it: scripts/demo_apps.py check), it is built only
# when a run asks for it (rust.yml's demos_e2e input) and only for the apps that say `e2e = true`, as <Name>-e2e-<column> in
# artifacts named demoe2e-*. `test-hooks` is the cargo feature of the failure injections of the QA matrix (AZ_GPU_FAIL=<stage>,
# ...): a build with it reads them from the environment, and its stand-ins (keyring, sign-in, sensors, speech, headless) switch on
# only when AZ_BACKEND=headless or AZ_E2E_TEST is set, which a phone run does not do. The library carries the marker
# AZLIN-BUILD-MARKER:test-hooks, and scripts/demo_lib.sh checks it both ways: a library WITHOUT the feature (everything that
# ships) must not hold the marker, this one must; `demo_apps.py check` refuses the feature in any lib that is not artifact_only.
features = "std,logging,link-static,a11y,map-tiles,pdf,debug-server,e2e-scripting,test-hooks"
# android-arm64 is the phone in the hand (the QA on a real device, AzSelfTest), android-x86_64 the emulator, ios-sim the Simulator
targets = ["android-arm64", "android-x86_64", "ios-sim"]
artifact_only = true
reason = "the engine's debug server for the E2E and lifecycle tests of the phone shells (never shipped)"

[lib.mobile-e2e-iroh]
# The QA twin of mobile-iroh: mobile-e2e (the debug server, E2E scripting and test hooks) plus iroh, for the QA builds (`e2e = true`) of
# the apps that use iroh (`e2e_lib = "mobile-e2e-iroh"`: AzMeet, AzCompanion). Artifact only, as mobile-e2e is, and for the same reasons.
features = "std,logging,link-static,a11y,map-tiles,pdf,debug-server,e2e-scripting,test-hooks,iroh"
targets = ["android-arm64", "android-x86_64", "ios-sim"]
artifact_only = true
reason = "the engine's debug server for the QA builds of the apps that use iroh (never shipped)"

[lib.desktop-e2e]
# The desktop QA variant, ARTIFACT ONLY, of the shipped libazul: the dist features plus the engine's debug server, E2E scripting and test
# hooks, as mobile-e2e is for the phones. An app cannot get them from its own dependency on azul-dll: `azul = link-dynamic` leaves the Az*
# symbols to the library, and a feature that compiles the engine into the app (azul/e2e-scripting) neither links nor passes the engine
# gate (scripts/demo_gate.py). So the E2E runs of the desktop apps link THIS library: the apps that say `e2e = true` are built against it
# as <Name>-e2e-<platform> (AzWidgets-e2e-linux) when a run asks for it (rust.yml's demos_e2e), in artifacts named demoe2e-*, never a
# release asset or a link of the page. scripts/demo_lib.sh checks the AZLIN-BUILD-MARKER:test-hooks both ways, as for the phones: the
# shipped `desktop` library must not hold it, this one must. scripts/ci/desktop_e2e_build.sh builds the library and the apps in one job.
features = "dist,debug-server,e2e-scripting,test-hooks"
profile = "prod-release"
targets = ["linux", "macos-arm64"]
artifact_only = true
reason = "the engine's debug server for the E2E runs of the desktop apps (never shipped)"

# ---------------------------------------------------------------------------------------------------
# The apps. `weight` (1 light .. 3 heavy) is what the plan job balances the build groups by: the guess
# of the first run, replaced by the measured seconds of the status table.
# ---------------------------------------------------------------------------------------------------

