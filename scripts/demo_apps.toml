[[app]]
package = "AzCompanion"
dir = "examples/azul-companion"
name = "AzReview Companion"
description = "the phone remote control of AzReview: pan and zoom the review from your phone"
# Phones only: the macOS simulator window (companion_sim) is a development tool, not a demo.
platforms = ["android", "ios"]
weight = 1
bundle_id = "com.azul.azreview_companion"
mobile_lib = "mobile-iroh"
# azul.iroh through the link crate (examples/azul-review-link, feature `azul`), not in the app's own sources: the check reads only those,
# so the app says it (an app that uses the iroh API in its own sources needs no such line)
iroh = true
e2e = true   # the QA variant too (with the debug server the press of its keys can be scripted): the iroh twin of the QA library
e2e_lib = "mobile-e2e-iroh"
needs = ["AzReview on a Mac in the same network (the first build has a demo mode without one)"]
# Installed from AzReview over a cable, re-signed there: the device .app is UNSIGNED on purpose.
[app.android]
permissions = [
    "android.permission.ACCESS_WIFI_STATE",
    "android.permission.CHANGE_WIFI_MULTICAST_STATE",
    "android.permission.CAMERA",
]
# The first build has no network layer: its first screen offers "Try it without a Mac" (a stand-in Mac inside the
# app); the boot test presses it (by its accessibility name) and looks again: the remote must come up, no crash.
[app.smoke]
expect = "Connect to AzReview"
tap = "Try it without a Mac"
# After the press the REMOTE is on: its header names the pretend Mac ("Demo Mac", with its latency), and the pairing screen is gone.
# (The names of the keys, from the companion's own screens: "Remote" and "Files" in the tab bar, "Settings", the quick buttons "Tone",
# "Explain", "Shorter" and "Doc"; "Demo Mac" is the safest single text.)
after_tap = ["Demo Mac"]
after_tap_gone = ["Connect to AzReview"]
# A FIRST press whose effect is short: "Scan QR code" only shows a toast for 2.5 s, which the press above, looked at 5 s later, would never
# see. The boot test presses it first and looks 1 s after: if the toast is there a tap reaches the app's callbacks, if not none does
# (the input path), which tells a broken demo key from a broken touch.
probe_tap = "Scan QR code"
probe_after = ["Scanning the code comes with the next version"]
# What the app says in its log (the engine's info log, which the boot tests switch on for an app that names log texts): a phone that was
# never paired touches no network until a pairing starts, so its window setup says so, and NO iroh endpoint is bound at all (the line
# `[iroh::endpoint] endpoint; id=...` is what a bound endpoint logs: the demo mode binds nothing either, "Demo Mac" above still comes up).
# A bind that comes back fails the boot test of the emulator and of the simulator.
log_present = ["AzCompanion: no Mac is paired: the local network is left alone until a pairing starts"]
log_absent = ["[iroh::endpoint] endpoint; id="]
[app.ios]
# build-ios.sh writes NSLocalNetworkUsageDescription and NSBonjourServices = [_irohv1._udp] from this text
local_network = "AzReview Companion finds AzReview on your Mac over your Wi-Fi to use your phone as its remote control."
[app.ios.usage]
NSCameraUsageDescription = "AzReview Companion scans the pairing code AzReview shows on your Mac."
[app.ios.strings.de]
NSLocalNetworkUsageDescription = "AzReview Companion findet AzReview auf deinem Mac über dein WLAN, damit dein Telefon als Fernbedienung dient."
NSCameraUsageDescription = "AzReview Companion liest den Kopplungscode, den AzReview auf deinem Mac zeigt."

