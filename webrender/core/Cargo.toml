[package]
readme = "../../README.md"
keywords = ["webrender", "graphics", "gpu", "rendering"]
categories = ["rendering"]
name = "webrender"
version = "0.62.0"
authors = ["Glenn Watson <gw@intuitionlibrary.com>"]
license = "MPL-2.0"
repository = "https://github.com/servo/webrender"
description = "A GPU accelerated 2D renderer for web content"
build = "build.rs"
edition = "2018"

[features]
default = []
# All profiling, capture/replay, and display_list_stats features removed for minimal build

[build-dependencies]
webrender_build = { path = "../build" }
brotli = "8"

[dependencies]
bincode = "2.0"
bitflags = "2"
byteorder = "1.0"
euclid = "0.22.10"
fxhash = "0.2.1"
lazy_static = "1"
log = "0.4"
num-traits = "0.2"
plane-split = "0.18"
rayon = "1"
smallvec = "1.15.1"
time = "0.3"
api = { version = "0.62.0", path = "../api", package = "webrender_api" }
webrender_build = { path = "../build" }
glyph_rasterizer = { version = "0.1.0", path = "../glyph", package = "wr_azul_glyph_rasterizer", default-features = false }
# azul-layout is NOT used by webrender (zero `azul_layout::` references in
# src/). It was pulling the crate with DEFAULT features, and cargo feature
# unification then forced that full set on every downstream consumer -
# `default-features = false` in an app's own azul-layout dep was silently
# defeated (miniword's font_async_registry pin never took effect). Kept
# minimal instead of deleted only if a future need appears; for now: gone.
azul-core = { path = "../../core" }
azul-css = { path = "../../css" }
svg_fmt = "0.4"
brotli-decompressor = "5"
derive_more = { version = "2.0", default-features = false, features = ["add_assign"] }
etagere = "0.2.13"
topological-sort = "0.2"
allocator-api2 = { version = "0.3.1", features = ["alloc"] }

[dev-dependencies]
# `mozangle` was here and is GONE (2026-08-20). It is upstream's ANGLE shader
# validator, used only by upstream's tests/angle_shader_validation.rs — a file
# this fork does not have, and `mozangle` appears in NO Rust source under
# webrender/. It is a full ANGLE C++ build, and it does not compile on
# macOS/arm64, so it made `cargo test -p webrender` impossible to run at all.
# That is why webrender's 96 unit tests were in no CI job.
rand = "0.9"
