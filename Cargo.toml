[workspace]
resolver = "2"
members = [
    "examples/rust", # Rust examples - depends on azul-dll
    "examples/azul-paint", # AzPaint demo (SUPER_PLAN_2 P2 goal app)
    "examples/azul-review", # AzReview — ink-first code review; tablet/pen stress test
    "examples/azul-widgets", # AzulWidgets demo (showcase of all widgets; W5 release demo)
    "examples/azul-maps", # AzMaps demo (SUPER_PLAN_2 P3 goal app)
    "examples/azul-writer", # AzWriter demo (office-2013-style document editor; bin azwriter)
    "examples/azul-meet", # azul-meet demo (SUPER_PLAN_2 P8 goal app: Udp + AudioSink + MicrophoneWidget)
    "dll", # dll module with auto-gen C functions (optional pyO3 support), depends on layout, core and css
    "doc", # doc / test generator, depends on layout, core and css
    "layout", # layout depends on core + css
    "core", # core depends on css
    "css", # CSS parser, does not depend on anything else
]
exclude = [
    ".claude-agents",
    "tests",
    "experiments",
    "third_party",
    # Standalone Wayland GUI-test injector (own [workspace] — keeps
    # wayland-client/scanner out of the azul lockfile). Lives under doc/
    # (the azul-doc tool's home) rather than as its own root folder.
    "doc/aztest",
]

[workspace.dependencies]
glean = "60.5.0"
gleam = "0.15.1"

[patch.crates-io]
# NOTE: the former `libudev-sys` and `gpu-video` git patches are GONE — they are
# now real published crates that dll/ depends on directly by a `package =` rename
# (cargo `[patch]` cannot rename a crate; a git patch also trips the "no [patch]
# on published deps" release gate). See dll/Cargo.toml:
#   * gilrs        -> package "gilrs-azul"     (-> gilrs-core-azul -> libudev-sys-azul),
#     the dlopen-libudev chain so gilrs cross-compiles to hosts without libudev.
#   * gpu-video    -> package "gpu-video-azul", the smelter PR #2109 fork (NVIDIA
#     Maxwell async-compute-queue fallback), published standalone.
# Swap both back to upstream crates.io once smelter#2109 ships in a release.
#
# Single azul-layout across the tree: point printpdf's azul-* deps (azul-css
# 0.0.8 / azul-core 0.0.8 / azul-layout 0.0.9) at OUR local workspace crates so
# there is one ParsedFont. printpdf itself now comes from crates.io (0.10.0, in
# dll/). Must NOT be an absolute path — breaks CI / `cargo metadata`.
azul-css = { path = "css" }
azul-core = { path = "core" }
azul-layout = { path = "layout" }
# agg-rust-azul is NOT patched (2026-08-13). It used to be, on a branch, while
# the LCD-text perf work was in flight: `blend_solid_hspan` allocated a fresh
# Vec for the 5-tap coverage distribution on EVERY span, and text produces
# hundreds of thousands of short spans per frame — the malloc/free pair, not
# the blending, dominated the LCD glyph sweep (22 ms/frame on a 30-paragraph
# document, against ~1 ms for the whole warm layout pass).
#
# That branch is now RELEASED as agg-rust-azul 1.1.3 and consumed from the
# registry (layout/Cargo.toml pins it). The patch had to go: `cargo publish`
# strips [patch], so a published azul-layout would have been built against
# 1.1.2 — which contains none of the series — and the "no [patch] on published
# deps" release gate rejected it, correctly. Land changes in the fork, publish,
# then bump; never re-add a git patch here.
# printpdf now comes from crates.io (0.12.x — requires azul-css/core 0.0.13 +
# azul-layout 0.0.13, all published). The azul-* path patches above redirect
# printpdf's azul deps to this one workspace copy, so there is a single
# azul-layout and NO printpdf git patch is needed. (dll/ pins printpdf 0.12.5.)
# rust-fontconfig: use crates.io (the vendored copy was a labelled REVERT; its
# only functional delta was a web_lift-only hashbrown workaround). core/ and
# layout/ pin `>=5.0, <5.1` (5.0 = the tiered FontFallbackChain — css groups
# with per-script faces, script groups, last_resort — plus the
# FcFallbackConfig generic-family model that absorbs the system fonts.conf
# aliases; azul's own alias parsing went away with it). dll/ and doc/ say
# `5.0`.
#
# THE SINGLE-COPY RULE still applies: every dependent's range must intersect
# on ONE version or cargo resolves TWO rust-fontconfigs into one binary — two
# independent FcFontCaches, i.e. layout resolving a font the renderer cannot
# find. printpdf 0.12.8+ declares `>=5.0, <6`, which intersects this
# workspace's `>=5.0, <5.1` at 5.0.x — one copy. printpdf 0.12.7 and older
# declare `<5` and CANNOT share a graph with this tree: the rust-fontconfig 5
# migration, the azul-* 0.0.16 bump and dll's printpdf 0.12.8 pin land as
# ONE atomic pair (see the 0.0.14 history: bump alone = two azul_layouts).
#
# THE RELEASE ORDER, because the bump makes this workspace unbuildable until
# printpdf catches up. printpdf pins azul-* EXACTLY (0.0.x semantics), so the
# moment css/core/layout become a new version the published printpdf falls off the
# [patch] above and drags crates.io azul-core 0.0.14 (rust-fontconfig <4.5)
# into the graph. Nothing in-tree links until step 3:
#
#   1. bump azul-css/core/layout + every internal `version =` reference, then
#      publish css, core, layout in that order. `cargo publish -p <crate>`
#      does NOT work here — it resolves the whole workspace and hits the
#      conflict above. Publish each from a copy of the crate directory with
#      `[workspace]` appended to its manifest to detach it; azul-core and
#      azul-layout need their predecessor on the index first.
#   2. printpdf's paired PR goes green on its own and publishes.
#   3. re-pin dll/Cargo.toml to the new printpdf; this tree goes green again.
#
# Do NOT shortcut step 1 with a `[patch.crates-io] printpdf = { path = .. }`.
# It builds locally and publishes something nobody has tested — the exact
# failure mode recorded for allsorts below.
#
# allsorts-azul is NOT patched. It used to be (`path = "third_party/allsorts"`), and that
# is exactly how azul-layout 0.0.9 shipped broken: the vendored tree grew
# `hint_glyph_with_flags_pp1` while the published allsorts-azul 0.17.0 kept the same
# version number without it, so the crate compiled here and failed for everyone else.
# `cargo publish` strips [patch] — anything that only builds under one is not publishable.
# The fork is released as allsorts-azul 0.17.1 and consumed from the registry like any
# other dependency. Land changes there, publish, then bump.
# turso: patched AGAIN (2026-09-07), minimally. The 2026-05 fork (branch
# no-io-uring-optional, on 0.1.5) was retired on 2026-08-31 because upstream
# had shipped what it carried — io_uring became an optional, non-default
# feature of turso_core in 0.7.x. That fix does not reach us: turso 0.7 added
# turso_sdk_kit, which enables `turso_core/io_uring` (and win_iocp) through a
# hard-coded dependency feature list, and `turso` depends on it with no way to
# opt out — true of every published version through 0.8.0-pre.8. So every
# consumer of the Rust API carries io-uring, whose prebuilt bindings refuse
# to compile on 32-bit Linux (i686, armv7 — both release artifacts).
#
# fschutt/turso branch azul/0.7.2-io-uring-optional is v0.7.2 plus one
# commit (3 files, +18/-11): sdk-kit forwards `io_uring` /
# `experimental_win_iocp` as opt-in features instead of forcing them, the VFS
# switch gates on them, and `turso` forwards them so an app can still opt in
# — shaped to be submitted upstream. A second commit only renames for
# publishing. It is NOT a [patch]: it is on crates.io as turso-azul,
# turso-sdk-kit-azul and turso-sync-sdk-kit-azul (all three, because
# `turso` and the sync kit name the sdk kit as a dependency, so the fix only
# reaches a consumer if the whole chain is the fork), and dll/ depends on it
# by `package = "turso-azul"` — the gilrs-azul / gpu-video-azul pattern, so
# `cargo publish` of anything here is unaffected. When upstream takes the
# change, switch back to `turso` and drop the three crates.
# tfd: use crates.io 0.1.2 (fork published) — the runtime-dlopen Win32 dialog
# resolver that links on every Windows target incl. legacy i686-rust9x. layout/
# declares tfd = "0.1", which resolves to 0.1.2.

[profile.release]
opt-level = 3
debug = 1         # Line-level debug info only (smaller than full debug=2).
strip = false     # Don't strip symbols so samply can resolve them.
lto = false       # No LTO for faster local builds.
codegen-units = 16 # Parallel codegen for faster local builds (~60s → ~20s for azul-layout).
panic = "abort"   # Removes stack unwinding code (drastic size reduction).
                  # DELIBERATE for dist artifacts too (prod-release inherits
                  # this): a Rust panic inside libazul aborts the host process
                  # instead of unwinding across the FFI boundary (which is UB).
                  # CI asserts the shipped artifacts stay abort ("Assert
                  # panic=abort" step in rust.yml). eh_frame still present =
                  # rustc's default force-unwind-tables (crash backtraces),
                  # NOT a panic-strategy leak — see size audit §2.10d.

# [g140 az-web-lift] TRIED + REVERTED: per-package opt-level=1 for azul-layout/core/css to
# de-SROA the native code remill lifts. RESULT = NET REGRESSION: opt-1 produced different
# machine code that hit NEW unlifted jump-tables/instructions (missing_block 0→39), broke font
# parse + text shaping (which opt-3 handled), and the dom_children loop STILL read len=0. The
# careful lift fixes (FMUL, jump-table devirt, etc.) are tuned to opt-3 codegen; changing opt
# disrupts the lift broadly. Conclusion: opt-level tuning is not the fix — the real fix is in
# the transpiler's memory-lowering/opt of the (correct) remill IR. Keep at opt-3 (release default).

# azul-doc is the docs/codegen/deploy tool, not a shipped library: its own
# crate is the largest single compile in the workspace and gains nothing from
# -O3 with debuginfo, while everything heavy it drives (layout, rendering,
# fonts) lives in the engine crates, which keep the settings above. Compiling
# just this crate at -O1 without debuginfo and with incremental codegen turns
# the five-minute rebuild after every docgen edit into seconds. The generated
# site is byte-identical either way. (The g140 note above is about the crates
# the web lift transpiles; azul-doc is never lifted.)
[profile.release.package.azul-doc]
opt-level = 1
debug = false
incremental = true
codegen-units = 256

# CI / distribution profile: maximum optimization, slow to build.
#   cargo build --profile prod-release -p azul-dll --features build-dll
[profile.prod-release]
inherits = "release"
opt-level = 3
lto = "thin"      # Thin LTO: good size/perf wins without full-LTO build cost.
codegen-units = 1 # Single codegen unit for best optimization.
strip = "symbols" # Strip symbols for smallest binary.
# Distribution profile carries NO debuginfo. `release` sets debug=1 for local
# samply profiling, but that line-table data bloats the `libazul.a` STATICLIB
# to ~1 GB: cargo's `strip` only strips final linked outputs (.so/.dylib/exe),
# NOT `.a` archives, so the archive otherwise keeps debug=1 line tables for the
# whole azul + webrender + deps object set un-GC'd. debug=0 is the real fix; CI
# also runs `strip --strip-debug` on the `.a` as a belt (removes local symbols).
debug = 0

# Minimum-size profile: smallest possible binary without losing functionality.
#   cargo build --profile min-size -p azul-dll --features build-dll
[profile.min-size]
inherits = "release"
opt-level = "z"   # Optimize for size over speed.
lto = "fat"       # Full LTO: maximum cross-crate inlining + dead code elimination.
codegen-units = 1 # Single codegen unit for best optimization.
strip = "symbols" # Strip debug symbols and local symbols.
debug = 0         # No debug info at all.

[profile.coverage]
inherits = "release"
strip = false     # Keep symbols for grcov source mapping.
debug = true      # Full debug info for line-level coverage.
lto = false       # Disable LTO so grcov can see individual object files.
codegen-units = 16
panic = "unwind"  # Tests need unwinding for #[should_panic] etc.

