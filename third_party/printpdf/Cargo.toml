path = "examples/margin_collapse_comprehensive.rs"
required-features = ["html"]

[[example]]
name = "html_full_debug"
path = "examples/html_full_debug.rs"
required-features = ["html"]

[[example]]
name = "optimize_pdf"
required-features = ["images"]

[[example]]
name = "multipage"
required-features = []

[[example]]
name = "text"
required-features = []

[[example]]
name = "pagination_test"
required-features = ["html"]

[[example]]
name = "otf-font-subset"
path = "examples/otf-font-subset.rs"
required-features = []

[[example]]
name = "baseline_alignment"
path = "examples/baseline_alignment.rs"
