<section class="feature-section" data-example-id="$$EXAMPLE_ID$$" data-is-first="$$IS_FIRST$$">
  <div class="container">
    <div class="ui-example-grid">
      <div class="feature-intro">
        <h2 class="feature-title">$$EXAMPLE_TITLE$$</h2>
        <div class="description">$$EXAMPLE_DESCRIPTION$$</div>
      </div>
      <div class="feature-image">
        <div class="screenshot-wrapper">
          <span class="showcase linux">
            <img class="shot-light" src="$$EXAMPLE_IMAGE_SOURCE_LINUX_LIGHT$$" alt="$$EXAMPLE_IMAGE_ALT$$" loading="lazy">
            <img class="shot-dark" src="$$EXAMPLE_IMAGE_SOURCE_LINUX_DARK$$" alt="$$EXAMPLE_IMAGE_ALT$$" loading="lazy">
          </span>
          <span class="showcase mac">
            <img class="shot-light" src="$$EXAMPLE_IMAGE_SOURCE_MAC_LIGHT$$" alt="$$EXAMPLE_IMAGE_ALT$$" loading="lazy">
            <img class="shot-dark" src="$$EXAMPLE_IMAGE_SOURCE_MAC_DARK$$" alt="$$EXAMPLE_IMAGE_ALT$$" loading="lazy">
          </span>
          <span class="showcase windows">
            <img class="shot-light" src="$$EXAMPLE_IMAGE_SOURCE_WINDOWS_LIGHT$$" alt="$$EXAMPLE_IMAGE_ALT$$" loading="lazy">
            <img class="shot-dark" src="$$EXAMPLE_IMAGE_SOURCE_WINDOWS_DARK$$" alt="$$EXAMPLE_IMAGE_ALT$$" loading="lazy">
          </span>
        </div>
      </div>
      <div class="feature-code">
        <div class="tab-bar example-toolbar">
          <div class="lang-grid">
            $$LANGUAGE_TABS$$
          </div>
          <div class="install-controls">
            <select class="install-select" onchange="selectInstallVariant(this.value)">
              <!-- One option per documented route of the selected language; populated by JavaScript -->
            </select>
          </div>
        </div>
        <div class="code-panel">
          <div class="install-commands" style="$$INSTALL_DISPLAY$$">
            <!-- Populated by JavaScript -->
          </div>
          <div class="example-code" id="example-code-$$EXAMPLE_ID$$">
            <pre>$$EXAMPLE_CODE$$</pre>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
