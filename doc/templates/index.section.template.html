<section class="feature-section" data-example-id="$$EXAMPLE_ID$$" data-is-first="$$IS_FIRST$$">
  <div class="container">
    <div class="ui-example-grid">
      <div class="feature-intro">
        <h2 class="feature-title">$$EXAMPLE_TITLE$$</h2>
      </div>
      <div class="feature-image">
        <div class="screenshot-wrapper">
          <img class="showcase linux" src="$$EXAMPLE_IMAGE_SOURCE_LINUX$$" alt="$$EXAMPLE_IMAGE_ALT$$" loading="lazy">
          <img class="showcase mac" src="$$EXAMPLE_IMAGE_SOURCE_MAC$$" alt="$$EXAMPLE_IMAGE_ALT$$" loading="lazy">
          <img class="showcase windows" src="$$EXAMPLE_IMAGE_SOURCE_WINDOWS$$" alt="$$EXAMPLE_IMAGE_ALT$$" loading="lazy">
        </div>
      </div>
      <div class="feature-code">
        <div class="tab-bar example-toolbar">
          <div class="lang-grid">
            $$LANGUAGE_TABS$$
          </div>
          <div class="install-controls">
            <select class="install-select" onchange="selectInstallVariant(this.value)">
              <!-- One option per documented route of the selected language; populated by JavaScript -->
            </select>
          </div>
        </div>
        <div class="code-panel">
          <div class="install-commands" style="$$INSTALL_DISPLAY$$">
            <!-- Populated by JavaScript -->
          </div>
          <div class="example-code" id="example-code-$$EXAMPLE_ID$$">
            <pre>$$EXAMPLE_CODE$$</pre>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
