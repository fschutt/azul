# Cross-compilation config for Azul
#
# Linux:   cargo zigbuild --release --target x86_64-unknown-linux-gnu
# Windows: brew install mingw-w64 && cargo build --release --target x86_64-pc-windows-gnu
# iOS:     cargo build --target aarch64-apple-ios-sim    (requires Xcode + iOS SDK)
# Android: cargo ndk -t arm64-v8a build                  (requires ANDROID_NDK_HOME)
#
# The Android linker paths below assume the Homebrew layout from
# `brew install --cask android-commandlinetools` and `sdkmanager 'ndk;27.0.12077973'`.
# If your NDK lives elsewhere, override via environment:
# CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=...

[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
ar = "x86_64-w64-mingw32-ar"

[target.aarch64-linux-android]
linker = "/opt/homebrew/share/android-commandlinetools/ndk/27.0.12077973/toolchains/llvm/prebuilt/darwin-x86_64/bin/aarch64-linux-android24-clang"
ar     = "/opt/homebrew/share/android-commandlinetools/ndk/27.0.12077973/toolchains/llvm/prebuilt/darwin-x86_64/bin/llvm-ar"

[target.x86_64-linux-android]
linker = "/opt/homebrew/share/android-commandlinetools/ndk/27.0.12077973/toolchains/llvm/prebuilt/darwin-x86_64/bin/x86_64-linux-android24-clang"
ar     = "/opt/homebrew/share/android-commandlinetools/ndk/27.0.12077973/toolchains/llvm/prebuilt/darwin-x86_64/bin/llvm-ar"

# Legacy Windows (rust9x, i686, WinXP+)
#
# Dependencies like `getrandom` call `RtlGenRandom` from `advapi32.lib`. Older
# Rust `std` implicitly linked this, but modern `std` links `bcrypt` instead.
# This causes an unresolved symbol error (LNK2019) on this target. Manually
# linking `advapi32.lib` fixes the build for XP+.
#
# (Note: Pre-XP/Win98 targets would instead require a custom dlopen approach
# to avoid blocking image load).
[target.i686-rust9x-windows-msvc]
rustflags = ["-Clink-arg=advapi32.lib"]

# NOTE: Do not add `[profile]` overrides here.
#
# Profile settings in `.cargo/config.toml` silently override the workspace
# `Cargo.toml`. Previously, an `lto = "thin"` setting here overrode the local
# `lto = false` setting, forcing massive recompiles for tests and local builds.
# Local release builds should remain fast; CI handles LTO via `--profile prod-release`.
